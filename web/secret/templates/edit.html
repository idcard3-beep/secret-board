<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 수정</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='security.css') }}" />
    <style>
      .loading {
        text-align: center;
        padding: 60px;
        color: #666;
        font-size: 18px;
      }

      .error {
        text-align: center;
        padding: 40px;
        color: #d32f2f;
        background-color: #ffebee;
        border-radius: 8px;
        margin: 20px 0;
        display: none;
        border-left: 4px solid #d32f2f;
      }

      .edit-form {
        display: none;
      }

      .loading::after {
        content: '';
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- MSSQL 상태 표시 -->
    <div
      style="
        background-color: #e3f2fd;
        padding: 10px;
        text-align: center;
        border: 1px solid #2196f3;
        margin-bottom: 20px;
      "
    >
      <span style="color: #1976d2; font-weight: bold">🗄️ 수정 확인</span>
    </div>

    <!-- 로딩 상태 -->
    <div id="loading" class="loading">📡 게시글을 불러오는 중...</div>

    <!-- 에러 상태 -->
    <div id="error" class="error">
      <h3>💥 오류가 발생했습니다</h3>
      <p id="error-message"></p>
    </div>

    <!-- 수정 폼 -->
    <div id="edit-form" class="edit-form">
      <h2>게시글 수정</h2>
      <form id="ticketForm">
        <input type="hidden" id="ticket-id" name="id" />

        <label>이름(선택)</label>
        <input
          type="text"
          id="author-name"
          name="author_name"
          placeholder="이름을 입력하세요"
        />

        <label>메모란(선택)</label>
        <input
          type="text"
          id="author-contact"
          name="author_contact"
          placeholder="메모를 입력하세요"
        />

        <label>제목</label>
        <input type="text" id="title" name="title" required />

        <label>내용</label>
        <textarea id="content" name="content" required rows="6"></textarea>

        <div class="form-actions">
          <button type="submit">수정 완료</button>
          <button type="button" onclick="cancelEdit()">취소</button>
        </div>
      </form>
    </div>

    <script src="{{ url_for('static', filename='edit.js') }}"></script>

    <!-- 회원 세션 전역 변수 -->
    <script src="{{ url_for('static', filename='member_session.js') }}"></script>
    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="{{ url_for('static', filename='admin_session.js') }}"></script>
    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="{{ url_for('static', filename='security.js') }}"></script>
  </body>
</html>
