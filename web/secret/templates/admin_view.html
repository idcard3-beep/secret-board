<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8" /> <title>관리자 - 상담 상세</title> <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" /> <link rel="stylesheet" href="{{ url_for('static', filename='security.css') }}" /> <style> .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px 0; border-bottom: 2px solid #e9ecef; } .admin-title { margin: 0; color: #333; } .nav-button { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 25px; font-weight: 500; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3); font-size: 14px; } .nav-button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); } .nav-button::before { content: '← '; font-weight: bold; } /* 메시지 컨테이너 스타일 */ .message-container { position: relative; margin-bottom: 10px; padding: 10px; border-radius: 8px; background-color: #f8f9fa; } .message-container.admin { background-color: #e3f2fd; border-left: 4px solid #2196f3; } .message-container.user { background-color: #fff3e0; border-left: 4px solid #ff9800; } .message-content { margin-bottom: 8px; word-wrap: break-word; } .message-actions { display: flex; gap: 8px; margin-top: 8px; } .message-actions button { padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.3s ease; } .btn-edit { background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%); color: white; } .btn-edit:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3); } .btn-delete { background: linear-gradient(135deg, #f44336 0%, #e57373 100%); color: white; } .btn-delete:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(244, 67, 54, 0.3); } .btn-save { background: linear-gradient(135deg, #2196f3 0%, #64b5f6 100%); color: white; } .btn-save:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(33, 150, 243, 0.3); } .btn-cancel { background: linear-gradient(135deg, #9e9e9e 0%, #bdbdbd 100%); color: white; } .btn-cancel:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(158, 158, 158, 0.3); } .edit-textarea { width: 100%; min-height: 80px; padding: 10px; border: 2px solid #2196f3; border-radius: 4px; font-size: 14px; resize: vertical; box-sizing: border-box; } .edit-textarea:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1); } </style> </head> <body> <div style=" background-color: #e3f2fd; padding: 10px; text-align: center; border: 1px solid #2196f3; margin-bottom: 20px; " > <span style="color: #1976d2; font-weight: bold" >🗄️ 상담 요청 (관리자 답변 달기)</span > </div> <div class="admin-header"> <h2 class="admin-title">관리자 - 상담 상세</h2> <a href="/secret/admin_list" class="nav-button">상담요청 목록</a> </div> <div id="meta"></div> <article id="content" class="card"></article> <section class="card"> <h3>스레드</h3> <div id="thread"></div> <textarea id="adminReply" placeholder="관리자 답변을 입력하세요" rows="4" ></textarea ><br /> <div style="margin-top: 15px"> <button onclick="sendAdminReply()" style="margin-right: 10px"> 답변 등록 </button> <a href="/secret/admin_list" class="nav-button" style="text-decoration: none; display: inline-flex" >목록으로 돌아가기</a > </div> </section> <script src="{{ url_for('static', filename='member_session.js') }}"></script> <script src="{{ url_for('static', filename='admin_session.js') }}"></script> <script> (function checkAdminLogin() { // admin_session.js가 로드될 때까지 대기 if (typeof window.getAdminSession === 'function') { const adminSession = window.getAdminSession(); // 관리자 세션이 없거나 로그인 상태가 아니면 로그인 페이지로 리다이렉트 if ( !adminSession || !adminSession.isLoggedIn || !adminSession.admin_id ) { alert('관리자 로그인이 필요합니다.'); window.location.href = '/secret/admin_login'; return; } console.log('관리자 인증 완료:', adminSession.username); } else { console.error('admin_session.js가 로드되지 않았습니다.'); alert('관리자 세션 관리 스크립트를 로드할 수 없습니다.'); window.location.href = '/secret/admin_login'; } })(); </script> <script src="{{ url_for('static', filename='admin_view.js') }}"></script> <script src="{{ url_for('static', filename='security.js') }}"></script> </body> </html>
