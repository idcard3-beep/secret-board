<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8" /> <title>관리자 로그인</title> <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" /> <link rel="stylesheet" href="{{ url_for('static', filename='security.css') }}" /> <link rel="stylesheet" href="{{ url_for('static', filename='admin_login.css') }}" /> </head> <body> <div class="login-container"> <h2 class="login-title">🔐 관리자 로그인</h2> <div class="default-info"> <strong>기본 관리자 계정 입니다.</strong><br /> 상담요청은 로그인 없이 비밀로 상담요청 할 수 있습니다.<br /> 로그인 없이 상담요청 하세요. </div> <div id="error-message" class="error-message"></div> <div id="success-message" class="success-message"></div> <form id="loginForm"> <label>관리자 ID</label> <input type="text" name="admin_id" required placeholder="관리자 ID를 입력하세요" /> <label>비밀번호</label> <div class="password-container"> <input type="password" name="password" id="password" required placeholder="비밀번호를 입력하세요" /> <button type="button" class="password-toggle" onclick="togglePassword()" > <div class="eye-icon" id="eye-icon"></div> </button> </div> <div class="form-actions"> <button type="submit">로그인</button> <button type="button" onclick="handleCancel()">취소</button> </div> </form> </div> <script> function togglePassword() { const passwordField = document.getElementById('password'); const eyeIcon = document.getElementById('eye-icon'); if (passwordField.type === 'password') { passwordField.type = 'text'; eyeIcon.innerHTML = '<div class="eye-slash"></div>'; eyeIcon.classList.add('hidden'); } else { passwordField.type = 'password'; eyeIcon.innerHTML = ''; eyeIcon.classList.remove('hidden'); } } </script> <script src="{{ url_for('static', filename='member_session.js') }}"></script> <script src="{{ url_for('static', filename='admin_session.js') }}"></script> <script src="{{ url_for('static', filename='admin_login.js') }}"></script> <script src="{{ url_for('static', filename='security.js') }}"></script> </body> </html>
