<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8" /> <title>관리자 로그인</title> <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" /> <link rel="stylesheet" href="{{ url_for('static', filename='security.css') }}" /> <style> .login-container { max-width: 400px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); } .login-title { text-align: center; color: #333; margin-bottom: 12px; margin-top: 0; font-size: 20px; line-height: 1.2; } .default-info { background: #f8f9fa; padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; font-size: 12px; color: #666; border-left: 3px solid #007bff; line-height: 1.4; } .default-info strong { color: #333; } .error-message { background: #ffebee; color: #d32f2f; padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #d32f2f; display: none; font-size: 12px; white-space: pre-line; line-height: 1.4; } .success-message { background: #e8f5e8; color: #2e7d32; padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #2e7d32; display: none; font-size: 12px; line-height: 1.4; } .password-container { position: relative; } .password-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; width: 20px; height: 20px; padding: 0; display: flex; align-items: center; justify-content: center; } .password-toggle:hover { opacity: 0.7; } .eye-icon { width: 18px; height: 18px; position: relative; } .eye-icon::before { content: ''; position: absolute; width: 18px; height: 9px; border: 2px solid #666; border-bottom: none; border-radius: 18px 18px 0 0; top: 5px; } .eye-icon::after { content: ''; position: absolute; width: 4px; height: 4px; background: #666; border-radius: 50%; top: 7px; left: 7px; } .eye-icon.hidden::before { border-bottom: 2px solid #666; border-radius: 18px; transform: rotate(0deg); } .eye-icon.hidden::after { display: none; } .eye-icon.hidden { position: relative; } .eye-icon.hidden::before { content: ''; position: absolute; width: 18px; height: 9px; border: 2px solid #666; border-radius: 18px 18px 0 0; top: 5px; } .eye-slash { position: absolute; width: 20px; height: 2px; background: #666; top: 9px; left: -1px; transform: rotate(45deg); } /* 효율적인 디자인을 위한 간격 최소화 */ #loginForm { margin: 0; padding: 0; } #loginForm label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 4px; margin-top: 10px; } #loginForm label:first-of-type { margin-top: 0; } #loginForm input { width: 100%; padding: 8px 12px; border: 2px solid #e9ecef; border-radius: 6px; margin: 0 0 4px 0; font-size: 14px; font-family: inherit; transition: all 0.3s ease; background: #fafbfc; box-sizing: border-box; } #loginForm input:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); } #loginForm input::placeholder { color: #adb5bd; font-size: 13px; } .form-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid #e9ecef; justify-content: center; } .form-actions button { padding: 8px 20px; font-size: 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s ease; min-width: 80px; } .form-actions button[type="submit"] { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; } .form-actions button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); } .form-actions button[type="button"] { background: #6c757d; color: white; } .form-actions button[type="button"]:hover { background: #5a6268; transform: translateY(-1px); } </style> </head> <body> <div class="login-container"> <h2 class="login-title">🔐 관리자 로그인</h2> <div class="default-info"> <strong>기본 관리자 계정 입니다.</strong><br /> 상담요청은 로그인 없이 비밀로 상담요청 할 수 있습니다.<br /> 로그인 없이 상담요청 하세요. </div> <div id="error-message" class="error-message"></div> <div id="success-message" class="success-message"></div> <form id="loginForm"> <label>관리자 ID</label> <input type="text" name="admin_id" required placeholder="관리자 ID를 입력하세요" /> <label>비밀번호</label> <div class="password-container"> <input type="password" name="password" id="password" required placeholder="비밀번호를 입력하세요" /> <button type="button" class="password-toggle" onclick="togglePassword()" > <div class="eye-icon" id="eye-icon"></div> </button> </div> <div class="form-actions"> <button type="submit">로그인</button> <button type="button" onclick="handleCancel()">취소</button> </div> </form> </div> <script> function togglePassword() { const passwordField = document.getElementById('password'); const eyeIcon = document.getElementById('eye-icon'); if (passwordField.type === 'password') { passwordField.type = 'text'; eyeIcon.innerHTML = '<div class="eye-slash"></div>'; eyeIcon.classList.add('hidden'); } else { passwordField.type = 'password'; eyeIcon.innerHTML = ''; eyeIcon.classList.remove('hidden'); } } // 취소 버튼 처리 함수 function handleCancel() { console.log('🚪 관리자 로그인 취소 버튼 클릭'); // 1. 관리자 세션 전역 변수 완전 초기화 if (typeof window.clearAdminSession === 'function') { window.clearAdminSession(); console.log('✅ 관리자 세션 전역 변수 초기화 완료'); } else { console.warn('⚠️ clearAdminSession 함수를 찾을 수 없습니다'); } // 2. 팝업 창인 경우 부모 창에 취소 메시지 전송 후 닫기 if (window.opener) { console.log('🔔 부모 창에 로그인 취소 메시지 전송'); try { window.opener.postMessage( { type: 'ADMIN_LOGIN_CANCELLED', }, '*' ); } catch (e) { console.warn('⚠️ 부모 창 메시지 전송 실패:', e); } // 팝업 창 닫기 window.close(); } else { // 일반 페이지에서 접근한 경우 홈으로 이동 console.log('🏠 홈 페이지로 이동'); location.href = '/secret/'; } } </script> <script src="{{ url_for('static', filename='member_session.js') }}"></script> <script src="{{ url_for('static', filename='admin_session.js') }}"></script> <script src="{{ url_for('static', filename='admin_login.js') }}"></script> <script src="{{ url_for('static', filename='security.js') }}"></script> </body> </html>
