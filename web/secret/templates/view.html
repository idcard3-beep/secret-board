<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 상세보기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='security.css') }}" />
    <style>
      .container {
        max-width: 800px;
        margin: 20px auto;
        padding: 30px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .loading {
        text-align: center;
        padding: 60px;
        color: #666;
        font-size: 18px;
      }

      .error {
        text-align: center;
        padding: 40px;
        color: #d32f2f;
        background-color: #ffebee;
        border-radius: 8px;
        margin: 20px 0;
        display: none;
        border-left: 4px solid #d32f2f;
      }

      .ticket-content {
        display: none;
      }

      .password-form {
        max-width: 400px;
        margin: 40px auto;
        padding: 30px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .password-form h2 {
        margin-bottom: 10px;
        color: #333;
      }

      .password-form p {
        margin-bottom: 20px;
        color: #666;
      }

      .password-form input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box;
      }

      .password-form input[type="password"]:focus {
        outline: none;
        border-color: #667eea;
      }

      .password-form .form-actions {
        display: flex;
        gap: 10px;
      }

      .password-form button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .password-form button[type="submit"] {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .password-form button[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .password-form button[type="button"] {
        background: #f5f5f5;
        color: #666;
      }

      .password-form button[type="button"]:hover {
        background: #e0e0e0;
      }

      .ticket-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .ticket-title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 15px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      .ticket-meta {
        font-size: 16px;
        opacity: 0.9;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .ticket-meta span {
        background: rgba(255, 255, 255, 0.2);
        padding: 5px 12px;
        border-radius: 15px;
        backdrop-filter: blur(10px);
      }

      .ticket-body {
        background: #f8f9fa;
        padding: 25px;
        border-radius: 10px;
        line-height: 1.8;
        color: #333;
        font-size: 16px;
        margin-bottom: 30px;
        border: 1px solid #e9ecef;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
      }

      .messages-section {
        background: #fff;
        border-radius: 10px;
        padding: 25px;
        border: 1px solid #e9ecef;
        margin-bottom: 30px;
      }

      .messages-section h3 {
        color: #495057;
        font-size: 20px;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #007bff;
        display: inline-block;
      }

      .admin-message {
        background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
        color: white;
        padding: 20px;
        margin: 15px 0;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(116, 185, 255, 0.3);
      }

      .admin-message-header {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .admin-message-content {
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .admin-message-date {
        font-size: 12px;
        opacity: 0.8;
        text-align: right;
      }

      .no-messages {
        color: #6c757d;
        font-style: italic;
        text-align: center;
        padding: 30px;
        background: #f8f9fa;
        border-radius: 8px;
        border: 2px dashed #dee2e6;
      }

      .button-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .back-button,
      .edit-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-weight: 500;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        font-size: 14px;
      }

      .back-button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
      }

      .back-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .back-button::before {
        content: '← ';
        font-weight: bold;
      }

      .edit-button {
        background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
        box-shadow: 0 2px 8px rgba(0, 184, 148, 0.3);
      }

      .edit-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 184, 148, 0.4);
      }

      .edit-button::before {
        content: '✏️ ';
      }

      .edit-disabled-message {
        background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
        color: white;
        padding: 15px 20px;
        border-radius: 10px;
        margin: 20px 0;
        text-align: center;
        font-weight: 500;
        box-shadow: 0 2px 8px rgba(253, 121, 168, 0.3);
      }

      .edit-disabled-message::before {
        content: '🔒 ';
        font-size: 16px;
      }

      /* 로딩 애니메이션 */
      .loading::after {
        content: '';
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* 반응형 디자인 */
      @media (max-width: 768px) {
        .container {
          margin: 10px;
          padding: 20px;
        }

        .ticket-title {
          font-size: 24px;
        }

        .ticket-meta {
          flex-direction: column;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- MSSQL 상태 표시 -->
      <div
        style="
          background-color: #e3f2fd;
          padding: 10px;
          text-align: center;
          border: 1px solid #2196f3;
          margin-bottom: 20px;
        "
      >
        <span style="color: #1976d2; font-weight: bold">🗄️ 상담요청 수정</span>
      </div>

      <!-- 로딩 상태 -->
      <div id="loading" class="loading">📡 게시글을 불러오는 중...</div>

      <!-- 에러 상태 -->
      <div id="error" class="error">
        <h3>💥 오류가 발생했습니다</h3>
        <p id="error-message"></p>
      </div>

      <!-- 비밀번호 입력 폼 -->
      <div id="password-form" class="password-form" style="display: none;">
        <h2>게시글 비밀번호 입력</h2>
        <p>이 게시글을 보려면 비밀번호를 입력하세요.</p>
        <form id="passwordForm">
          <input
            type="password"
            id="post-password"
            name="post_password"
            placeholder="비밀번호를 입력하세요"
            required
            autofocus
          />
          <div class="form-actions">
            <button type="submit">확인</button>
            <button type="button" onclick="window.location.href='/secret/'">취소</button>
          </div>
        </form>
      </div>

      <!-- 게시글 내용 -->
      <div id="ticket-content" class="ticket-content">
        <div class="ticket-header">
          <div id="ticket-title" class="ticket-title"></div>
          <div class="ticket-meta">
            <span>👤 <span id="ticket-author"></span></span>
            <span>� <span id="ticket-contact"></span></span>
            <span>�📅 <span id="ticket-date"></span></span>
          </div>
        </div>

        <div id="ticket-body" class="ticket-body"></div>

        <div class="messages-section">
          <h3>답변</h3>
          <div id="messages-list"></div>
        </div>

        <!-- 수정 불가 메시지 (관리자 답변이 있을 때) -->
        <div
          id="edit-disabled-message"
          class="edit-disabled-message"
          style="display: none"
        >
          관리자 답변이 있어서 더 이상 수정할 수 없습니다.
        </div>

        <!-- 버튼 그룹 -->
        <div class="button-group">
          <a href="/secret/" class="back-button">목록으로 돌아가기</a>
          <button
            id="edit-button"
            class="edit-button"
            style="display: none"
            onclick="editTicket()"
          >
            수정하기
          </button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='view.js') }}"></script>

    <!-- 회원 세션 전역 변수 -->
    <script src="{{ url_for('static', filename='member_session.js') }}"></script>
    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="{{ url_for('static', filename='admin_session.js') }}"></script>
    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="{{ url_for('static', filename='security.js') }}"></script>
  </body>
</html>
