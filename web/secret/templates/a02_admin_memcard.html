<!DOCTYPE html> <html lang="ko"> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width, initial-scale=1" /> <title>sMembers 관리자 그리드 · 최종 테스트(30건)</title> <style> :root { --bg: #f0f4f8; --panel: #ffffff; --text: #1f2937; --muted: #6b7280; --brand: #6366f1; --brand-light: #818cf8; --accent: #10b981; --accent-light: #34d399; --warn: #f59e0b; --warn-light: #fbbf24; --danger: #ef4444; --danger-light: #f87171; --border: #e0e7ef; --chip: #eef2ff; --chip-text: #4338ca; --radius: 16px; --shadow: 0 4px 16px rgba(99, 102, 241, 0.08), 0 2px 6px rgba(99, 102, 241, 0.04); --shadow-lg: 0 12px 32px rgba(99, 102, 241, 0.12), 0 4px 12px rgba(99, 102, 241, 0.06); --glow: 0 0 20px rgba(99, 102, 241, 0.15); } [data-theme='dark'] { --bg: #0b1220; --panel: #111827; --text: #e5e7eb; --muted: #9ca3af; --brand: #818cf8; --brand-light: #a5b4fc; --accent: #34d399; --accent-light: #6ee7b7; --warn: #fbbf24; --warn-light: #fcd34d; --danger: #f87171; --danger-light: #fca5a5; --border: #1f2937; --chip: #1e293b; --chip-text: #a5b4fc; --shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 4px 10px rgba(0, 0, 0, 0.25); --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45), 0 6px 16px rgba(0, 0, 0, 0.35); --glow: 0 0 24px rgba(129, 140, 248, 0.25); } * { box-sizing: border-box; } html, body { height: 100%; } body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: radial-gradient( circle at 20% 15%, rgba(99, 102, 241, 0.12), transparent 50% ), radial-gradient( circle at 80% 85%, rgba(16, 185, 129, 0.1), transparent 55% ), var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; } .wrap { display: grid; grid-template-rows: auto 1fr; height: 100%; gap: 16px; } header { position: sticky; top: 0; z-index: 10; background: var(--bg); backdrop-filter: blur(12px) saturate(180%); } .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 2px solid var(--border); background: linear-gradient( 135deg, rgba(99, 102, 241, 0.08), rgba(16, 185, 129, 0.06) ); } .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; } .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--accent)); box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35); animation: pulse 2s ease-in-out infinite; } @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.85; } } .bar .actions { display: flex; gap: 8px; align-items: center; } .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 9px 16px; border-radius: 12px; cursor: pointer; box-shadow: var(--shadow); font-weight: 600; font-size: 14px; transition: all 0.2s ease; } .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); } .btn:active { transform: translateY(0); } .btn.brand { background: linear-gradient(135deg, var(--brand), var(--brand-light)); border-color: transparent; color: #fff; } .btn.brand:hover { box-shadow: var(--glow), var(--shadow-lg); } .btn.accent { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #fff; border-color: transparent; font-weight: 600; } .btn.accent:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); } .btn.warn { background: linear-gradient(135deg, var(--warn), var(--warn-light)); color: #231; border-color: transparent; } .btn.danger { background: linear-gradient(135deg, var(--danger), var(--danger-light)); color: #fff; border-color: transparent; } .btn.ghost { background: rgba(255, 255, 255, 0.5); border-color: var(--border); backdrop-filter: blur(8px); } .layout { display: grid; grid-template-columns: var(--grid-width, 380px) auto 1fr; gap: 0; padding: 0 20px 20px; height: calc(100vh - 62px); position: relative; } /* header 제외 */ @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } } .resizer { width: 18px; cursor: col-resize; background: transparent; position: relative; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease; flex-shrink: 0; } .resizer:hover { background: linear-gradient( 90deg, transparent, rgba(99, 102, 241, 0.08), transparent ); } .resizer::before { content: ''; position: absolute; width: 2px; height: 40px; background: var(--border); border-radius: 999px; opacity: 0.5; transition: all 0.2s ease; } .resizer:hover::before { opacity: 1; background: var(--brand); height: 60px; } .resizer.resizing { background: linear-gradient( 90deg, transparent, rgba(99, 102, 241, 0.12), transparent ); } .resizer.resizing::before { opacity: 1; background: var(--brand); height: 100%; } @media (max-width: 1080px) { .resizer { display: none; } } .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow 0.3s ease; } .panel:hover { box-shadow: var(--shadow-lg); } /* Left: Grid + filters */ .gridWrap { display: grid; grid-template-rows: auto 1fr; height: 100%; margin-right: 0; } .filters { padding: 14px; border-bottom: 2px solid var(--border); background: linear-gradient( 180deg, rgba(99, 102, 241, 0.04), transparent ); } .filters h3 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; } .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; } .chip { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient( 135deg, var(--chip), rgba(99, 102, 241, 0.08) ); color: var(--chip-text); padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(99, 102, 241, 0.2); font-weight: 600; font-size: 12px; box-shadow: 0 2px 6px rgba(99, 102, 241, 0.1); } .field { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); padding: 7px 12px; border-radius: 12px; box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05); transition: all 0.2s ease; } .field:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); } .field input[type='text'], .field select { border: none; outline: none; background: transparent; color: var(--text); min-width: 0; font-size: 14px; } .grid { overflow: auto; } .thead, .rowItem { display: grid; grid-template-columns: 120px 120px 60px 90px 1fr; gap: 8px; align-items: center; padding: 8px 12px; font-size: 14px; min-height: 34px; } .grid .thead > div, .grid .rowItem > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .thead { position: sticky; top: 0; background: var(--panel); border-bottom: 2px solid var(--border); z-index: 1; font-weight: 700; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; } .rowItem { border-bottom: 1px solid var(--border); cursor: pointer; transition: all 0.2s ease; } .rowItem:hover { background: linear-gradient( 90deg, rgba(99, 102, 241, 0.06), rgba(16, 185, 129, 0.04) ); transform: translateX(2px); } .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; display: inline-block; } .badge.OPEN { background: linear-gradient( 135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.12) ); color: #047857; border-color: rgba(16, 185, 129, 0.3); } .badge.LOCKED { background: linear-gradient( 135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.12) ); color: #b45309; border-color: rgba(245, 158, 11, 0.3); } .badge.DELETED { background: linear-gradient( 135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.12) ); color: #b91c1c; border-color: rgba(239, 68, 68, 0.3); } /* Right: Form */ .formWrap { display: grid; grid-template-rows: auto 1fr auto; height: 100%; margin-left: 0; } .formHead { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 2px solid var(--border); background: linear-gradient( 180deg, rgba(99, 102, 241, 0.04), transparent ); } .title { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; } .formBody { padding: 10px; overflow: auto; } .grid2 { display: grid; grid-template-columns: repeat(2, minmax(240px, 1fr)); gap: 8px; } @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } } .group { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: linear-gradient( 135deg, rgba(255, 255, 255, 0.6), rgba(99, 102, 241, 0.02) ); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03); transition: all 0.3s ease; margin-bottom: 0; } .group:hover { box-shadow: 0 2px 8px rgba(99, 102, 241, 0.08); transform: translateY(-1px); } .group h4 { margin: 0 0 6px; font-size: 11px; color: var(--brand); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding-bottom: 5px; border-bottom: 1px solid rgba(99, 102, 241, 0.12); } .ctrl { display: grid; grid-template-columns: 120px 1fr; gap: 6px; align-items: center; margin-bottom: 5px; } .ctrl:last-child { margin-bottom: 0; } .ctrl label { font-weight: 600; color: var(--muted); font-size: 12px; line-height: 1.3; word-break: keep-all; } .ctrl input, .ctrl select, .ctrl textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); transition: all 0.2s ease; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05); font-size: 13px; line-height: 1.4; } .ctrl input:focus, .ctrl select:focus, .ctrl textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.12); } .ctrl input[type='file'] { padding: 4px 6px; font-size: 12px; } .ctrl textarea { min-height: 50px; resize: vertical; } .formFoot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; border-top: 2px solid var(--border); background: linear-gradient( 180deg, transparent, rgba(99, 102, 241, 0.03) ); border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); } .count { font-size: 11px; color: var(--muted); font-weight: 600; } /* 서명 패드 스타일 */ .sign-wrap { display: grid; gap: 6px; padding: 8px; border-radius: 10px; background: linear-gradient( 135deg, rgba(125, 169, 255, 0.05), rgba(99, 211, 170, 0.05) ); border: 1px solid var(--border); margin-top: 6px; } .sign-pad { width: 100%; max-width: 680px; height: 160px; border-radius: 8px; border: 2px solid var(--border); background: var(--panel); touch-action: none; box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.05); transition: all 0.3s ease; } .sign-pad:hover { border-color: var(--brand); box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.05), 0 0 0 3px rgba(125, 169, 255, 0.1); } .sign-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; } .sign-preview { min-height: 100px; border: 1px dashed var(--border); border-radius: 6px; padding: 8px; display: flex; align-items: center; justify-content: center; background: var(--bg); } .sign-preview img { max-width: 100%; max-height: 150px; object-fit: contain; } </style> <link rel="stylesheet" href="{{ url_for('static', filename='security.css') }}" /> </head> <body> <div class="wrap" id="app"> <header> <div class="bar"> <div class="brand"> <span class="dot"></span><span>회원가입 관리자</span> </div> <div class="actions"> <button class="btn ghost" id="btnTheme" title="테마 전환"> 테마 </button> <button class="btn" id="btnNew">새로 추가</button> <button class="btn brand" id="btnSave">저장</button> <button class="btn accent" id="btnUpdate" style="background: linear-gradient(135deg, #10b981, #34d399); color: #fff; border: none;">수정</button> <button class="btn danger" id="btnDelete">삭제</button> <button class="btn danger" id="btnClose" style="background: #dc3545; border-color: transparent" title="닫기" > <svg style=" width: 16px; height: 16px; vertical-align: middle; margin-right: 4px; " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" > <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.5 label ><input id="sMem_password" type="password" maxlength="100" placeholder="비밀번호 입력 (자동 해시 생성)" /> </div> <div class="ctrl"> <label>비번 Hash</label ><input id="sMem_pwdHash" maxlength="255" placeholder="해시 문자열 (자동 생성)" readonly /> </div> <div class="ctrl"> <label>비번 Salt</label ><input id="sMem_pwd_salt" placeholder="(HEX/BASE64) (자동 생성)" readonly /> </div> <div class="ctrl"> <label>이름</label><input id="sMem_name" maxlength="50" /> </div> <div class="ctrl"> <label>닉네임</label ><input id="sMem_nickname" maxlength="50" /> </div> <div class="ctrl"> <label>성별</label> <select id="sMem_gender"> <option value="">-</option> <option value="M">M</option> <option value="F">F</option> </select> </div> <div class="ctrl"> <label>양력/음력 구분</label> <select id="sMem_calendar_type"> <option value="양력" selected>양력</option> <option value="음력">음력</option> </select> </div> <div class="ctrl" id="leapMonthCtrl" style="display: none;"> <label>윤달여부</label> <div style="display: flex; align-items: center; gap: 8px;"> <input type="checkbox" id="is_leap_month" style="width: auto; margin: 0;" /> <label for="is_leap_month" style="font-weight: normal; margin: 0; cursor: pointer;">윤달입니다</label> </div> </div> <div class="ctrl"> <label>생일</label><input id="sMem_birthdt" type="date" /> </div> <div class="ctrl"> <label>출생연도</label ><input id="sMem_birth_year" type="number" min="1800" max="2100" /> </div> <div class="ctrl"> <label>상태</label> <select id="sMem_status"> <option>OPEN</option> <option>LOCKED</option> <option>DELETED</option> </select> </div> <div class="ctrl"> <label>가족구분(family_gu)</label> <select id="family_gu"> <option value="01">01-본인</option> <option value="02">02-배우자</option> <option value="03">03-남편부</option> <option value="04">04-남편모</option> <option value="05">05-배우자부</option> <option value="06">06-배우자모</option> <option value="07">07-할아버지</option> <option value="08">08-할머니</option> <option value="09">09-자녀</option> <option value="10">10-손자녀</option> <option value="99">99-일반</option> <
