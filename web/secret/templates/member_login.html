<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>로그인 | 나라톡톡</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #f7f8fb;
        --card: #ffffff;
        --ink: #2a3140;
        --ink-sub: #6a7282;
        --line: #e8ebf3;
        --pri: #7da9ff;
        --pri-2: #a9c3ff;
        --ok: #63d3aa;
        --warn: #ffd089;
        --err: #ff8a8a;
        --muted: #f2f4f9;
        --radius: 14px;
        --shadow: 0 6px 20px rgba(116, 130, 170, 0.12);
        --focus: 0 0 0 3px rgba(125, 169, 255, 0.35);
        --tap: 46px;
      }
      html[data-theme='dark'] {
        --bg: #0e1116;
        --card: #12161d;
        --ink: #e9edf5;
        --ink-sub: #a8b2c3;
        --line: #232a35;
        --muted: #171b23;
        --shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        --pri: #80b2ff;
        --pri-2: #9fc6ff;
        --ok: #6ee3ba;
        --warn: #ffd894;
        --err: #ff9b9b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(
            1200px 600px at 0% -10%,
            rgba(125, 169, 255, 0.2),
            transparent 60%
          ),
          radial-gradient(
            1200px 600px at 100% 10%,
            rgba(99, 211, 170, 0.15),
            transparent 55%
          ),
          var(--bg);
        color: var(--ink);
        font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto,
          'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-dot {
        width: 28px;
        height: 28px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--pri), var(--ok));
        box-shadow: 0 2px 8px rgba(125, 169, 255, 0.35);
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .theme-toggle {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        border: 1px solid var(--line);
        background: var(--muted);
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 8px 2px 4px;
      }
      input[type='text'],
      input[type='password'],
      input[type='email'] {
        width: 100%;
        padding: 12px;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff0;
        color: var(--ink);
        outline: none;
      }
      input:focus {
        box-shadow: var(--focus);
        border-color: transparent;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        min-height: var(--tap);
        cursor: pointer;
        font-weight: 700;
      }
      .btn.pri {
        background: linear-gradient(180deg, var(--pri), var(--pri-2));
        color: #0d1a36;
        width: 100%;
      }
      .btn.ghost {
        background: var(--muted);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.link {
        background: transparent;
        color: var(--pri);
        padding: 6px 8px;
        border-radius: 8px;
      }
      .hint {
        font-size: 12px;
        color: var(--ink-sub);
        margin: 4px 2px 0;
      }
      .error {
        font-size: 12px;
        color: var(--err);
        display: none;
        margin: 4px 2px 0;
      }
      .oktxt {
        font-size: 12px;
        color: var(--ok);
        display: none;
        margin: 4px 2px 0;
      }
      .toolbar {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      .row.between {
        justify-content: space-between;
      }
      .caps {
        display: none;
        font-size: 12px;
        color: #b35a00;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 10px 0;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      /* 로그인 상태 표시 */
      .user-info {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--muted);
        border-radius: 12px;
        margin-bottom: 14px;
        border: 1px solid var(--line);
      }
      .user-info.active {
        display: flex;
      }
      .user-info .user-text {
        flex: 1;
        font-size: 14px;
        font-weight: 600;
      }
      .user-info .user-id {
        color: var(--pri);
      }
      .user-info .logout-btn {
        padding: 6px 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .user-info .logout-btn:hover {
        background: var(--err);
        color: white;
        border-color: var(--err);
      }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='security.css') }}" />
    <!-- 회원 세션 전역 변수 -->
    <script src="{{ url_for('static', filename='member_session.js') }}"></script>
  </head>
  <body>
    <section class="card" role="main" aria-labelledby="title">
      <!-- 로그인 정보 표시 영역 -->
      <div id="userInfoBar" class="user-info">
        <div class="user-text">
          <span class="user-id" id="displayUserId"></span> (<span
            id="displayUserName"
          ></span
          >)
        </div>
        <button type="button" class="logout-btn" id="logoutBtn">
          로그아웃
        </button>
      </div>

      <header class="head">
        <div class="brand">
          <div class="brand-dot" aria-hidden="true"></div>
          <h1 id="title">로그인</h1>
        </div>
        <button
          id="themeBtn"
          class="theme-toggle"
          type="button"
          aria-pressed="false"
          title="다크/라이트 모드 전환"
        >
          라이트
        </button>
      </header>

      <form id="loginForm" novalidate>
        <label for="loginId">아이디 또는 이메일</label>
        <input
          id="loginId"
          name="loginId"
          type="text"
          autocomplete="userid"
          placeholder="예) user123 또는 abc@example.com"
          required
        />
        <div class="error" data-err="loginId">아이디/이메일을 입력하세요.</div>

        <label for="loginPwd">비밀번호</label>
        <div class="row">
          <input
            id="loginPwd"
            name="loginPwd"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          />
        </div>
        <div id="capsNotice" class="caps">Caps Lock이 켜져 있습니다.</div>
        <div class="error" data-err="loginPwd">
          비밀번호(6자 이상)를 입력하세요.
        </div>
        <div class="hint">
          일부 브라우저에서는 비밀번호 입력칸 우측에 표시되는 눈 아이콘으로
          표시/숨기기를 사용할 수 있습니다.
        </div>

        <div class="row between" style="margin-top: 6px">
          <label class="checkbox"
            ><input id="remember" type="checkbox" /> 자동 로그인</label
          >
          <button type="button" id="findBtn" class="btn link">
            아이디/비번 찾기
          </button>
        </div>

        <div class="toolbar">
          <button type="submit" class="btn pri">로그인</button>
          <div class="row" style="justify-content: center; gap: 8px">
            <span class="hint">처음이신가요?</span>
            <a href="#" id="goSignup" class="btn link"
              >회원가입 화면으로 이동</a
            >
          </div>
        </div>
        <div class="hint">
          회원가입 후 등록한 아이디와 비밀번호로 로그인하세요.
        </div>
      </form>

      <div class="divider"></div>
      <footer class="foot">
        <small class="hint">© 나라톡톡</small>
        <div class="row">
          <button
            type="button"
            id="passkeyBtn"
            class="btn ghost"
            disabled
            title="추후 지원 예정"
          >
            패스키(준비중)
          </button>
        </div>
      </footer>

      <!-- 아이디/비번 찾기 모달 -->
      <div
        id="findModal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="findTitle"
        style="position: fixed; inset: 0; display: none; z-index: 9999"
      >
        <div
          id="findBackdrop"
          style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45)"
        ></div>
        <div
          style="
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 560px);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 12px 14px;
              border-bottom: 1px solid var(--line);
            "
          >
            <strong id="findTitle">아이디/비밀번호 찾기</strong>
            <button
              id="findClose"
              class="btn ghost"
              type="button"
              aria-label="닫기"
            >
              닫기
            </button>
          </div>
          <div style="padding: 14px; display: grid; gap: 12px">
            <div style="display: flex; gap: 8px; flex-wrap: wrap">
              <button
                type="button"
                id="tabIdFind"
                class="btn ghost"
                aria-selected="true"
              >
                아이디 찾기
              </button>
              <button type="button" id="tabPwdReset" class="btn ghost">
                비밀번호 재설정
              </button>
            </div>

            <!-- 아이디 찾기 -->
            <form id="formIdFind">
              <label for="findEmail">가입 이메일</label>
              <input
                id="findEmail"
                type="email"
                placeholder="you@example.com"
                required
                inputmode="email"
              />
              <div class="hint">
                로컬 저장된 가입 정보(드래프트)에서 조회합니다.
              </div>
              <div class="toolbar">
                <button type="submit" class="btn pri">아이디 찾기</button>
              </div>
              <div id="resultIdFind" class="hint" style="margin-top: 6px"></div>
            </form>

            <!-- 비밀번호 재설정 -->
            <form id="formPwdReset" style="display: none">
              <label for="resetId">아이디</label>
              <input
                id="resetId"
                type="text"
                placeholder="가입 아이디"
                required
              />
              <label for="resetEmail" style="margin-top: 6px"
                >가입 이메일</label
              >
              <input
                id="resetEmail"
                type="email"
                placeholder="you@example.com"
                required
                inputmode="email"
              />
              <div class="hint">
                실제 이메일 발송 대신 임시 비밀번호를 생성해 보여줍니다(데모).
              </div>
              <div class="toolbar">
                <button type="submit" class="btn pri">
                  임시 비밀번호 발급
                </button>
              </div>
              <div
                id="resultPwdReset"
                class="hint"
                style="margin-top: 6px"
              ></div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="{{ url_for('static', filename='member_login.js') }}"></script>

    <!-- 회원 세션 전역 변수 -->
    <!-- 상단존재 <script src="/static/member_session.js"></script> -->

    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="{{ url_for('static', filename='admin_session.js') }}"></script>
    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="{{ url_for('static', filename='security.js') }}"></script>
  </body>
</html>
