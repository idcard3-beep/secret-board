<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 - 상담요청 목록</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/security.css" />
    <style>
      /* 관리자용 반응형 DB 그리드 스타일 */
      .admin-grid-container {
        width: 100%;
        margin: 20px auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .admin-grid-header {
        background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        color: white;
        padding: 24px;
        position: relative;
      }

      .admin-grid-header h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      .admin-status-badge {
        position: absolute;
        top: 24px;
        right: 24px;
        background: rgba(255, 255, 255, 0.25);
        padding: 10px 16px;
        border-radius: 25px;
        font-size: 13px;
        font-weight: 600;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .admin-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        background: linear-gradient(135deg, #f7fcfc 0%, #e8f4f8 100%);
        border-bottom: 1px solid #d1ecf1;
        gap: 16px;
      }

      .filter-section {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: nowrap;
      }

      .filter-label {
        font-weight: 600;
        color: #2c5f6b;
        font-size: 14px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .admin-select {
        background: white;
        border: 2px solid #d1ecf1;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        color: #2c5f6b;
        min-width: 120px;
        transition: all 0.3s ease;
      }

      .admin-select:focus {
        outline: none;
        border-color: #a8d5e2;
        box-shadow: 0 0 0 3px rgba(168, 213, 226, 0.2);
      }

      .admin-logout-btn {
        background: linear-gradient(135deg, #7fb3c3 0%, #2c5f6b 100%);
        color: white;
        border: none;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(127, 179, 195, 0.3);
      }

      .admin-logout-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(127, 179, 195, 0.4);
      }

      /* 관리자 데이터 그리드 */
      .admin-data-grid {
        width: 100%;
        overflow-x: auto;
      }

      .admin-grid-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }

      .admin-grid-table thead th {
        background: linear-gradient(135deg, #e8f4f8 0%, #d1ecf1 100%);
        color: #2c5f6b;
        padding: 10px 8px;
        text-align: left;
        font-weight: 700;
        border-bottom: 3px solid #a8d5e2;
        position: sticky;
        top: 0;
        z-index: 15;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .admin-grid-table tbody td {
        padding: 6px 8px;
        border-bottom: 1px solid #d1ecf1;
        color: #34495e;
        vertical-align: middle;
        font-size: 13px;
        line-height: 1.3;
      }

      .admin-grid-table tbody tr {
        cursor: pointer;
        transition: all 0.3s ease;
        border-left: 4px solid transparent;
      }

      .admin-grid-table tbody tr:hover {
        background: linear-gradient(135deg, #f7fcfc 0%, #e8f4f8 100%);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(168, 213, 226, 0.15);
        border-left-color: #a8d5e2;
      }

      /* 관리자 상태 배지 */
      .admin-status-badge-small {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .admin-status-open {
        background: #e8f4f8;
        color: #2c5f6b;
        border: 1px solid #d1ecf1;
      }

      .admin-status-answered {
        background: #f0f9ff;
        color: #0891b2;
        border: 1px solid #7dd3fc;
      }

      .admin-status-closed {
        background: #fef3f2;
        color: #dc2626;
        border: 1px solid #fecaca;
      }

      /* 관리자 답변 배지 */
      .admin-reply-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        font-size: 10px;
        font-weight: bold;
        text-transform: uppercase;
      }

      .admin-reply-yes {
        background: linear-gradient(135deg, #7fb3c3 0%, #2c5f6b 100%);
        color: white;
        box-shadow: 0 2px 8px rgba(127, 179, 195, 0.3);
      }

      .admin-reply-no {
        background: linear-gradient(135deg, #f5b7b1 0%, #ec7063 100%);
        color: white;
        box-shadow: 0 2px 8px rgba(245, 183, 177, 0.3);
      }

      /* 자료구분 배지 */
      .snsgu-badge {
        background: linear-gradient(135deg, #a8d5e2 0%, #7fb3c3 100%);
        color: white;
        padding: 2px 6px;
        border-radius: 8px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }

      /* 관리자 모바일 카드 뷰 */
      .admin-mobile-card-view {
        display: none;
        padding: 0 15px 15px;
      }

      .admin-ticket-card {
        background: white;
        border-radius: 12px;
        margin-bottom: 12px;
        padding: 16px;
        box-shadow: 0 6px 20px rgba(168, 213, 226, 0.1);
        cursor: pointer;
        transition: all 0.3s ease;
        border: 1px solid #d1ecf1;
        position: relative;
        overflow: hidden;
      }

      .admin-ticket-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: linear-gradient(135deg, #a8d5e2 0%, #7fb3c3 100%);
      }

      .admin-ticket-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(168, 213, 226, 0.2);
      }

      .admin-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .admin-card-number {
        background: linear-gradient(135deg, #a8d5e2 0%, #7fb3c3 100%);
        color: white;
        padding: 4px 8px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: bold;
      }

      .admin-card-title {
        font-size: 15px;
        font-weight: 700;
        color: #2c5f6b;
        margin: 8px 0;
        line-height: 1.3;
      }

      .admin-card-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 10px 0;
      }

      .admin-meta-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .admin-meta-label {
        font-size: 10px;
        color: #7fb3c3;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .admin-meta-value {
        font-size: 12px;
        color: #2c5f6b;
        font-weight: 500;
      }

      .admin-card-date {
        font-size: 11px;
        color: #a8d5e2;
        text-align: right;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #d1ecf1;
      }

      /* 반응형 디자인 */
      @media (max-width: 768px) {
        .admin-data-grid {
          display: none;
        }

        .admin-mobile-card-view {
          display: block;
        }

        .admin-grid-header h2 {
          font-size: 22px;
        }

        .admin-status-badge {
          position: relative;
          top: auto;
          right: auto;
          margin-top: 12px;
          display: inline-block;
        }

        .admin-toolbar {
          flex-direction: column;
          gap: 12px;
          padding: 12px;
        }

        .filter-section {
          width: 100%;
          justify-content: center;
        }

        .admin-select {
          flex: 1;
          min-width: auto;
          padding: 4px 8px;
          font-size: 12px;
        }

        .admin-logout-btn {
          width: 100%;
          padding: 6px 12px;
          font-size: 12px;
        }
      }

      @media (max-width: 480px) {
        .admin-grid-container {
          margin: 5px;
          border-radius: 10px;
        }

        .admin-grid-header {
          padding: 12px;
        }

        .admin-grid-header h2 {
          font-size: 16px;
        }

        .admin-ticket-card {
          padding: 12px;
          margin-bottom: 8px;
        }

        .admin-card-title {
          font-size: 13px;
        }

        .admin-card-meta {
          grid-template-columns: 1fr;
          gap: 6px;
        }

        .admin-mobile-card-view {
          padding: 0 8px 8px;
        }
      }

      /* 테블릿 최적화 */
      @media (min-width: 769px) and (max-width: 1024px) {
        .admin-grid-table thead th,
        .admin-grid-table tbody td {
          padding: 8px 6px;
          font-size: 12px;
        }

        .admin-grid-header h2 {
          font-size: 20px;
        }

        .admin-toolbar {
          padding: 10px 16px;
        }

        .admin-select {
          padding: 5px 10px;
          font-size: 12px;
          min-width: 100px;
        }

        .admin-logout-btn {
          padding: 6px 14px;
          font-size: 12px;
        }
      }

      /* 로딩 애니메이션 */
      .admin-loading-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px;
      }

      .admin-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e8f4f8;
        border-top: 4px solid #a8d5e2;
        border-radius: 50%;
        animation: adminSpin 1s linear infinite;
      }

      @keyframes adminSpin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* 빈 상태 */
      .admin-empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #7fb3c3;
      }

      .admin-empty-state-icon {
        font-size: 64px;
        margin-bottom: 20px;
        opacity: 0.6;
      }

      .admin-empty-state h3 {
        color: #2c5f6b;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="admin-grid-container">
      <!-- 관리자 헤더 -->
      <div class="admin-grid-header">
        <h2>🛡️ 관리자 - 상담요청 목록</h2>
        <!-- <div class="admin-status-badge">🗄️ 시스템 관리</div> -->
        <button
          class="admin-status-badge"
          onclick="location.href='main_adminMenu.html'"
          style="cursor: pointer; border: none; padding: 8px 16px"
        >
          🗄️ 관리자 시스템 관리
        </button>
      </div>

      <!-- 관리자 툴바 -->
      <div class="admin-toolbar">
        <div class="filter-section">
          <span class="filter-label">📊 상태 필터:</span>
          <select id="statusFilter" class="admin-select">
            <option value="">전체 상태</option>
            <option value="OPEN">🔴 대기중</option>
            <option value="ANSWERED">🟢 답변완료</option>
            <option value="CLOSED">🟡 마감</option>
          </select>
        </div>
        <button class="admin-logout-btn" onclick="logout()">🚪 로그아웃</button>
      </div>

      <!-- 데스크탑/테블릿 테이블 뷰 -->
      <div class="admin-data-grid">
        <table class="admin-grid-table">
          <thead>
            <tr>
              <th style="width: 60px">No</th>
              <th>제목</th>
              <th style="width: 100px">상태</th>
              <th style="width: 80px">답변여부</th>
              <th style="width: 100px">이름</th>
              <th style="width: 120px">메모란</th>
              <th style="width: 100px">자료구분</th>
              <th style="width: 140px">등록일</th>
            </tr>
          </thead>
          <tbody id="rows">
            <!-- 로딩 스피너 -->
            <tr>
              <td colspan="8" class="admin-loading-spinner">
                <div class="admin-spinner"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 모바일 카드 뷰 -->
      <div class="admin-mobile-card-view" id="adminMobileCardView">
        <div class="admin-loading-spinner">
          <div class="admin-spinner"></div>
        </div>
      </div>
    </div>

    <!-- 회원 세션 전역 변수 -->
    <script src="/static/member_session.js"></script>
    <!-- 관리자 세션 전역 변수 관리 (가장 먼저 로드) -->
    <script src="/static/admin_session.js"></script>
    <script src="/static/admin_list.js"></script>
    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="/static/security.js"></script>
  </body>
</html>
