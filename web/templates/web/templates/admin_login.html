<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>관리자 로그인</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/security.css" />
    <style>
      .login-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 40px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .login-title {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 24px;
      }

      .default-info {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
        font-size: 14px;
        color: #666;
        border-left: 4px solid #007bff;
      }

      .default-info strong {
        color: #333;
      }

      .error-message {
        background: #ffebee;
        color: #d32f2f;
        padding: 10px 15px;
        border-radius: 5px;
        margin-bottom: 15px;
        border-left: 4px solid #d32f2f;
        display: none;
        font-size: 14px;
      }

      .success-message {
        background: #e8f5e8;
        color: #2e7d32;
        padding: 10px 15px;
        border-radius: 5px;
        margin-bottom: 15px;
        border-left: 4px solid #2e7d32;
        display: none;
        font-size: 14px;
      }

      .password-container {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        width: 20px;
        height: 20px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .password-toggle:hover {
        opacity: 0.7;
      }

      .eye-icon {
        width: 18px;
        height: 18px;
        position: relative;
      }

      .eye-icon::before {
        content: '';
        position: absolute;
        width: 18px;
        height: 9px;
        border: 2px solid #666;
        border-bottom: none;
        border-radius: 18px 18px 0 0;
        top: 5px;
      }

      .eye-icon::after {
        content: '';
        position: absolute;
        width: 4px;
        height: 4px;
        background: #666;
        border-radius: 50%;
        top: 7px;
        left: 7px;
      }

      .eye-icon.hidden::before {
        border-bottom: 2px solid #666;
        border-radius: 18px;
        transform: rotate(0deg);
      }

      .eye-icon.hidden::after {
        display: none;
      }

      .eye-icon.hidden {
        position: relative;
      }

      .eye-icon.hidden::before {
        content: '';
        position: absolute;
        width: 18px;
        height: 9px;
        border: 2px solid #666;
        border-radius: 18px 18px 0 0;
        top: 5px;
      }

      .eye-slash {
        position: absolute;
        width: 20px;
        height: 2px;
        background: #666;
        top: 9px;
        left: -1px;
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2 class="login-title">🔐 관리자 로그인</h2>

      <div class="default-info">
        <strong>기본 관리자 계정 입니다.</strong><br />
        상담요청은 로그인 없이 비밀로 상담요청 할 수 있습니다.<br />
        로그인 없이 상담요청 하세요.
      </div>

      <!-- 에러/성공 메시지 영역 -->
      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="loginForm">
        <label>관리자 ID</label>
        <input
          type="text"
          name="username"
          required
          placeholder="관리자 ID를 입력하세요"
        />

        <label>비밀번호</label>
        <div class="password-container">
          <input
            type="password"
            name="password"
            id="password"
            required
            placeholder="비밀번호를 입력하세요"
          />
          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword()"
          >
            <div class="eye-icon" id="eye-icon"></div>
          </button>
        </div>

        <div class="form-actions">
          <button type="submit">로그인</button>
          <button type="button" onclick="location.href='/'">취소</button>
        </div>
      </form>
    </div>
    <script>
      function togglePassword() {
        const passwordField = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        if (passwordField.type === 'password') {
          passwordField.type = 'text';
          eyeIcon.innerHTML = '<div class="eye-slash"></div>';
          eyeIcon.classList.add('hidden');
        } else {
          passwordField.type = 'password';
          eyeIcon.innerHTML = '';
          eyeIcon.classList.remove('hidden');
        }
      }
    </script>
    <script src="/static/admin_login.js"></script>
    <script src="/static/security.js"></script>
  </body>
</html>
