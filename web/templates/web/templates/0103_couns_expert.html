<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나라톡톡 심리상담센터 | 전문가 소개</title>
    <style>
      :root {
        --bg: #fff;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #0ea5e9;
        --card: #f8fafc;
        --ring: #e2e8f0;
        --shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
        --radius: 16px;
        --focus: 0 0 0 3px rgba(14, 165, 233, 0.28);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 12px/1.65 Pretendard, system-ui, sans-serif;
      }
      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--ring);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .panel {
        padding: 22px;
      }
      .expert-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .expert-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .num {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--fg);
        color: #fff;
        font-weight: 700;
      }
      .col-2 {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 520px) {
        .col-2 {
          grid-template-columns: 1fr;
        }
      }
      .photo {
        width: 150px;
        height: 180px;
        border: 1px dashed var(--ring);
        border-radius: 12px;
        overflow: hidden;
        background: #0001;
        display: grid;
        place-items: center;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      input[type='file'] {
        display: none;
      }
      label.upload {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--ring);
        border-radius: 50%;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        transition: 0.2s;
      }
      label.upload:hover {
        background: #0284c7;
      }
      label.upload svg {
        width: 18px;
        height: 18px;
        stroke: #fff;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .inpt,
      .area,
      .select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--ring);
        background: var(--bg);
        color: var(--fg);
      }
      .area {
        min-height: 88px;
        resize: vertical;
      }
      .check-groups {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 8px;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .group-title {
        font-weight: 600;
        font-size: 14px;
        color: var(--muted);
      }
      .chip-flow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--ring);
        padding: 6px 8px;
        border-radius: 10px;
      }
      .chip input {
        accent-color: var(--accent);
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border: 1px solid var(--ring);
        border-radius: 12px;
        padding: 8px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--ring);
      }
      .tag-inpt {
        flex: 1;
        min-width: 120px;
        border: none;
        outline: none;
        background: transparent;
      }
    </style>
    <link rel="stylesheet" href="/static/security.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="container">
          <h1>전문가 소개 입력</h1>
          <div id="experts" class="grid"></div>
        </div>
      </section>
    </main>
    <script>
      const TOTAL = 50;
      const GROUPS = {
        '심리 · 정서': [
          '우울',
          '불안',
          '번아웃',
          '스트레스 관리',
          '자기조절/감정조절',
          '트라우마',
          '애착',
          '중독',
        ],
        '관계 · 발달': [
          '대인관계/의사소통',
          '부부/커플',
          '가족/양육',
          '청소년/학업',
          '진로/커리어',
        ],
        '전문 기법': ['CBT', 'ACT', 'DBT', '마음챙김'],
        '동 · 서양 역학': [
          '사주명리',
          '주역/육효',
          '만세력',
          '서양점성(천궁도)',
          '시기/전환기',
        ],
      };
      const ROLES = [
        '심리상담전문가',
        '동양역학전문가',
        '서양역학전문가',
        '통합상담전문가',
        '수퍼바이저',
      ];
      function makeExpertCard(idx) {
        const id = idx + 1;
        const wrap = document.createElement('article');
        wrap.className = 'card panel expert';
        const groupHTML = Object.entries(GROUPS)
          .map(
            ([title, items]) =>
              `<div class="group"><div class="group-title">${title}</div><div class="chip-flow">${items
                .map(
                  (sp) =>
                    `<label class="chip"><input type="checkbox" value="${sp}"> ${sp}</label>`
                )
                .join('')}</div></div>`
          )
          .join('');
        wrap.innerHTML = `<div class="expert-head"><div class="expert-title"><span class="num">${id}</span><strong>전문가 #${id}</strong></div><span class="muted">필수: 이름 · 직함 · 담당 분야</span></div><div class="col-2"><!-- 좌: 사진 --><div><div class="photo" id="photoBox${id}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div><div class="row" style="margin-top:8px;justify-content:center"><label class="upload" title="사진 업로드"><input type="file" accept="image/*" data-role="photo" data-id="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></label></div></div><!-- 우: 기본 정보 --><div class="row" style="align-items:flex-start"><div class="field" style="flex:1 1 200px"><label>이름</label><input class="inpt" placeholder="예: 김가온"></div><div class="field" style="flex:1 1 200px"><label>직함/역할</label><select class="select">${ROLES.map(
          (r) => `<option>${r}</option>`
        ).join(
          ''
        )}</select></div><div class="field" style="flex:1 1 220px"><label>한줄 소개</label><input class="inpt" placeholder="예: 불안·수면·행동습관 전문"></div></div></div><!-- 아래는 원상 유지 --><div class="field" style="flex:1 1 100%"><label>담당 상담 분야 <span class="hint">(체크 + 아래 태그로 추가 가능)</span></label><div class="check-groups">${groupHTML}</div></div><div class="field" style="flex:1 1 100%"><label>추가 태그 <span class="hint">(엔터로 추가, 클릭으로 삭제)</span></label><div class="tags"><input class="tag-inpt" placeholder="예: 공황, 산후우울, 시험불안"></div></div><div class="field" style="flex:1 1 100%"><label>소개(요약)</label><textarea class="area" placeholder="전문 분야, 상담 철학, 사용 기법 등을 2~3문장으로 작성"></textarea></div><div class="field" style="flex:1 1 100%"><label>경력·자격</label><textarea class="area" placeholder="자격증/학력/기관경력/수퍼비전 등 핵심만 줄바꿈으로"></textarea></div>`;
        return wrap;
      }
      const expertsEl = document.getElementById('experts');
      for (let i = 0; i < TOTAL; i++) {
        expertsEl.appendChild(makeExpertCard(i));
      }
    </script>
    <script src="/static/security.js"></script>
  </body>
</html>
