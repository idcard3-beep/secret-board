<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오시는 길 · 약도 | 서울 금천구 시흥대로 97, 시흥유통상가</title>
    <meta
      name="description"
      content="심플하고 부드러운 지도 약도 (서울 금천구 시흥대로 97, 시흥유통상가)."
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #6b7280;
        --accent: #18a0fb;
        --ring: #e6e8ec;
        --card: #fafbfc;
        --pill: #f2f7ff;
        --pill-text: #0b63b0;
        --radius: 16px;
        --shadow: 0 6px 24px rgba(2, 6, 23, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: linear-gradient(180deg, #fff, #fafbff 60%, #f7f9ff);
        color: var(--fg);
        font: 15px/1.7 Pretendard, system-ui, -apple-system, Segoe UI, Roboto,
          Noto Sans KR, sans-serif;
      }
      .container {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: clamp(15px, 3.6vw, 24px);
        letter-spacing: 0.2px;
      }
      .muted {
        color: var(--muted);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--ring);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .panel {
        padding: 18px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid var(--ring);
        border-radius: 999px;
        background: #fff;
        color: var(--fg);
        cursor: pointer;
      }
      .btn:hover {
        background: #f7f9fe;
      }
      .btn.primary {
        background: var(--pill);
        border-color: #dbe8ff;
        color: var(--pill-text);
      }
      .grid {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 14px;
      }
      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .map-wrap {
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid var(--ring);
        background: #fff;
      }
      .info {
        display: grid;
        gap: 10px;
      }
      .kv {
        display: grid;
        grid-template-columns: 84px 1fr;
        gap: 8px;
        align-items: center;
      }
      .kv b {
        color: #334155;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 6px 10px;
        border-radius: 999px;
        background: #f6f8fb;
        border: 1px solid var(--ring);
        font-size: 12px;
        color: #334155;
      }
      footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
      }
      @media print {
        header,
        .tools,
        footer {
          display: none !important;
        }
        .container {
          max-width: none;
          padding: 0;
        }
        .panel {
          padding: 0;
          border: none;
        }
        .map-wrap {
          border: none;
        }
      }
    </style>
    <link rel="stylesheet" href="/static/security.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          오시는 길
          <span class="muted">· 서울 금천구 시흥대로 97, 시흥유통상가</span>
        </h1>
        <div class="tools row">
          <button class="btn" id="copyAddr">주소 복사</button>
          <button class="btn" id="savePNG">PNG 저장</button>
          <button class="btn primary" id="printBtn">인쇄</button>
        </div>
      </header>

      <section class="grid">
        <div class="map-wrap" style="position: relative">
          <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            crossorigin=""
          />
          <div
            id="liveMap"
            style="
              width: 100%;
              height: 640px;
              filter: grayscale(0.08) saturate(1.05) contrast(1.02);
            "
          ></div>
          <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            crossorigin=""
          ></script>
        </div>

        <div class="info card panel">
          <div class="kv">
            <b>주소</b>
            <div>서울 금천구 시흥대로 97, 시흥유통상가</div>
          </div>
          <div class="kv">
            <b>전화</b>
            <div><a href="tel:010-9088-9196">010-9088-9196</a></div>
          </div>
          <div class="kv">
            <b>예약</b>
            <div>
              <a
                href="http://secret-board-04s6.onrender.com/"
                target="_blank"
                rel="noopener"
                >secret-board-04s6.onrender.com</a
              >
            </div>
          </div>
          <div class="kv">
            <b>카카오</b>
            <div>
              <a
                href="https://open.kakao.com/o/gwPG9pOh"
                target="_blank"
                rel="noopener"
                >채널 열기</a
              >
            </div>
          </div>
          <div class="kv">
            <b>안내</b>
            <div class="chips">
              <span class="chip">지도로 길찾기 가능</span
              ><span class="chip">네이버/구글/카카오 연동</span
              ><span class="chip">인쇄·PNG 지원</span>
            </div>
          </div>
        </div>
      </section>

      <footer>© <span id="y"></span> 나라톡톡 심리상담센터 · 지도 약도</footer>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('y').textContent = new Date().getFullYear();

        const copyBtn = document.getElementById('copyAddr');
        const saveBtn = document.getElementById('savePNG');
        const printBtn = document.getElementById('printBtn');

        copyBtn.addEventListener('click', async () => {
          const addr = '서울 금천구 시흥대로 97, 시흥유통상가';
          try {
            await navigator.clipboard.writeText(addr);
            alert('주소가 복사되었습니다.');
          } catch {
            prompt('복사되지 않는 경우 직접 복사해 주세요:', addr);
          }
        });

        saveBtn.addEventListener('click', () => {
          alert(
            'PNG 저장은 현재 SVG 약도에 한해 지원됩니다. 지도를 이미지로 저장하시려면 인쇄버튼을 이용하세요.'
          );
        });

        printBtn.addEventListener('click', () => window.print());

        const CENTER = [37.442808711723, 126.90323244858]; // 서울 금천구 시흥대로 97, 시흥유통상가 (공식 주소 변환 서비스 기준 좌표)
        const map = L.map('liveMap', { scrollWheelZoom: true }).setView(
          CENTER,
          17
        );
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);

        const pin = L.marker(CENTER, { title: '시흥유통상가' }).addTo(map);
        pin.bindPopup(
          `<div class="pin-popup"><b>시흥유통상가 (시흥대로 97)</b><div>서울 금천구</div><div style="margin-top:6px"><a href="https://map.naver.com/v5/search/%EC%8B%9C%ED%9D%A5%EB%8C%80%EB%A1%9C%2097%2C%20%EC%8B%9C%ED%9D%A5%EC%9C%A0%ED%86%B5%EC%83%81%EA%B0%80" target="_blank" rel="noopener">네이버지도</a> · <a href="https://maps.google.com/?q=%EC%84%9C%EC%9A%B8%20%EA%B8%88%EC%B2%9C%EA%B5%AC%20%EC%8B%9C%ED%9D%A5%EB%8C%80%EB%A1%9C%2097%2C%20%EC%8B%9C%ED%9D%A5%EC%9C%A0%ED%86%B5%EC%83%81%EA%B0%80" target="_blank" rel="noopener">구글지도</a> · <a href="https://map.kakao.com/?q=%EC%8B%9C%ED%9D%A5%EB%8C%80%EB%A1%9C%2097%2C%20%EC%8B%9C%ED%9D%A5%EC%9C%A0%ED%86%B5%EC%83%81%EA%B0%80" target="_blank" rel="noopener">카카오맵</a></div></div>`
        );

        L.circle(CENTER, {
          radius: 55,
          color: '#18a0fb',
          fillColor: '#18a0fb',
          fillOpacity: 0.08,
          weight: 1.2,
        }).addTo(map);
      });
    </script>
    <script src="/static/security.js"></script>
  </body>
</html>
