<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1102_6yao 디버그 테스트</title>
  </head>
  <body>
    <h1>1102_6yao 디버그 테스트</h1>
    <p>
      이 페이지는 1102_6yao.html의 스크립트가 정상 작동하는지 테스트하기 위한
      것입니다.
    </p>

    <div id="test-content">
      <p>원본 콘텐츠가 여기에 있습니다.</p>
    </div>

    <script>
      console.log('🚀 테스트 스크립트 시작');

      // 간단한 DOM 생성 테스트
      const root = document.createElement('div');
      root.innerHTML = `
            <div style="background: #f0f0f0; padding: 20px; margin: 20px 0;">
                <h2>JavaScript로 생성된 콘텐츠</h2>
                <p>이 내용이 보이면 DOM 생성이 정상입니다.</p>
            </div>
        `;

      console.log('🔍 DOM 요소 생성 완료, body에 추가 중...');
      document.body.appendChild(root);
      console.log('✅ DOM 요소 추가 완료');

      // 관리자 로그인 함수 테스트
      function openAdminLogin() {
        console.log('🔐 openAdminLogin() 함수 호출됨!');
        const adminWindow = window.open(
          '/admin_login',
          'adminLogin',
          'width=500,height=650,scrollbars=yes,resizable=yes'
        );

        if (!adminWindow) {
          console.error('❌ 팝업 창 열기 실패');
          alert('❌ 팝업이 차단되었습니다.');
        } else {
          console.log('✅ 관리자 로그인 팝업 창 열기 성공');
        }
      }

      // 테스트 버튼 추가
      const testBtn = document.createElement('button');
      testBtn.textContent = '🔐 관리자 로그인 테스트';
      testBtn.onclick = openAdminLogin;
      testBtn.style.cssText =
        'background: #dc2626; color: white; padding: 10px 20px; margin: 10px; border: none; border-radius: 5px;';
      document.body.appendChild(testBtn);

      console.log('✅ 모든 테스트 완료');
    </script>
  </body>
</html>
