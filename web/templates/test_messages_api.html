<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages API 테스트</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 50px auto;
        padding: 20px;
      }
      .result {
        background: #f5f5f5;
        padding: 20px;
        margin: 10px 0;
        border-radius: 5px;
        white-space: pre-wrap;
        font-family: monospace;
        max-height: 500px;
        overflow-y: auto;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
      }
      .error {
        background: #ffeeee;
        color: #cc0000;
      }
      .success {
        background: #eeffee;
        color: #008800;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Messages API 테스트</h1>

    <div>
      <button onclick="testLogin()">1. 관리자 로그인</button>
      <button onclick="testMessages()">2. Messages API 호출</button>
      <button onclick="testTickets()">3. Tickets API 호출</button>
    </div>

    <h2>결과:</h2>
    <div id="result" class="result">여기에 결과가 표시됩니다...</div>

    <script>
      async function testLogin() {
        const result = document.getElementById('result');
        result.className = 'result';
        result.textContent = '로그인 시도 중...';

        try {
          const response = await fetch('/api/v1/admin/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              admin_id: 'adminadmin',
              password: 'adminadmin',
            }),
          });

          const data = await response.json();

          if (response.ok) {
            result.className = 'result success';
            result.textContent =
              '✅ 로그인 성공!\n\n' + JSON.stringify(data, null, 2);
          } else {
            result.className = 'result error';
            result.textContent =
              '❌ 로그인 실패!\n\n' + JSON.stringify(data, null, 2);
          }
        } catch (error) {
          result.className = 'result error';
          result.textContent = '❌ 오류 발생: ' + error.message;
        }
      }

      async function testMessages() {
        const result = document.getElementById('result');
        result.className = 'result';
        result.textContent = 'Messages API 호출 중...';

        try {
          const response = await fetch('/api/v1/messages/');

          console.log('응답 상태:', response.status);
          console.log('응답 OK:', response.ok);

          if (response.status === 401) {
            result.className = 'result error';
            result.textContent =
              '❌ 인증 실패 (401)\n\n먼저 "1. 관리자 로그인" 버튼을 클릭하세요.';
            return;
          }

          const data = await response.json();

          if (response.ok) {
            result.className = 'result success';
            result.textContent =
              `✅ Messages API 성공!\n\n총 ${data.length}개 메시지\n\n` +
              JSON.stringify(data, null, 2);
          } else {
            result.className = 'result error';
            result.textContent =
              '❌ API 오류!\n\n' + JSON.stringify(data, null, 2);
          }
        } catch (error) {
          result.className = 'result error';
          result.textContent =
            '❌ 오류 발생: ' + error.message + '\n\n' + error.stack;
        }
      }

      async function testTickets() {
        const result = document.getElementById('result');
        result.className = 'result';
        result.textContent = 'Tickets API 호출 중...';

        try {
          const response = await fetch('/api/v1/tickets/');

          const data = await response.json();

          if (response.ok) {
            result.className = 'result success';
            result.textContent =
              `✅ Tickets API 성공!\n\n총 ${data.length}개 티켓\n\n` +
              JSON.stringify(data.slice(0, 3), null, 2);
          } else {
            result.className = 'result error';
            result.textContent =
              '❌ API 오류!\n\n' + JSON.stringify(data, null, 2);
          }
        } catch (error) {
          result.className = 'result error';
          result.textContent = '❌ 오류 발생: ' + error.message;
        }
      }
    </script>

    <!-- 회원 세션 전역 변수 -->
    <script src="/static/member_session.js"></script>
    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="/static/admin_session.js"></script>
    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="/static/security.js"></script>
  </body>
</html>
