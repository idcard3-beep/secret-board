<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>로그인 | 나라톡톡</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #f7f8fb;
        --card: #ffffff;
        --ink: #2a3140;
        --ink-sub: #6a7282;
        --line: #e8ebf3;
        --pri: #7da9ff;
        --pri-2: #a9c3ff;
        --ok: #63d3aa;
        --warn: #ffd089;
        --err: #ff8a8a;
        --muted: #f2f4f9;
        --radius: 14px;
        --shadow: 0 6px 20px rgba(116, 130, 170, 0.12);
        --focus: 0 0 0 3px rgba(125, 169, 255, 0.35);
        --tap: 46px;
      }
      html[data-theme='dark'] {
        --bg: #0e1116;
        --card: #12161d;
        --ink: #e9edf5;
        --ink-sub: #a8b2c3;
        --line: #232a35;
        --muted: #171b23;
        --shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        --pri: #80b2ff;
        --pri-2: #9fc6ff;
        --ok: #6ee3ba;
        --warn: #ffd894;
        --err: #ff9b9b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(
            1200px 600px at 0% -10%,
            rgba(125, 169, 255, 0.2),
            transparent 60%
          ),
          radial-gradient(
            1200px 600px at 100% 10%,
            rgba(99, 211, 170, 0.15),
            transparent 55%
          ),
          var(--bg);
        color: var(--ink);
        font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto,
          'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-dot {
        width: 28px;
        height: 28px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--pri), var(--ok));
        box-shadow: 0 2px 8px rgba(125, 169, 255, 0.35);
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .theme-toggle {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        border: 1px solid var(--line);
        background: var(--muted);
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 8px 2px 4px;
      }
      input[type='text'],
      input[type='password'],
      input[type='email'] {
        width: 100%;
        padding: 12px;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff0;
        color: var(--ink);
        outline: none;
      }
      input:focus {
        box-shadow: var(--focus);
        border-color: transparent;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        min-height: var(--tap);
        cursor: pointer;
        font-weight: 700;
      }
      .btn.pri {
        background: linear-gradient(180deg, var(--pri), var(--pri-2));
        color: #0d1a36;
        width: 100%;
      }
      .btn.ghost {
        background: var(--muted);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.link {
        background: transparent;
        color: var(--pri);
        padding: 6px 8px;
        border-radius: 8px;
      }
      .hint {
        font-size: 12px;
        color: var(--ink-sub);
        margin: 4px 2px 0;
      }
      .error {
        font-size: 12px;
        color: var(--err);
        display: none;
        margin: 4px 2px 0;
      }
      .oktxt {
        font-size: 12px;
        color: var(--ok);
        display: none;
        margin: 4px 2px 0;
      }
      .toolbar {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      .row.between {
        justify-content: space-between;
      }
      .caps {
        display: none;
        font-size: 12px;
        color: #b35a00;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 10px 0;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      /* 로그인 상태 표시 */
      .user-info {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--muted);
        border-radius: 12px;
        margin-bottom: 14px;
        border: 1px solid var(--line);
      }
      .user-info.active {
        display: flex;
      }
      .user-info .user-text {
        flex: 1;
        font-size: 14px;
        font-weight: 600;
      }
      .user-info .user-id {
        color: var(--pri);
      }
      .user-info .logout-btn {
        padding: 6px 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .user-info .logout-btn:hover {
        background: var(--err);
        color: white;
        border-color: var(--err);
      }
    </style>
    <!-- 회원 세션 전역 변수 -->
    <script src="/static/member_session.js"></script>
  </head>
  <body>
    <section class="card" role="main" aria-labelledby="title">
      <!-- 로그인 정보 표시 영역 -->
      <div id="userInfoBar" class="user-info">
        <div class="user-text">
          <span class="user-id" id="displayUserId"></span> (<span
            id="displayUserName"
          ></span
          >)
        </div>
        <button type="button" class="logout-btn" id="logoutBtn">
          로그아웃
        </button>
      </div>

      <header class="head">
        <div class="brand">
          <div class="brand-dot" aria-hidden="true"></div>
          <h1 id="title">로그인</h1>
        </div>
        <button
          id="themeBtn"
          class="theme-toggle"
          type="button"
          aria-pressed="false"
          title="다크/라이트 모드 전환"
        >
          라이트
        </button>
      </header>

      <form id="loginForm" novalidate>
        <label for="loginId">아이디 또는 이메일</label>
        <input
          id="loginId"
          name="loginId"
          type="text"
          autocomplete="userid"
          placeholder="예) user123 또는 abc@example.com"
          required
        />
        <div class="error" data-err="loginId">아이디/이메일을 입력하세요.</div>

        <label for="loginPwd">비밀번호</label>
        <div class="row">
          <input
            id="loginPwd"
            name="loginPwd"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          />
        </div>
        <div id="capsNotice" class="caps">Caps Lock이 켜져 있습니다.</div>
        <div class="error" data-err="loginPwd">
          비밀번호(6자 이상)를 입력하세요.
        </div>
        <div class="hint">
          일부 브라우저에서는 비밀번호 입력칸 우측에 표시되는 눈 아이콘으로
          표시/숨기기를 사용할 수 있습니다.
        </div>

        <div class="row between" style="margin-top: 6px">
          <label class="checkbox"
            ><input id="remember" type="checkbox" /> 자동 로그인</label
          >
          <button type="button" id="findBtn" class="btn link">
            아이디/비번 찾기
          </button>
        </div>

        <div class="toolbar">
          <button type="submit" class="btn pri">로그인</button>
          <div class="row" style="justify-content: center; gap: 8px">
            <span class="hint">처음이신가요?</span>
            <a href="#" id="goSignup" class="btn link"
              >회원가입 화면으로 이동</a
            >
          </div>
        </div>
        <div class="hint">
          회원가입 후 등록한 아이디와 비밀번호로 로그인하세요.
        </div>
      </form>

      <div class="divider"></div>
      <footer class="foot">
        <small class="hint">© 나라톡톡</small>
        <div class="row">
          <button
            type="button"
            id="passkeyBtn"
            class="btn ghost"
            disabled
            title="추후 지원 예정"
          >
            패스키(준비중)
          </button>
        </div>
      </footer>

      <!-- 아이디/비번 찾기 모달 -->
      <div
        id="findModal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="findTitle"
        style="position: fixed; inset: 0; display: none; z-index: 9999"
      >
        <div
          id="findBackdrop"
          style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45)"
        ></div>
        <div
          style="
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 560px);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 12px 14px;
              border-bottom: 1px solid var(--line);
            "
          >
            <strong id="findTitle">아이디/비밀번호 찾기</strong>
            <button
              id="findClose"
              class="btn ghost"
              type="button"
              aria-label="닫기"
            >
              닫기
            </button>
          </div>
          <div style="padding: 14px; display: grid; gap: 12px">
            <div style="display: flex; gap: 8px; flex-wrap: wrap">
              <button
                type="button"
                id="tabIdFind"
                class="btn ghost"
                aria-selected="true"
              >
                아이디 찾기
              </button>
              <button type="button" id="tabPwdReset" class="btn ghost">
                비밀번호 재설정
              </button>
            </div>

            <!-- 아이디 찾기 -->
            <form id="formIdFind">
              <label for="findEmail">가입 이메일</label>
              <input
                id="findEmail"
                type="email"
                placeholder="you@example.com"
                required
                inputmode="email"
              />
              <div class="hint">
                로컬 저장된 가입 정보(드래프트)에서 조회합니다.
              </div>
              <div class="toolbar">
                <button type="submit" class="btn pri">아이디 찾기</button>
              </div>
              <div id="resultIdFind" class="hint" style="margin-top: 6px"></div>
            </form>

            <!-- 비밀번호 재설정 -->
            <form id="formPwdReset" style="display: none">
              <label for="resetId">아이디</label>
              <input
                id="resetId"
                type="text"
                placeholder="가입 아이디"
                required
              />
              <label for="resetEmail" style="margin-top: 6px"
                >가입 이메일</label
              >
              <input
                id="resetEmail"
                type="email"
                placeholder="you@example.com"
                required
                inputmode="email"
              />
              <div class="hint">
                실제 이메일 발송 대신 임시 비밀번호를 생성해 보여줍니다(데모).
              </div>
              <div class="toolbar">
                <button type="submit" class="btn pri">
                  임시 비밀번호 발급
                </button>
              </div>
              <div
                id="resultPwdReset"
                class="hint"
                style="margin-top: 6px"
              ></div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script>
      // ===== 회원 세션 관리 함수 (member_session.js 사용) =====

      // 로그인 상태 확인 및 UI 업데이트
      function checkLoginStatus() {
        // member_login.html은 로그인 페이지이므로
        // 항상 로그인 폼을 보여주고, 세션은 무시합니다
        console.log('📝 로그인 페이지 - 로그인 폼 표시');

        // UI를 로그아웃 상태로 강제 설정
        updateLoginUI(false);
        return false;
      }

      // 로그인 UI 업데이트
      function updateLoginUI(isLoggedIn) {
        const userInfoBar = document.getElementById('userInfoBar');
        const loginForm = document.getElementById('loginForm');
        const displayUserId = document.getElementById('displayUserId');
        const displayUserName = document.getElementById('displayUserName');

        const session = window.getMemberSession();

        if (isLoggedIn && session.sMem_id) {
          // 로그인 상태 표시
          userInfoBar.classList.add('active');
          displayUserId.textContent = session.sMem_id;
          displayUserName.textContent = session.sMem_name || '이름없음';
          loginForm.style.display = 'none';

          // 로그인 성공 시 입력 필드 초기화
          const sMem_idInput = document.getElementById('sMem_id');
          const sMem_pwdInput = document.getElementById('sMem_pwd');
          if (sMem_idInput) sMem_idInput.value = '';
          if (sMem_pwdInput) sMem_pwdInput.value = '';
          console.log('🧹 로그인 입력 필드 초기화 완료');
        } else {
          // 로그아웃 상태
          userInfoBar.classList.remove('active');
          loginForm.style.display = '';

          // 로그아웃 시 텍스트 내용도 완전히 초기화
          displayUserId.textContent = '';
          displayUserName.textContent = '';
          console.log('🧹 로그아웃 - 사용자 정보 표시 영역 초기화 완료');
        }
      }

      // 로그아웃 처리
      // 로그아웃 처리
      function handleLogout() {
        // member_session.js의 전역 함수 사용
        window.clearMemberSession();

        // 입력 필드 초기화 (로그아웃 시에도)
        const sMem_idInput = document.getElementById('sMem_id');
        const sMem_pwdInput = document.getElementById('sMem_pwd');
        if (sMem_idInput) sMem_idInput.value = '';
        if (sMem_pwdInput) sMem_pwdInput.value = '';
        console.log('🧹 로그아웃 - 입력 필드 초기화 완료');

        // UI 업데이트
        updateLoginUI(false);

        alert('✅ 로그아웃되었습니다.');
      }

      // 다크/라이트 토글
      (function themeInit() {
        const btn = document.getElementById('themeBtn');
        const saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
        btn.textContent =
          document.documentElement.getAttribute('data-theme') === 'dark'
            ? '다크'
            : '라이트';
        btn.setAttribute(
          'aria-pressed',
          document.documentElement.getAttribute('data-theme') === 'dark'
        );
        btn.addEventListener('click', () => {
          const cur = document.documentElement.getAttribute('data-theme');
          const next = cur === 'dark' ? '' : 'dark';
          if (next) document.documentElement.setAttribute('data-theme', next);
          else document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', next);
          btn.textContent = next === 'dark' ? '다크' : '라이트';
          btn.setAttribute('aria-pressed', next === 'dark');
        });
      })();

      // 로그인 UX
      (function () {
        const form = document.getElementById('loginForm');
        const idEl = document.getElementById('loginId');
        const pwdEl = document.getElementById('loginPwd');
        const remember = document.getElementById('remember');
        const caps = document.getElementById('capsNotice');

        // Caps Lock 감지
        function handleKey(e) {
          const isCaps = e.getModifierState && e.getModifierState('CapsLock');
          caps.style.display = isCaps ? 'block' : 'none';
        }
        pwdEl.addEventListener('keydown', handleKey);
        pwdEl.addEventListener('keyup', handleKey);

        // Remember me 복원
        (function restore() {
          try {
            const saved = JSON.parse(
              localStorage.getItem('loginRemember') || 'null'
            );
            if (saved && saved.id) {
              idEl.value = saved.id;
              remember.checked = true;
            }
          } catch {}
        })();

        function showErr(name) {
          const e = form.querySelector(`.error[data-err="${name}"]`);
          if (e) e.style.display = 'block';
        }
        function hideErrs() {
          form
            .querySelectorAll('.error')
            .forEach((e) => (e.style.display = 'none'));
        }

        // sMembers 테이블 DB 인증 - 서버에서 bcrypt 검증
        async function authenticateUser(id, pwd) {
          try {
            // 서버의 로그인 API 호출 (bcrypt 비밀번호 검증)
            const response = await fetch('/api/v1/smembers/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                sMem_id: id,
                password: pwd,
              }),
            });

            const result = await response.json();

            if (result.ok && result.data) {
              // 로그인 성공 - 회원 정보 저장 (비밀번호는 제외됨)
              sessionStorage.setItem(
                'currentUser',
                JSON.stringify(result.data)
              );
              return {
                success: true,
                memberData: result.data, // 회원 정보 반환
              };
            }

            // 로그인 실패 - 서버 에러 메시지 반환
            return {
              success: false,
              error: result.error || '로그인에 실패했습니다.',
            };
          } catch (error) {
            console.error('인증 오류:', error);
            return {
              success: false,
              error: '서버 연결에 실패했습니다.',
            };
          }
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideErrs();
          const id = idEl.value.trim();
          const pwd = pwdEl.value;

          let ok = true;
          if (!id) {
            showErr('loginId');
            ok = false;
          }
          if (!pwd || pwd.length < 6) {
            showErr('loginPwd');
            ok = false;
          }
          if (!ok) return;

          // 로그인 진행 중 표시
          const submitBtn = form.querySelector('button[type="submit"]');
          const originalText = submitBtn.textContent;
          submitBtn.textContent = '로그인 중...';
          submitBtn.disabled = true;

          const result = await authenticateUser(id, pwd);

          submitBtn.textContent = originalText;
          submitBtn.disabled = false;

          if (result.success) {
            if (remember.checked) {
              localStorage.setItem('loginRemember', JSON.stringify({ id }));
            } else {
              localStorage.removeItem('loginRemember');
            }

            // sMem_status 확인 (OPEN만 로그인 허용)
            const memberStatus = (
              result.memberData.sMem_status ||
              result.memberData.smem_status ||
              ''
            ).toUpperCase();
            console.log('📋 회원 상태(sMem_status):', memberStatus);

            if (memberStatus !== 'OPEN') {
              alert(
                '❌ 로그인할 수 없는 계정 상태입니다.\n계정 상태: ' +
                  memberStatus
              );
              return;
            }

            // 로그인 성공 → 세션 토큰 발급
            const token =
              Math.random().toString(36).slice(2) +
              Math.random().toString(36).slice(2);
            sessionStorage.setItem('mock_access_token', token);

            console.log('✅ 로그인 성공! 서버 응답:', result);
            console.log('📦 회원 데이터:', result.memberData);

            // 로그인 성공 시 사용자 정보 저장 (대소문자 모두 처리 + adviser_role 추가)
            const memberData = {
              sMem_id:
                result.memberData.sMem_id || result.memberData.smem_id || '',
              sMem_name:
                result.memberData.sMem_name ||
                result.memberData.smem_name ||
                '',
              sMem_nickname:
                result.memberData.sMem_nickname ||
                result.memberData.smem_nickname ||
                '',
              sMem_status: memberStatus,
              adviser_role:
                result.memberData.adviser_role ||
                result.memberData.adviser_role ||
                'A',
            };

            console.log('✅ 로그인 성공! 회원 정보:', memberData);
            console.log(
              '👤 상담사 역할(adviser_role):',
              memberData.adviser_role
            );

            // member_session.js의 전역 함수 사용하여 세션 설정
            window.setMemberSession(memberData);

            // UI 업데이트
            updateLoginUI(true);

            // 부모 페이지(main_index.html)에 로그인 성공 메시지 전송
            if (window.parent !== window) {
              console.log('📤 부모 페이지에 로그인 성공 메시지 전송');
              window.parent.postMessage('memberLoginSuccess', '*');
            } else {
              console.log('⚠️ iframe이 아닌 환경에서 실행 중');
            }

            alert('✅ 로그인 성공!');

            // TODO: 실제 서비스에서는 /dashboard 같은 페이지로 이동
            // window.location.href = '/dashboard.html';
          } else {
            // 서버에서 반환한 에러 메시지 표시
            alert('❌ ' + (result.error || '로그인에 실패했습니다.'));
          }
        });

        document.getElementById('goSignup').addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = 'member_cardup.html';
        });
      })();

      // ===== 아이디/비번 찾기 모달 =====
      (function () {
        const openBtn = document.getElementById('findBtn');
        const modal = document.getElementById('findModal');
        const closeBtn = document.getElementById('findClose');
        const backdrop = document.getElementById('findBackdrop');
        const tabId = document.getElementById('tabIdFind');
        const tabPw = document.getElementById('tabPwdReset');
        const formIdFind = document.getElementById('formIdFind');
        const formPwdReset = document.getElementById('formPwdReset');
        const findEmail = document.getElementById('findEmail');
        const resetId = document.getElementById('resetId');
        const resetEmail = document.getElementById('resetEmail');
        const resultIdFind = document.getElementById('resultIdFind');
        const resultPwdReset = document.getElementById('resultPwdReset');

        function openModal() {
          modal.style.display = 'block';
          modal.setAttribute('aria-hidden', 'false');
          setTimeout(() => findEmail.focus(), 0);
          document.body.style.overflow = 'hidden';
          window.addEventListener('keydown', escClose);
        }
        function closeModal() {
          modal.style.display = 'none';
          modal.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
          window.removeEventListener('keydown', escClose);
        }
        function escClose(e) {
          if (e.key === 'Escape') closeModal();
        }

        openBtn?.addEventListener('click', () => openModal());
        closeBtn?.addEventListener('click', () => closeModal());
        backdrop?.addEventListener('click', () => closeModal());

        function setTab(which) {
          const a = which === 'id';
          tabId.classList.toggle('pri', a);
          tabPw.classList.toggle('pri', !a);
          tabId.setAttribute('aria-selected', a);
          tabPw.setAttribute('aria-selected', !a);
          formIdFind.style.display = a ? '' : 'none';
          formPwdReset.style.display = a ? 'none' : '';
          (a ? findEmail : resetId).focus();
          resultIdFind.textContent = '';
          resultPwdReset.textContent = '';
        }
        tabId?.addEventListener('click', () => setTab('id'));
        tabPw?.addEventListener('click', () => setTab('pw'));
        setTab('id');

        function getDraft() {
          try {
            return (
              JSON.parse(localStorage.getItem('sMembersDraft') || 'null') ||
              null
            );
          } catch {
            return null;
          }
        }
        function isEmail(v) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v || '');
        }

        // 아이디 찾기 - sMembers 테이블에서 조회
        formIdFind.addEventListener('submit', async (e) => {
          e.preventDefault();
          resultIdFind.textContent = '';
          resultIdFind.style.color = '';

          const mail = (findEmail.value || '').trim();
          if (!isEmail(mail)) {
            resultIdFind.textContent = '유효한 이메일을 입력해 주세요.';
            resultIdFind.style.color = 'var(--err)';
            return;
          }

          try {
            const response = await fetch('/api/v1/smembers/');
            if (!response.ok) {
              resultIdFind.textContent = '회원 정보 조회에 실패했습니다.';
              resultIdFind.style.color = 'var(--err)';
              return;
            }

            const result = await response.json();
            const members = result.data || []; // API 응답 형식: { ok: true, data: [...] }

            console.log('🔍 아이디 찾기 - 전체 회원 수:', members.length);
            console.log('🔍 검색 이메일:', mail);

            // PostgreSQL 대소문자 처리: sMem_email 또는 smem_email
            const found = members.find((m) => {
              const dbEmail = String(
                m.sMem_email || m.smem_email || ''
              ).toLowerCase();
              const searchEmail = mail.toLowerCase();
              console.log('  비교:', dbEmail, '===', searchEmail);
              return dbEmail === searchEmail;
            });

            if (found) {
              const foundId = found.sMem_id || found.smem_id;
              console.log('✅ 아이디 찾기 성공:', foundId);

              resultIdFind.innerHTML =
                '<strong style="color: var(--ok);">✅ 아이디를 찾았습니다!</strong><br>' +
                '가입 아이디: <strong style="color: var(--pri); font-size: 16px;">' +
                String(foundId) +
                '</strong>';
              resultIdFind.style.color = 'var(--ok)';

              // 입력 필드 초기화
              findEmail.value = '';
            } else {
              console.log('❌ 아이디 찾기 실패 - 일치하는 이메일 없음');
              resultIdFind.textContent =
                '해당 이메일로 가입된 회원 정보를 찾을 수 없습니다.';
              resultIdFind.style.color = 'var(--err)';
            }
          } catch (error) {
            console.error('아이디 찾기 오류:', error);
            resultIdFind.textContent =
              '오류가 발생했습니다. 다시 시도해 주세요.';
            resultIdFind.style.color = 'var(--err)';
          }
        });

        // 비밀번호 재설정 - 실제 DB에 임시 비밀번호 발급
        formPwdReset.addEventListener('submit', async (e) => {
          e.preventDefault();
          resultPwdReset.textContent = '';
          resultPwdReset.style.color = '';

          const id = (resetId.value || '').trim();
          const mail = (resetEmail.value || '').trim();

          if (!id) {
            resultPwdReset.textContent = '아이디를 입력해 주세요.';
            resultPwdReset.style.color = 'var(--err)';
            return;
          }
          if (!isEmail(mail)) {
            resultPwdReset.textContent = '유효한 이메일을 입력해 주세요.';
            resultPwdReset.style.color = 'var(--err)';
            return;
          }

          try {
            // 실제 API로 임시 비밀번호 발급 요청
            const response = await fetch('/api/v1/smembers/reset-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                sMem_id: id,
                sMem_email: mail,
              }),
            });

            const result = await response.json();

            if (result.ok && result.data) {
              // 성공 - 임시 비밀번호 표시
              resultPwdReset.innerHTML =
                '<strong style="color: var(--ok);">✅ 임시 비밀번호가 발급되었습니다!</strong><br>' +
                '임시 비밀번호: <strong style="color: var(--pri); font-size: 16px;">' +
                result.data.tempPassword +
                '</strong><br>' +
                '<small style="color: var(--warn);">⚠️ 로그인 후 반드시 비밀번호를 변경해주세요.</small>';
              resultPwdReset.style.color = 'var(--ok)';

              // 입력 필드 초기화
              resetId.value = '';
              resetEmail.value = '';
            } else {
              // 실패
              resultPwdReset.textContent =
                result.error || '비밀번호 재설정에 실패했습니다.';
              resultPwdReset.style.color = 'var(--err)';
            }
          } catch (error) {
            console.error('비밀번호 재설정 오류:', error);
            resultPwdReset.textContent =
              '오류가 발생했습니다. 다시 시도해 주세요.';
            resultPwdReset.style.color = 'var(--err)';
          }
        });

        function genTempPwd() {
          const chars =
            'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
          let s = '';
          for (let i = 0; i < 10; i++) {
            s += chars[Math.floor(Math.random() * chars.length)];
          }
          return s;
        }
      })();

      // ===== 페이지 로드 시 로그인 상태 확인 =====
      document.addEventListener('DOMContentLoaded', () => {
        checkLoginStatus();

        // 로그아웃 버튼 이벤트 연결
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', handleLogout);
        }
      });
    </script>

    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="/static/admin_session.js"></script>
    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="/static/security.js"></script>
  </body>
</html>
