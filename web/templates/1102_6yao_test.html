<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1102 6효 테스트</title>
  </head>
  <body>
    <h1>1102 6효 테스트 페이지</h1>
    <p>이 페이지가 정상적으로 로드되면 Flask 라우팅은 문제없습니다.</p>

    <button
      onclick="alert('Flask 라우트 테스트'); window.open('/admin_login', 'adminLogin', 'width=500,height=650');"
    >
      🔐 관리자 로그인 (Flask 라우트)
    </button>

    <br /><br />

    <button
      onclick="alert('직접 파일 테스트'); window.open('admin_login.html', 'adminLogin', 'width=500,height=650');"
    >
      🔐 관리자 로그인 (직접 파일)
    </button>

    <br /><br />

    <p><strong>테스트 방법:</strong></p>
    <ol>
      <li>첫 번째 버튼: Flask 라우트 /admin_login 사용</li>
      <li>두 번째 버튼: 직접 admin_login.html 파일 접근</li>
    </ol>
  </body>
</html>
