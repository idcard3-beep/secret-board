<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나라톡톡 심리상담센터 | 전문가 소개</title>
    <style>
      :root {
        --bg: #fafbfc;
        --fg: #1a202c;
        --muted: #64748b;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --card: #ffffff;
        --ring: #e2e8f0;
        --shadow: 0 4px 16px rgba(99, 102, 241, 0.08),
          0 2px 8px rgba(0, 0, 0, 0.04);
        --radius: 14px;
        --focus: 0 0 0 3px rgba(59, 130, 246, 0.25);
      }
      body {
        margin: 0;
        background: linear-gradient(
          135deg,
          var(--bg) 0%,
          color-mix(in oklab, var(--accent) 3%, var(--bg)) 100%
        );
        color: var(--fg);
        font: 14px/1.7 Pretendard, system-ui, -apple-system, sans-serif;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        color: var(--fg);
        position: relative;
        padding-left: 16px;
      }
      h1::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 5px;
        height: 75%;
        background: linear-gradient(
          180deg,
          var(--accent),
          color-mix(in oklab, var(--accent) 70%, #06b6d4)
        );
        border-radius: 3px;
      }
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 2px solid
          color-mix(in oklab, var(--ring) 70%, transparent);
      }
      .close-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: #dc3545;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(220, 53, 69, 0.25);
      }
      .close-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(220, 53, 69, 0.35);
      }
      .close-btn svg {
        width: 16px;
        height: 16px;
      }
      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--ring);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--accent),
          color-mix(in oklab, var(--accent) 60%, #06b6d4)
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15),
          0 4px 12px rgba(0, 0, 0, 0.08);
      }
      .card:hover::before {
        opacity: 1;
      }
      .panel {
        padding: 24px;
      }
      .expert-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 2px solid
          color-mix(in oklab, var(--ring) 70%, transparent);
      }
      .expert-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .num {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(
          135deg,
          var(--accent),
          color-mix(in oklab, var(--accent) 80%, #06b6d4)
        );
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        box-shadow: 0 2px 8px
          color-mix(in oklab, var(--accent) 30%, transparent);
      }
      .col-2 {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 520px) {
        .col-2 {
          grid-template-columns: 1fr;
        }
      }
      .photo {
        width: 150px;
        height: 180px;
        border: 2px dashed var(--ring);
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          color-mix(in oklab, var(--accent) 5%, var(--card)),
          color-mix(in oklab, var(--accent) 3%, var(--card))
        );
        display: grid;
        place-items: center;
        transition: all 0.3s ease;
      }
      .photo:hover {
        border-color: var(--accent);
        background: linear-gradient(
          135deg,
          color-mix(in oklab, var(--accent) 8%, var(--card)),
          color-mix(in oklab, var(--accent) 5%, var(--card))
        );
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      input[type='file'] {
        display: none;
      }
      label.upload {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border: 1px solid transparent;
        border-radius: 50%;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-hover));
        color: #fff;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px
          color-mix(in oklab, var(--accent) 30%, transparent);
      }
      label.upload:hover {
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 4px 12px
          color-mix(in oklab, var(--accent) 40%, transparent);
      }
      label.upload svg {
        width: 18px;
        height: 18px;
        stroke: #fff;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 0;
      }
      .field label {
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
      }
      .inpt,
      .area,
      .select {
        width: 100%;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--ring);
        background: var(--bg);
        color: var(--fg);
        font-size: 14px;
        transition: all 0.2s ease;
      }
      .inpt:focus,
      .area:focus,
      .select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: var(--focus);
        background: var(--card);
      }
      .area {
        min-height: 80px;
        resize: vertical;
        line-height: 1.6;
      }
      .check-groups {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        background: linear-gradient(
          135deg,
          color-mix(in oklab, var(--card) 98%, var(--accent)),
          var(--card)
        );
        border-radius: 10px;
        border: 1px solid color-mix(in oklab, var(--ring) 80%, transparent);
      }
      .group-title {
        font-weight: 700;
        font-size: 12px;
        color: var(--accent);
        letter-spacing: -0.02em;
      }
      .chip-flow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--ring);
        padding: 5px 9px;
        border-radius: 8px;
        background: var(--card);
        font-size: 12px;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--accent);
        background: color-mix(in oklab, var(--accent) 5%, var(--card));
        transform: translateY(-1px);
        box-shadow: 0 2px 6px rgba(59, 130, 246, 0.1);
      }
      .chip input {
        accent-color: var(--accent);
        cursor: pointer;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border: 1px solid var(--ring);
        border-radius: 10px;
        padding: 10px;
        background: var(--bg);
        transition: all 0.2s ease;
      }
      .tags:focus-within {
        border-color: var(--accent);
        box-shadow: var(--focus);
        background: var(--card);
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--ring);
        background: linear-gradient(
          135deg,
          color-mix(in oklab, var(--accent) 8%, var(--card)),
          var(--card)
        );
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .tag:hover {
        border-color: #ef4444;
        background: color-mix(in oklab, #ef4444 8%, var(--card));
        transform: scale(0.95);
      }
      .tag-inpt {
        flex: 1;
        min-width: 140px;
        border: none;
        outline: none;
        background: transparent;
        font-size: 13px;
      }
    </style>
    <link rel="stylesheet" href="/static/security.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="container">
          <div class="page-header">
            <h1>상담 전문가 소개</h1>
            <button class="close-btn" id="closeBtn" aria-label="닫기">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
              닫기
            </button>
          </div>
          <div id="experts" class="grid"></div>
        </div>
      </section>
    </main>
    <script>
      const TOTAL = 50;
      const GROUPS = {
        '심리 · 정서': [
          '우울',
          '불안',
          '번아웃',
          '스트레스 관리',
          '자기조절/감정조절',
          '트라우마',
          '애착',
          '중독',
        ],
        '관계 · 발달': [
          '대인관계/의사소통',
          '부부/커플',
          '가족/양육',
          '청소년/학업',
          '진로/커리어',
        ],
        '전문 기법': ['CBT', 'ACT', 'DBT', '마음챙김'],
        '동 · 서양 역학': [
          '사주명리',
          '주역/육효',
          '만세력',
          '서양점성(천궁도)',
          '시기/전환기',
        ],
      };
      const ROLES = [
        '심리상담전문가',
        '동양역학전문가',
        '서양역학전문가',
        '통합상담전문가',
        '수퍼바이저',
      ];
      function makeExpertCard(idx) {
        const id = idx + 1;
        const wrap = document.createElement('article');
        wrap.className = 'card panel expert';
        const groupHTML = Object.entries(GROUPS)
          .map(
            ([title, items]) =>
              `<div class="group"><div class="group-title">${title}</div><div class="chip-flow">${items
                .map(
                  (sp) =>
                    `<label class="chip"><input type="checkbox" value="${sp}"> ${sp}</label>`
                )
                .join('')}</div></div>`
          )
          .join('');
        wrap.innerHTML = `<div class="expert-head"><div class="expert-title"><span class="num">${id}</span><strong>전문가 #${id}</strong></div><span class="muted">필수: 이름 · 직함 · 담당 분야</span></div><div class="col-2"><!-- 좌: 사진 --><div><div class="photo" id="photoBox${id}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div><div class="row" style="margin-top:8px;justify-content:center"><label class="upload" title="사진 업로드"><input type="file" accept="image/*" data-role="photo" data-id="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></label></div></div><!-- 우: 기본 정보 --><div class="row" style="align-items:flex-start"><div class="field" style="flex:0 1 140px"><label>이름</label><input class="inpt" placeholder="예: 김가온"></div><div class="field" style="flex:0 1 160px"><label>직함/역할</label><select class="select">${ROLES.map(
          (r) => `<option>${r}</option>`
        ).join(
          ''
        )}</select></div><div class="field" style="flex:1 1 200px"><label>한줄 소개</label><input class="inpt" placeholder="예: 불안·수면·행동습관 전문"></div></div></div><!-- 아래는 원상 유지 --><div class="field" style="flex:1 1 100%"><label>담당 상담 분야 <span class="hint">(체크 + 아래 태그로 추가 가능)</span></label><div class="check-groups">${groupHTML}</div></div><div class="field" style="flex:1 1 100%"><label>추가 태그 <span class="hint">(엔터로 추가, 클릭으로 삭제)</span></label><div class="tags"><input class="tag-inpt" placeholder="예: 공황, 산후우울, 시험불안"></div></div><div class="field" style="flex:1 1 100%"><label>소개(요약)</label><textarea class="area" placeholder="전문 분야, 상담 철학, 사용 기법 등을 2~3문장으로 작성"></textarea></div><div class="field" style="flex:1 1 100%"><label>경력·자격</label><textarea class="area" placeholder="자격증/학력/기관경력/수퍼비전 등 핵심만 줄바꿈으로"></textarea></div>`;
        return wrap;
      }
      const expertsEl = document.getElementById('experts');
      for (let i = 0; i < TOTAL; i++) {
        expertsEl.appendChild(makeExpertCard(i));
      }

      // 닫기 버튼 이벤트 핸들러
      document.getElementById('closeBtn').addEventListener('click', () => {
        // iframe 내부에서 실행 중인지 확인
        if (window.self !== window.top) {
          // iframe 내부에서 실행 중: 부모 창으로 돌아가기
          window.parent.postMessage('closeIframe', '*');
        } else {
          // 독립 창에서 실행 중: 창 닫기
          window.close();
        }
      });
    </script>

    <!-- 회원 세션 전역 변수 -->
    <script src="/static/member_session.js"></script>
    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="/static/admin_session.js"></script>
    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="/static/security.js"></script>
  </body>
</html>
