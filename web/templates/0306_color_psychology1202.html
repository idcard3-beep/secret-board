<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>컬러 심리학 120 색상 심리적 의미 (감정→색조군→상담활용)</title>
    <meta
      name="description"
      content="감정 기반, 색조군 기반, 상담 활용군 기반으로 분류한 120가지 색상 심리적 의미 카탈로그. 부드러운 파스텔 테마, 반응형, 검색/필터."
    />
    <style>
      :root {
        --bg: #f7f8fb;
        --card: #ffffff;
        --text: #223047;
        --muted: #73829a;
        --border: #e7ebf3;
        --accent: #eef3ff;
        --ring: rgba(120, 161, 255, 0.35);
        --good: #cfeee0;
        --warn: #fff0c9;
        --info: #e9f1ff;
      }
      html.dark {
        --bg: #0b1220;
        --card: #0f172a;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: #1f2937;
        --accent: #111827;
        --ring: rgba(138, 180, 255, 0.35);
        --good: #0f2b22;
        --warn: #3a2c0a;
        --info: #0f1b33;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.7 system-ui, -apple-system, Segoe UI, Roboto,
          Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: color-mix(in srgb, var(--bg) 90%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 16px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .title {
        font-size: 20px;
        font-weight: 800;
      }
      .sub {
        font-size: 12.5px;
        color: var(--muted);
      }
      .right {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      input[type='search'] {
        width: min(56vw, 420px);
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        outline: none;
      }
      input[type='search']:focus {
        box-shadow: 0 0 0 4px var(--ring);
        border-color: transparent;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 9px 12px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--accent);
      }
      main {
        padding: 18px 0 64px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .tab {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        cursor: pointer;
        font-weight: 700;
      }
      .tab.active {
        background: linear-gradient(180deg, #9bbcf9, #b9f2e3);
        color: #0b1220;
        border-color: transparent;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .filter {
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        font-size: 12.5px;
        cursor: pointer;
      }
      .filter.active {
        background: var(--accent);
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(3, 1fr);
      }
      @media (max-width: 1080px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 680px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        padding: 12px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .name {
        font-weight: 800;
      }
      .pill {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px dashed var(--border);
        color: var(--muted);
        background: var(--accent);
      }
      .sw {
        display: flex;
        gap: 6px;
        margin: 10px 0;
      }
      .chip {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .row {
        display: grid;
        gap: 6px;
        grid-template-columns: 1fr;
      }
      .k {
        color: var(--muted);
        font-size: 12.5px;
      }
      .hint {
        margin-top: 8px;
        padding: 8px;
        border-radius: 10px;
        background: var(--info);
        color: var(--muted);
        font-size: 12.5px;
      }
      .ok {
        background: var(--good);
      }
      .warn {
        background: var(--warn);
      }
      footer {
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      @media print {
        header,
        .tabs,
        .filters,
        .right {
          display: none;
        }
        body {
          background: #fff;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap top">
        <div>
          <div class="title">컬러 심리학 120 색상 심리적 의미</div>
          <div class="sub">
            ① 감정 기반 → ② 색조군 기반 → ③ 상담 활용군 기반 · 부드러운 파스텔
            테마 · 반응형
          </div>
        </div>
        <div class="right">
          <input
            id="q"
            type="search"
            placeholder="검색 (예: 신뢰, 불안, 파스텔, 보색, 수면, 네이비…)"
          />
          <button id="themeBtn" class="btn">테마</button>
          <button id="exitBtn" class="btn">종료</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <!-- Tabs: 1) Emotion 2) Tone 3) Counseling Goal -->
      <div class="tabs">
        <button class="tab active" data-mode="emotion">① 감정 기반</button>
        <button class="tab" data-mode="tone">② 색조군 기반</button>
        <button class="tab" data-mode="goal">③ 상담 활용군 기반</button>
      </div>
      <div id="filterBar" class="filters"></div>
      <div id="grid" class="grid"></div>
      <footer>
        ※ 각 조합은 일반 경향을 제시합니다. <b>개인·문화 의미</b>와
        <b>명도·채도·면적·조명</b>에 따라 반응이 크게 달라질 수 있습니다.
      </footer>
    </main>

    <script>
      /* ========= THEME / EXIT ========= */
      const root = document.documentElement,
        themeBtn = document.getElementById('themeBtn'),
        exitBtn = document.getElementById('exitBtn');
      if (localStorage.getItem('theme') === 'dark') root.classList.add('dark');
      themeBtn.addEventListener('click', () => {
        root.classList.toggle('dark');
        localStorage.setItem(
          'theme',
          root.classList.contains('dark') ? 'dark' : 'light'
        );
      });
      exitBtn.addEventListener('click', () => {
        // iframe 내부에서 실행 중인지 확인
        if (window.self !== window.top) {
          // iframe 내부에서 실행 중: 부모 창으로 돌아가기
          window.parent.postMessage('closeIframe', '*');
        } else {
          // 독립 창에서 실행 중: 창 닫기
          window.close();
        }
      });

      /* ========= DATA MODEL ========= */
      /* 20 base combos × 6 accents = 120 */
      const HEX = (h) => h; // helper for readability
      const bases = [
        {
          key: 'B01',
          name: '블루 + 화이트',
          colors: [HEX('#3b82f6'), HEX('#ffffff')],
          emotion: '신뢰',
          tone: '쿨·하모니',
          goal: '집중력 향상',
          meaning: '명료·차분·전문성. 거리두기와 안정의 균형.',
          use: '상담 Intake 폼, 의료/IT UI, 규칙 안내',
          caution: '저명도 과하면 냉정/거리감',
        },
        {
          key: 'B02',
          name: '세이지그린 + 베이지',
          colors: [HEX('#94b8a6'), HEX('#e9dccb')],
          emotion: '안정',
          tone: '뉴트럴·하모니',
          goal: '불안 완화',
          meaning: '자연·회복·균형. 시각 피로 완충.',
          use: '상담실 벽/소품, 대기실',
          caution: '과도 저채도는 침잠감',
        },
        {
          key: 'B03',
          name: '옐로 + 그레이',
          colors: [HEX('#eab308'), HEX('#9ca3af')],
          emotion: '낙관',
          tone: '웜·컨트라스트',
          goal: '행동 활성',
          meaning: '주의환기·낙관·아이디어 촉진.',
          use: '학습/워크숍 포인트, TODO 하이라이트',
          caution: '고채도 대면적 피로',
        },
        {
          key: 'B04',
          name: '코랄 + 베이지',
          colors: [HEX('#fb7185'), HEX('#f5e6da')],
          emotion: '따뜻함',
          tone: '웜·하모니',
          goal: '라포/공감',
          meaning: '돌봄·유대·포용. 라포 형성에 유익.',
          use: '웰컴 영역, 라벨/배지',
          caution: '유아화 인상 시 채도↓',
        },
        {
          key: 'B05',
          name: '네이비 + 골드',
          colors: [HEX('#1e293b'), HEX('#f59e0b')],
          emotion: '권위',
          tone: '쿨·컨트라스트',
          goal: '자기확신',
          meaning: '고급·믿음·성과 상징.',
          use: '마일스톤/성과 보드, 보고서 헤더',
          caution: '면적 과하면 위압',
        },
        {
          key: 'B06',
          name: '민트 + 네이비',
          colors: [HEX('#99f6e4'), HEX('#1f2a44')],
          emotion: '신선',
          tone: '쿨·컨트라스트',
          goal: '집중력 향상',
          meaning: '청량·명료. 집중 유지에 도움.',
          use: '타임블록 카드, 집중 존',
          caution: '차가움 트리거 시 민트 명도↑',
        },
        {
          key: 'B07',
          name: '라벤더 + 라이트그레이',
          colors: [HEX('#c4b5fd'), HEX('#e5e7eb')],
          emotion: '평온',
          tone: '쿨·하모니',
          goal: '수면 위생',
          meaning: '진정·휴식·완충.',
          use: '수면/이완 안내, 저녁 루틴 UI',
          caution: '저채도 과하면 침체',
        },
        {
          key: 'B08',
          name: '틸 + 화이트',
          colors: [HEX('#14b8a6'), HEX('#ffffff')],
          emotion: '청결',
          tone: '쿨·하모니',
          goal: '불안 완화',
          meaning: '위생·신선·안심.',
          use: '위생/웰니스 안내, 체크리스트',
          caution: '차가움 과도 시 온기 보완',
        },
        {
          key: 'B09',
          name: '오렌지 + 슬레이트',
          colors: [HEX('#f97316'), HEX('#334155')],
          emotion: '활력',
          tone: '웜/쿨·컨트라스트',
          goal: '행동 활성',
          meaning: '사교·놀이·에너지. 실행 촉진.',
          use: '브레인스토밍, CTA 버튼',
          caution: '고채도 과자극 주의',
        },
        {
          key: 'B10',
          name: '그린 + 우드',
          colors: [HEX('#22c55e'), HEX('#a16207')],
          emotion: '회복',
          tone: '웜/쿨·하모니',
          goal: '스트레스 관리',
          meaning: '자연·균형·접지감.',
          use: '휴식 코너, 관엽식물·우드톤 매치',
          caution: '브라운 과하면 답답',
        },
        {
          key: 'B11',
          name: '핑크 + 베이지',
          colors: [HEX('#f472b6'), HEX('#ead9cd')],
          emotion: '유대',
          tone: '웜·하모니',
          goal: '관계 개선',
          meaning: '돌봄·안도·포용.',
          use: '라포 형성, 피드백 코너',
          caution: '채도 높으면 유치 인상',
        },
        {
          key: 'B12',
          name: '블랙 + 화이트',
          colors: [HEX('#111827'), HEX('#ffffff')],
          emotion: '명료',
          tone: '뉴트럴·컨트라스트',
          goal: '규칙/경계 설정',
          meaning: '선명·질서·명확.',
          use: '정보구조, 경계/구분선',
          caution: '고대비 장시간 피로',
        },
        {
          key: 'B13',
          name: '레드 + 블랙',
          colors: [HEX('#ef4444'), HEX('#0f172a')],
          emotion: '긴장',
          tone: '웜·컨트라스트',
          goal: '주의 환기',
          meaning: '경고·위험·각성.',
          use: '주의 표식, 알림 배지 소량',
          caution: '불안/공황군 과자극',
        },
        {
          key: 'B14',
          name: '시안 + 차콜',
          colors: [HEX('#06b6d4'), HEX('#374151')],
          emotion: '차분',
          tone: '쿨·컨트라스트',
          goal: '집중력 향상',
          meaning: '테크·맑음·가독.',
          use: '폼/표 배경, 데이터 대시보드',
          caution: '차가움 과도시 거리감',
        },
        {
          key: 'B15',
          name: '샌드 + 스카이블루',
          colors: [HEX('#e9decf'), HEX('#93c5fd')],
          emotion: '개방',
          tone: '웜/쿨·하모니',
          goal: '창의',
          meaning: '여백·개방감·호기심.',
          use: '아이데이션 벽, 노트 섹션',
          caution: '명도 과하면 산만',
        },
        {
          key: 'B16',
          name: '플럼 + 샌드',
          colors: [HEX('#7c3aed'), HEX('#ead7c4')],
          emotion: '사색',
          tone: '웜/쿨·하모니',
          goal: '자기표현',
          meaning: '내면·상상·격식.',
          use: '저널링/예술치료 코너',
          caution: '퍼플 농도 과하면 거리감',
        },
        {
          key: 'B17',
          name: '포레스트 + 크림',
          colors: [HEX('#166534'), HEX('#fff7ed')],
          emotion: '안심',
          tone: '웜/쿨·하모니',
          goal: '불안 완화',
          meaning: '안정·따뜻한 균형.',
          use: '상담실 텍스타일, 쿠션',
          caution: '그린 너무 진하면 무거움',
        },
        {
          key: 'B18',
          name: '인디고 + 실버',
          colors: [HEX('#3730a3'), HEX('#c0c7d1')],
          emotion: '전문성',
          tone: '쿨·하모니',
          goal: '신뢰 구축',
          meaning: '권위·지성·정돈.',
          use: '리포트, 내비게이션 바',
          caution: '침잠감 시 라이트톤 보완',
        },
        {
          key: 'B19',
          name: '터쿼이즈 + 코랄',
          colors: [HEX('#22d3ee'), HEX('#fb7185')],
          emotion: '즐거움',
          tone: '쿨/웜·컨트라스트',
          goal: '창의/표현',
          meaning: '놀이·유연·생동.',
          use: '워크숍, 스티커/태그',
          caution: '장시간 노출 피로',
        },
        {
          key: 'B20',
          name: '올리브 + 아이보리',
          colors: [HEX('#6b8e23'), HEX('#fffaf0')],
          emotion: '균형',
          tone: '웜·하모니',
          goal: '안정 유지',
          meaning: '토닉·현실감·안정.',
          use: '일상 루틴, 체크리스트',
          caution: '올리브 과다 시 탁함',
        },
      ];

      const accents = [
        {
          tag: '매트 골드',
          color: '#f0c457',
          add: '+ 성취/보상 강조',
          adjUse: '성과/감사 배지',
          adjCaution: '과하면 과시',
        },
        {
          tag: '민트 라이트',
          color: '#c6f7e2',
          add: '+ 신선/청량 보완',
          adjUse: '집중/가독 보완',
          adjCaution: '차가움 트리거 주의',
        },
        {
          tag: '코랄 라이트',
          color: '#ffd1cf',
          add: '+ 온기/라포 보완',
          adjUse: '라포/피드백',
          adjCaution: '유아화 인상 주의',
        },
        {
          tag: '바이올렛',
          color: '#cdb4ff',
          add: '+ 창의/사색 보완',
          adjUse: '창의/표현 작업',
          adjCaution: '거리감 유발 가능',
        },
        {
          tag: '쿨그레이',
          color: '#e5e7eb',
          add: '+ 중립/정돈 보완',
          adjUse: '표/리스트 배경',
          adjCaution: '무기력 인상 주의',
        },
        {
          tag: '라이트 옐로',
          color: '#fff7ae',
          add: '+ 낙관/주의 환기',
          adjUse: '메모/하이라이트',
          adjCaution: '고채도면 피로',
        },
      ];

      /* Build 120 entries */
      const combos = [];
      bases.forEach((b, i) => {
        accents.forEach((a, j) => {
          combos.push({
            id: String(i * 6 + j + 1).padStart(3, '0'),
            baseKey: b.key,
            name: `${b.name} × ${a.tag}`,
            colors: [b.colors[0], b.colors[1], a.color],
            emotion: b.emotion,
            tone: b.tone,
            goal: b.goal,
            meaning: `${b.meaning} ${a.add}`,
            use: `${b.use} · ${a.adjUse}`,
            caution: `${b.caution} · ${a.adjCaution}`,
          });
        });
      });

      /* ========= UI STATE ========= */
      let mode = 'emotion'; // emotion | tone | goal
      const q = document.getElementById('q');
      const grid = document.getElementById('grid');
      const filterBar = document.getElementById('filterBar');
      const tabs = Array.from(document.querySelectorAll('.tab'));

      const options = {
        emotion: [...new Set(combos.map((c) => c.emotion))],
        tone: [...new Set(combos.map((c) => c.tone))],
        goal: [...new Set(combos.map((c) => c.goal))],
      };

      /* Render filters according to mode (① emotion → ② tone → ③ goal) */
      let activeFilter = 'ALL';
      function renderFilters() {
        filterBar.innerHTML = '';
        const allBtn = document.createElement('button');
        allBtn.className = 'filter' + (activeFilter === 'ALL' ? ' active' : '');
        allBtn.textContent = '전체 보기';
        allBtn.onclick = () => {
          activeFilter = 'ALL';
          renderGrid();
        };
        filterBar.appendChild(allBtn);

        options[mode].forEach((v) => {
          const b = document.createElement('button');
          b.className = 'filter' + (activeFilter === v ? ' active' : '');
          b.textContent = v;
          b.onclick = () => {
            activeFilter = activeFilter === v ? 'ALL' : v;
            renderGrid();
          };
          filterBar.appendChild(b);
        });
      }

      /* Render grid cards */
      function renderGrid() {
        const term = (q.value || '').trim().toLowerCase();
        const items = combos.filter((c) => {
          const passFilter = activeFilter === 'ALL' || c[mode] === activeFilter;
          const passSearch =
            !term ||
            (
              c.name +
              c.emotion +
              c.tone +
              c.goal +
              c.meaning +
              c.use +
              c.caution
            )
              .toLowerCase()
              .includes(term);
          return passFilter && passSearch;
        });
        grid.innerHTML = '';
        items.forEach((c) => {
          const card = document.createElement('div');
          card.className = 'card';
          const head = document.createElement('div');
          head.className = 'head';
          head.innerHTML = `<div class="name">#${c.id} ${c.name}</div>
                    <div class="pill">${c.emotion} · ${c.tone} · ${c.goal}</div>`;
          const sw = document.createElement('div');
          sw.className = 'sw';
          c.colors.forEach((h) => {
            const s = document.createElement('div');
            s.className = 'chip';
            s.style.background = h;
            sw.appendChild(s);
          });
          const info = document.createElement('div');
          info.className = 'row';
          info.innerHTML = `
      <div><b>심리 의미</b>: ${c.meaning}</div>
      <div><b>활용</b>: ${c.use}</div>
      <div class="k"><b>주의</b>: ${c.caution}</div>
    `;
          card.appendChild(head);
          card.appendChild(sw);
          card.appendChild(info);
          grid.appendChild(card);
        });
      }

      /* Tabs */
      tabs.forEach((t) => {
        t.addEventListener('click', () => {
          tabs.forEach((x) => x.classList.remove('active'));
          t.classList.add('active');
          mode = t.dataset.mode;
          activeFilter = 'ALL';
          renderFilters();
          renderGrid();
        });
      });

      /* Search */
      q.addEventListener('input', () => renderGrid());

      /* Initial render in required order ① emotion */
      renderFilters();
      renderGrid();
    </script>

    <!-- 회원 세션 전역 변수 -->
    <script src="/static/member_session.js"></script>
    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="/static/admin_session.js"></script>
    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="/static/security.js"></script>
  </body>
