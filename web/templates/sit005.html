<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIT005 트리 그리드 (SYSREF=부모루트, SECREF=자식) — 단일 HTML</title>
    <style>
      :root {
        /* 기본(라이트 민트) 테마 */
        --bg: #f6faf8;
        --fg: #243036;
        --muted: #5b6a72;
        --card: #ffffff;
        --line: #e6eeea;
        --accent: #3bb29d;
        --accent-weak: #dbf2ec;
        --warn: #d33;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        --radius: 14px;
      }
      [data-theme='sand'] {
        --bg: #fbfaf7;
        --fg: #2e2a25;
        --muted: #6c655c;
        --card: #ffffff;
        --line: #eee7dc;
        --accent: #c99a4b;
        --accent-weak: #f5ead6;
      }
      [data-theme='lavender'] {
        --bg: #f8f7fb;
        --fg: #2f2a3a;
        --muted: #6a6383;
        --card: #ffffff;
        --line: #e9e6f3;
        --accent: #7b6ef6;
        --accent-weak: #ebe9ff;
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          'Noto Sans KR', Helvetica, Arial, 'Apple Color Emoji',
          'Segoe UI Emoji';
      }
      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
        gap: 12px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: saturate(1.2) blur(6px);
        background: color-mix(in oklab, var(--bg) 88%, white 12%);
        box-shadow: var(--shadow);
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        padding: 10px clamp(12px, 3vw, 24px);
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .controls {
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      .right {
        display: flex;
        gap: 10px;
        justify-content: end;
        align-items: center;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        padding: 8px 12px;
        border-radius: 999px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        background: color-mix(
          in oklab,
          var(--card) 80%,
          var(--accent-weak) 20%
        );
      }
      .btn.primary {
        background: var(--accent);
        color: white;
        border-color: color-mix(in oklab, var(--accent) 60%, black 8%);
      }
      .btn.primary:hover {
        filter: saturate(1.05) brightness(1.02);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.warn {
        background: #fff2f2;
        color: #9b1c1c;
        border-color: #ffd6d6;
      }

      input[type='text'],
      input[type='number'],
      select {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        padding: 9px 12px;
        border-radius: 10px;
        outline: none;
        width: 100%;
      }
      input::placeholder {
        color: color-mix(in oklab, var(--muted) 60%, var(--fg) 40%);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(220px, 320px) 1fr;
        gap: 14px;
        padding: 0 clamp(12px, 3vw, 24px) clamp(18px, 3vw, 28px);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      /* 좌측: 트리 */
      .tree-pane {
        display: flex;
        flex-direction: column;
        min-height: 60vh;
      }
      .tree-toolbar {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .tree {
        padding: 12px;
        overflow: auto;
        scrollbar-gutter: stable;
        flex: 1;
      }
      .tree ul {
        list-style: none;
        padding-left: 14px;
        margin: 4px 0;
        border-left: 1px dashed var(--line);
      }
      .tree li {
        margin: 4px 0;
      }
      .node {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: 6px;
        border-radius: 10px;
        padding: 6px 8px;
        cursor: pointer;
      }
      .node:hover {
        background: var(--accent-weak);
      }
      .chev {
        width: 18px;
        height: 18px;
        display: inline-grid;
        place-items: center;
        border-radius: 6px;
      }
      .badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--accent-weak);
        color: var(--fg);
        border: 1px solid var(--line);
      }
      .muted {
        color: var(--muted);
        font-weight: 600;
      }
      .hidden {
        display: none;
      }
      .node.active {
        outline: 2px solid var(--accent);
        background: color-mix(in oklab, var(--accent-weak) 60%, white 40%);
      }

      /* 우측: 그리드 + 폼 */
      .main {
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 12px;
        min-height: 60vh;
      }
      .grid-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .grid-wrap {
        overflow: auto;
        padding: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px 8px;
        text-align: left;
        font-size: 14px;
      }
      th {
        position: sticky;
        top: 0;
        background: color-mix(in oklab, var(--card) 92%, var(--bg) 8%);
        z-index: 1;
      }
      tr:hover td {
        background: color-mix(in oklab, var(--accent-weak) 35%, white 65%);
      }
      tr.selected td {
        outline: 2px solid var(--accent);
        background: color-mix(in oklab, var(--accent-weak) 65%, white 35%);
      }

      .form {
        display: grid;
        grid-template-columns: repeat(6, minmax(100px, 1fr));
        gap: 10px;
        padding: 12px;
      }
      .form .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
      }

      .pill {
        padding: 6px 10px;
        background: var(--accent-weak);
        border: 1px solid var(--line);
        border-radius: 999px;
        font-weight: 700;
      }

      /* 모바일/태블릿 대응 */
      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .toolbar {
          grid-template-columns: 1fr;
        }
        .controls {
          justify-content: start;
        }
      }
    </style>
  </head>
  <body data-theme="mint">
    <div class="app">
      <header class="card">
        <div class="toolbar">
          <div class="brand">
            📁 SIT005 트리 그리드
            <span class="pill">SYSREF=부모루트 · SECREF=자식</span>
          </div>
          <div class="controls">
            <input
              id="searchInput"
              type="text"
              placeholder="검색: SEC / CD / NM / SECREF / SYSREF"
            />
            <button class="btn" id="btnSearch">검색</button>
            <button class="btn ghost" id="btnClear">지우기</button>
          </div>
          <div class="right">
            <label class="muted" for="themeSelect">테마</label>
            <select id="themeSelect">
              <option value="mint">라이트 민트</option>
              <option value="sand">샌드</option>
              <option value="lavender">라벤더</option>
            </select>
          </div>
        </div>
      </header>

      <div class="layout">
        <!-- 좌측: 트리 -->
        <aside class="card tree-pane" aria-label="왼쪽 트리">
          <div class="tree-toolbar">
            <button class="btn" id="btnExpandAll">모두 펼치기</button>
            <button class="btn" id="btnCollapseAll">모두 접기</button>
            <span class="muted" style="margin-left: auto"
              >왼쪽 트리: <b>SYSREF ▶ SECREF ▶ 항목</b></span
            >
          </div>
          <div class="tree" id="treeContainer" role="tree"></div>
        </aside>

        <!-- 우측: 그리드 + 폼 -->
        <section class="card main">
          <div class="grid-toolbar">
            <button class="btn primary" id="btnAdd">추가</button>
            <button class="btn" id="btnEdit">수정</button>
            <button class="btn warn" id="btnDelete">삭제</button>
            <span class="muted" id="statusText" style="margin-left: auto"
              >레코드 0건</span
            >
          </div>

          <div class="form" id="editForm" aria-label="입력 폼" hidden>
            <div class="field">
              <label for="fSEC">SEC (키)</label
              ><input
                id="fSEC"
                type="text"
                maxlength="10"
                placeholder="예: A001"
              />
            </div>
            <div class="field">
              <label for="fCD">CD (키)</label
              ><input
                id="fCD"
                type="text"
                maxlength="10"
                placeholder="예: 01"
              />
            </div>
            <div class="field">
              <label for="fNM">NM (이름)</label
              ><input
                id="fNM"
                type="text"
                maxlength="40"
                placeholder="예: 항목명"
              />
            </div>
            <div class="field">
              <label for="fNO">NO (숫자)</label
              ><input id="fNO" type="number" step="0.001" placeholder="0" />
            </div>
            <div class="field">
              <label for="fSYSREF">SYSREF (부모루트)</label
              ><input
                id="fSYSREF"
                type="text"
                maxlength="40"
                placeholder="부모 루트 식별자"
              />
            </div>
            <div class="field">
              <label for="fSECREF">SECREF (자식 그룹)</label
              ><input
                id="fSECREF"
                type="text"
                maxlength="40"
                placeholder="자식 그룹 식별자"
              />
            </div>
            <div
              style="
                grid-column: 1 / -1;
                display: flex;
                gap: 8px;
                justify-content: flex-end;
              "
            >
              <button class="btn" id="btnCancel">취소</button>
              <button class="btn primary" id="btnSave">저장</button>
            </div>
          </div>

          <div class="grid-wrap">
            <table id="grid" aria-label="SIT005 데이터 그리드">
              <thead>
                <tr>
                  <th style="width: 110px">SEC</th>
                  <th style="width: 90px">CD</th>
                  <th>NM</th>
                  <th style="width: 120px">NO</th>
                  <th style="width: 160px">SECREF (자식)</th>
                  <th style="width: 160px">SYSREF (부모)</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <script>
      /**
       * SIT005 단일 파일 데모
       * - 왼쪽 트리: SYSREF(부모루트) ▶ SECREF(자식) ▶ 항목(SEC/CD)
       * - 우측 그리드: CRUD + 검색
       * - 저장: localStorage('SIT005')
       */
      (function () {
        const STORAGE_KEY = 'SIT005';
        /** @type {Array<{SEC:string, CD:string, NM:string, NO:number, SECREF:string|null, SYSREF:string|null}>} */
        let rows = load() || demoSeed();
        let selection = null; // currently selected row key {SEC,CD}
        let filter = { text: '', sysref: null, secref: null };
        let editing = null; // null | {mode:'add'|'edit', key?:{SEC,CD}}

        // DOM refs
        const gridBody = document.querySelector('#grid tbody');
        const statusText = document.getElementById('statusText');
        const searchInput = document.getElementById('searchInput');
        const btnSearch = document.getElementById('btnSearch');
        const btnClear = document.getElementById('btnClear');
        const treeContainer = document.getElementById('treeContainer');
        const btnExpandAll = document.getElementById('btnExpandAll');
        const btnCollapseAll = document.getElementById('btnCollapseAll');
        const btnAdd = document.getElementById('btnAdd');
        const btnEdit = document.getElementById('btnEdit');
        const btnDelete = document.getElementById('btnDelete');
        const form = document.getElementById('editForm');
        const fSEC = document.getElementById('fSEC');
        const fCD = document.getElementById('fCD');
        const fNM = document.getElementById('fNM');
        const fNO = document.getElementById('fNO');
        const fSYSREF = document.getElementById('fSYSREF');
        const fSECREF = document.getElementById('fSECREF');
        const btnSave = document.getElementById('btnSave');
        const btnCancel = document.getElementById('btnCancel');
        const themeSelect = document.getElementById('themeSelect');

        // INIT
        hydrateTheme();
        renderAll();

        // === Event wiring ===
        btnSearch.addEventListener('click', () => {
          filter.text = searchInput.value.trim();
          renderAll();
        });
        btnClear.addEventListener('click', () => {
          searchInput.value = '';
          filter.text = '';
          filter.sysref = null;
          filter.secref = null;
          renderAll();
          highlightActiveNode();
        });
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            btnSearch.click();
          }
        });

        btnExpandAll.addEventListener('click', () => toggleAll(true));
        btnCollapseAll.addEventListener('click', () => toggleAll(false));

        btnAdd.addEventListener('click', () => startAdd());
        btnEdit.addEventListener('click', () => startEdit());
        btnDelete.addEventListener('click', () => doDelete());

        btnSave.addEventListener('click', () => saveForm());
        btnCancel.addEventListener('click', () => cancelForm());

        themeSelect.addEventListener('change', (e) => {
          const t = e.target.value;
          document.body.setAttribute('data-theme', t);
          localStorage.setItem('SIT005_THEME', t);
        });

        // === Renderers ===
        function renderAll() {
          renderTree();
          renderGrid();
        }

        function renderGrid() {
          const filtered = applyFilter(rows, filter);
          const frag = document.createDocumentFragment();
          gridBody.innerHTML = '';

          filtered.forEach((r) => {
            const tr = document.createElement('tr');
            tr.tabIndex = 0;
            tr.dataset.key = JSON.stringify({ SEC: r.SEC, CD: r.CD });
            if (selection && selection.SEC === r.SEC && selection.CD === r.CD)
              tr.classList.add('selected');
            tr.innerHTML = `
        <td>${esc(r.SEC)}</td>
        <td>${esc(r.CD)}</td>
        <td>${esc(r.NM)}</td>
        <td>${r.NO ?? ''}</td>
        <td>${esc(r.SECREF ?? '')}</td>
        <td>${esc(r.SYSREF ?? '')}</td>
      `;
            tr.addEventListener('click', () => {
              gridBody
                .querySelectorAll('tr')
                .forEach((el) => el.classList.remove('selected'));
              tr.classList.add('selected');
              selection = { SEC: r.SEC, CD: r.CD };
            });
            frag.appendChild(tr);
          });
          gridBody.appendChild(frag);
          statusText.textContent = `레코드 ${filtered.length}건 / 총 ${rows.length}건`;
        }

        function renderTree() {
          // SYSREF(부모루트) ▶ SECREF(자식) ▶ 항목
          const bySYS = groupBy(rows, (r) => (r.SYSREF ?? '') || '(미지정)');
          const ulSYS = document.createElement('ul');
          Object.keys(bySYS)
            .sort(localeSort)
            .forEach((sys) => {
              const sysNode = makeNode(
                sys,
                `SYSREF: ${sys}`,
                bySYS[sys].length
              );
              const ulSECREF = document.createElement('ul');
              const bySECREF = groupBy(
                bySYS[sys],
                (r) => (r.SECREF ?? '') || '(미지정)'
              );
              Object.keys(bySECREF)
                .sort(localeSort)
                .forEach((secref) => {
                  const secNode = makeNode(
                    secref,
                    `SECREF: ${secref}`,
                    bySECREF[secref].length
                  );
                  const ulItems = document.createElement('ul');
                  bySECREF[secref]
                    .slice()
                    .sort((a, b) => localeSort(a.SEC + b.CD, b.SEC + b.CD))
                    .forEach((r) => {
                      const li = document.createElement('li');
                      const title = `${r.SEC}/${r.CD} — ${r.NM}`;
                      const rowNode = makeLeaf(title, r);
                      li.appendChild(rowNode);
                      ulItems.appendChild(li);
                    });
                  const liSEC = document.createElement('li');
                  liSEC.appendChild(secNode);
                  liSEC.appendChild(ulItems);
                  ulSECREF.appendChild(liSEC);
                });
              const liSYS = document.createElement('li');
              liSYS.appendChild(sysNode);
              liSYS.appendChild(ulSECREF);
              ulSYS.appendChild(liSYS);
            });
          treeContainer.innerHTML = '';
          treeContainer.appendChild(ulSYS);

          // 초기 접기 (상위만 보이게)
          treeContainer
            .querySelectorAll('ul ul')
            .forEach((u) => u.classList.add('hidden'));
          // 현재 필터 반영하여 펼침/선택 강조
          highlightActiveNode();
        }

        function makeNode(key, label, count) {
          const div = document.createElement('div');
          div.className = 'node';
          div.setAttribute('role', 'treeitem');
          div.innerHTML = `
      <span class="chev" aria-hidden="true">▸</span>
      <span><b>${esc(label)}</b></span>
      <span class="badge">${count}</span>
    `;
          div.addEventListener('click', (e) => {
            e.stopPropagation();
            const ul = div.parentElement?.querySelector(':scope > ul');
            if (ul) ul.classList.toggle('hidden');
            // 필터 갱신
            if (label.startsWith('SYSREF: ')) {
              filter.sysref = key === '(미지정)' ? '' : key;
              filter.secref = null;
            } else if (label.startsWith('SECREF: ')) {
              // 상위 SYSREF 값도 추적
              const sysLabel =
                div.closest('li')?.parentElement?.previousElementSibling
                  ?.textContent || '';
              const sysKey = sysLabel.replace(/.*SYSREF:\s*/, '').trim();
              filter.sysref = sysKey === '(미지정)' ? '' : sysKey;
              filter.secref = key === '(미지정)' ? '' : key;
            }
            renderGrid();
            highlightActiveNode();
          });
          return div;
        }

        function makeLeaf(title, row) {
          const div = document.createElement('div');
          div.className = 'node';
          div.innerHTML = `
      <span class="chev" aria-hidden="true">•</span>
      <span>${esc(title)}</span>
      <span class="badge">ITEM</span>
    `;
          div.addEventListener('click', (e) => {
            e.stopPropagation();
            selection = { SEC: row.SEC, CD: row.CD };
            filter.sysref = row.SYSREF ?? '';
            filter.secref = row.SECREF ?? '';
            renderGrid();
            highlightActiveNode();
            scrollToSelectedInGrid();
          });
          return div;
        }

        function toggleAll(expand) {
          treeContainer
            .querySelectorAll('ul ul')
            .forEach((u) => u.classList.toggle('hidden', !expand));
        }

        function highlightActiveNode() {
          // 전체 초기화
          treeContainer
            .querySelectorAll('.node')
            .forEach((n) => n.classList.remove('active'));
          if (filter.sysref === null && filter.secref === null && !filter.text)
            return;
          // SYSREF 라벨 노드 찾기
          if (filter.sysref !== null) {
            treeContainer.querySelectorAll('.node').forEach((n) => {
              if (
                n.textContent?.includes(
                  `SYSREF: ${filter.sysref || '(미지정)'}`
                )
              ) {
                n.classList.add('active');
                const ul = n.parentElement?.querySelector(':scope > ul');
                ul && ul.classList.remove('hidden');
              }
            });
          }
          if (filter.secref !== null) {
            treeContainer.querySelectorAll('.node').forEach((n) => {
              if (
                n.textContent?.includes(
                  `SECREF: ${filter.secref || '(미지정)'}`
                )
              ) {
                n.classList.add('active');
                const ul = n.parentElement?.querySelector(':scope > ul');
                ul && ul.classList.remove('hidden');
              }
            });
          }
        }

        function scrollToSelectedInGrid() {
          const tr = gridBody.querySelector('tr.selected');
          if (tr) tr.scrollIntoView({ block: 'center' });
        }

        function applyFilter(list, flt) {
          let out = list.slice();
          if (flt.text) {
            const q = flt.text.toLowerCase();
            out = out.filter((r) =>
              [r.SEC, r.CD, r.NM, r.SECREF || '', r.SYSREF || ''].some((v) =>
                String(v).toLowerCase().includes(q)
              )
            );
          }
          if (flt.sysref !== null)
            out = out.filter((r) => (r.SYSREF || '') === (flt.sysref || ''));
          if (flt.secref !== null)
            out = out.filter((r) => (r.SECREF || '') === (flt.secref || ''));
          return out;
        }

        // === CRUD ===
        function startAdd() {
          editing = { mode: 'add' };
          form.hidden = false;
          fSEC.value = '';
          fCD.value = '';
          fNM.value = '';
          fNO.value = '';
          fSYSREF.value = filter.sysref ?? '';
          fSECREF.value = filter.secref ?? '';
          fSEC.focus();
        }
        function startEdit() {
          if (!selection) {
            alert('수정할 행을 먼저 선택하세요.');
            return;
          }
          const r = findByKey(selection.SEC, selection.CD);
          if (!r) {
            alert('선택된 행을 찾을 수 없습니다.');
            return;
          }
          editing = { mode: 'edit', key: { ...selection } };
          form.hidden = false;
          fSEC.value = r.SEC;
          fCD.value = r.CD;
          fNM.value = r.NM;
          fNO.value = r.NO ?? '';
          fSYSREF.value = r.SYSREF ?? '';
          fSECREF.value = r.SECREF ?? '';
          fSEC.focus();
        }
        function cancelForm() {
          editing = null;
          form.hidden = true;
        }

        function saveForm() {
          const rec = {
            SEC: fSEC.value.trim(),
            CD: fCD.value.trim(),
            NM: fNM.value.trim(),
            NO: fNO.value === '' ? null : Number(fNO.value),
            SYSREF: fSYSREF.value.trim() || '',
            SECREF: fSECREF.value.trim() || '',
          };
          if (!rec.SEC || !rec.CD || !rec.NM) {
            alert('SEC, CD, NM 은 필수입니다.');
            return;
          }

          if (editing?.mode === 'add') {
            if (exists(rec.SEC, rec.CD)) {
              alert('중복 키입니다. (SEC,CD) 조합은 고유해야 합니다.');
              return;
            }
            rows.push(rec);
          } else if (editing?.mode === 'edit') {
            // 키 변경 허용: 고유성 검사
            if (
              (rec.SEC !== editing.key.SEC || rec.CD !== editing.key.CD) &&
              exists(rec.SEC, rec.CD)
            ) {
              alert('수정된 키가 기존 레코드와 중복됩니다.');
              return;
            }
            const idx = rows.findIndex(
              (r) => r.SEC === editing.key.SEC && r.CD === editing.key.CD
            );
            if (idx >= 0) rows[idx] = rec;
            else {
              alert('수정 대상이 사라졌습니다.');
              return;
            }
            selection = { SEC: rec.SEC, CD: rec.CD };
          }

          persist();
          form.hidden = true;
          editing = null;
          // 트리/그리드 갱신
          renderAll();
          highlightActiveNode();
        }

        function doDelete() {
          if (!selection) {
            alert('삭제할 행을 먼저 선택하세요.');
            return;
          }
          const r = findByKey(selection.SEC, selection.CD);
          if (!r) {
            alert('선택된 행을 찾을 수 없습니다.');
            return;
          }
          if (!confirm(`삭제하시겠습니까?\n- ${r.SEC}/${r.CD} ${r.NM}`)) return;
          rows = rows.filter((x) => !(x.SEC === r.SEC && x.CD === r.CD));
          selection = null;
          persist();
          renderAll();
        }

        // === Utils ===
        function findByKey(SEC, CD) {
          return rows.find((r) => r.SEC === SEC && r.CD === CD);
        }
        function exists(SEC, CD) {
          return rows.some((r) => r.SEC === SEC && r.CD === CD);
        }
        function groupBy(arr, keyFn) {
          return arr.reduce((m, x) => {
            const k = keyFn(x);
            (m[k] || (m[k] = [])).push(x);
            return m;
          }, {});
        }
        function localeSort(a, b) {
          return String(a).localeCompare(String(b), 'ko-KR');
        }
        function esc(s) {
          return String(s).replace(
            /[&<>"']/g,
            (m) =>
              ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
              }[m])
          );
        }

        function persist() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
        }
        function load() {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          } catch {
            return null;
          }
        }

        function hydrateTheme() {
          const t = localStorage.getItem('SIT005_THEME') || 'mint';
          document.body.setAttribute('data-theme', t);
          themeSelect.value = t;
        }
