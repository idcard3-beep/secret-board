<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>admin_users 관리자 계정 관리</title>
    <style>
      :root {
        --bg: #f8fafc; /* 기본(라이트) */
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --brand: #4f46e5;
        --brand-weak: #eef2ff;
        --line: #e2e8f0;
        --accent: #10b981;
        --danger: #ef4444;
        --warn: #f59e0b;
        --shadow: 0 6px 20px rgba(2, 6, 23, 0.08);
      }
      [data-theme='dark'] {
        --bg: #0b1020;
        --panel: #0f172a;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --brand: #8b5cf6;
        --brand-weak: #1f1b3d;
        --line: #1f2a44;
        --accent: #22c55e;
        --danger: #f87171;
        --warn: #fbbf24;
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }
      [data-theme='sepia'] {
        --bg: #f7f1e3;
        --panel: #fff8ea;
        --text: #3b2f2f;
        --muted: #6b5c4a;
        --brand: #b7791f;
        --brand-weak: #f6ead6;
        --line: #e8d9bf;
        --accent: #2f855a;
        --danger: #c53030;
        --warn: #b7791f;
        --shadow: 0 6px 20px rgba(139, 92, 40, 0.15);
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto,
          'Noto Sans KR', Arial, 'Apple SD Gothic Neo', 'Malgun Gothic',
          sans-serif;
      }
      .wrap {
        max-width: 1200px;
        margin: 24px auto;
        padding: 12px;
      }
      .appbar {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .appbar .left {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 14px;
        background: var(--brand-weak);
        color: var(--brand);
        box-shadow: var(--shadow);
        font-weight: 700;
      }
      .logo .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--brand);
      }
      .appbar .right {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: var(--shadow);
      }
      .btn.primary {
        background: var(--brand);
        color: white;
        border-color: transparent;
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.danger {
        background: var(--danger);
        color: white;
        border-color: transparent;
      }
      .btn.warn {
        background: var(--warn);
        color: black;
        border-color: transparent;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        padding: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        align-items: center;
      }
      .toolbar .role-filter {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .toolbar select,
      .toolbar input {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 10px;
        min-width: 120px;
      }
      .toolbar .search {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .grid-and-form {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      @media (max-width: 980px) {
        .grid-and-form {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }
      .card h3 {
        margin: 0;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
        padding: 8px 10px;
      }
      thead th {
        font-size: 12px;
        color: var(--muted);
        text-align: left;
        position: sticky;
        top: 0;
        background: var(--panel);
      }
      tbody tr {
        background: var(--bg);
        border: 1px solid var(--line);
      }
      tbody tr.selected {
        outline: 2px solid var(--brand);
      }
      td,
      th {
        padding: 10px 12px;
      }
      tbody td {
        font-size: 13px;
      }
      .badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--brand-weak);
        color: var(--brand);
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--line);
      }
      .badge.warn {
        background: #fef3c7;
        color: var(--warn);
        border-color: var(--warn);
      }
      .badge.danger {
        background: #fee2e2;
        color: var(--danger);
        border-color: var(--danger);
      }
      .muted {
        color: var(--muted);
      }
      .grid-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }
      .pagination {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .pagination .btn {
        padding: 6px 10px;
      }
      .form {
        padding: 12px 14px;
        display: grid;
        gap: 10px;
      }
      .form .row {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 10px;
        align-items: center;
      }
      @media (max-width: 560px) {
        .form .row {
          grid-template-columns: 1fr;
        }
      }
      .form input,
      .form select,
      .form textarea {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        padding: 10px;
        border-radius: 10px;
        width: 100%;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }
      .help {
        padding: 8px 14px;
        color: var(--muted);
        font-size: 12px;
      }
      .pill {
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--brand-weak);
        border: 1px solid var(--line);
      }
      .status {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .sortable {
        cursor: pointer;
      }
      .sortable::after {
        content: ' ⇅';
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body data-theme="light">
    <div class="wrap">
      <div class="appbar">
        <div class="left">
          <div class="logo">
            <span class="dot"></span> 관리자 계정관리(dmin Manager)
          </div>
        </div>
        <div class="right">
          <button class="btn ghost" id="themeLight">라이트</button>
          <button class="btn ghost" id="themeDark">다크</button>
          <button class="btn ghost" id="themeSepia">세피아</button>
          <button class="btn" id="btnClose">닫기</button>
          <label class="btn">
            불러오기
            <input
              id="importJson"
              type="file"
              accept="application/json"
              style="display: none"
            />
          </label>
        </div>
      </div>

      <!-- 상단 1라인: 역할 콤보 + 스마트 검색 + 신규 추가 -->
      <div class="toolbar card" aria-label="admin_users 그리드(검색/필터/정렬)">
        <div class="role-filter">
          <strong>역할</strong>
          <select id="roleFilter">
            <option value="">전체</option>
            <option value="SUPERADMIN">superadmin</option>
            <option value="ADMIN">admin</option>
            <option value="MENTOR">mentor</option>
            <option value="STAFF">staff</option>
            <option value="AUDITOR">auditor</option>
            <option value="AGENT">agent</option>
          </select>
        </div>
        <div class="search">
          <input id="q" placeholder="스마트 검색: 관리자 ID / 계정명 / 역할" />
          <button class="btn" id="btnSearch">검색</button>
          <button class="btn ghost" id="btnReset">초기화</button>
        </div>
        <div style="text-align: right">
          <button class="btn primary" id="btnNew">+ 신규 추가</button>
        </div>
      </div>

      <div class="grid-and-form">
        <!-- GRID -->
        <div class="card" role="region" aria-label="admin_users 그리드">
          <h3>관리자 계정 목록</h3>
          <div class="table-wrap">
            <table id="grid">
              <thead>
                <tr>
                  <th class="sortable" data-key="admin_id">관리자 ID</th>
                  <th class="sortable" data-key="username">계정명</th>
                  <th class="sortable" data-key="role">역할</th>
                  <th class="sortable" data-key="admin_status">상태</th>
                  <th class="sortable" data-key="created_at">생성일</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="grid-footer">
            <div class="status">
              <span class="pill" id="countBadge">0건</span
              ><span class="muted"
                >클릭하면 우측에서 전체 항목을 편집할 수 있어요.</span
              >
            </div>
            <div class="pagination">
              <button class="btn" id="prev">이전</button>
              <span id="pageInfo" class="muted">1 / 1</span>
              <button class="btn" id="next">다음</button>
              <select id="pageSize">
                <option>10</option>
                <option selected>20</option>
                <option>50</option>
              </select>
            </div>
          </div>
        </div>

        <!-- FORM -->
        <div class="card" role="region" aria-label="admin_users 편집">
          <h3>상세/편집</h3>
          <div class="form" id="form">
            <div class="row">
              <label for="f_admin_id"
                >관리자 ID <span class="muted">(PK, 고유)</span></label
              >
              <input id="f_admin_id" placeholder="예: adm001" />
            </div>
            <div class="row">
              <label for="f_username"
                >관리자 계정명
                <span class="muted"><br />(not UNIQUE)</span></label
              >
              <input id="f_username" placeholder="예: 한글, master" />
            </div>
            <div class="row">
              <label for="f_pwd_hash"
                >pwd_hash <span class="muted">(bcrypt)</span></label
              >
              <input id="f_pwd_hash" placeholder="$2b$..." />
            </div>
            <div class="row">
              <label for="f_role">역할</label>
              <select id="f_role">
                <option value="SUPERADMIN">superadmin</option>
                <option value="ADMIN">admin</option>
                <option value="MENTOR">mentor</option>
                <option value="STAFF">staff</option>
                <option value="AUDITOR">auditor</option>
                <option value="AGENT">agent</option>
              </select>
            </div>
            <div class="row">
              <label for="f_admin_status">상태값</label>
              <select id="f_admin_status">
                <option value="OPEN">OPEN (활성)</option>
                <option value="LOCKED">LOCKED (잠김)</option>
                <option value="DELETED">DELETED (삭제)</option>
              </select>
            </div>
            <div class="row">
              <label for="f_created_at">created_at</label>
              <input id="f_created_at" type="datetime-local" />
            </div>

            <div class="row">
              <label for="plain_pw">비밀번호</label>
              <div style="display: flex; gap: 8px">
                <input
                  id="plain_pw"
                  type="password"
                  placeholder="비밀번호 해시 생성용"
                />
                <button class="btn warn" id="btnHash">해시 생성</button>
              </div>
            </div>
          </div>
          <div class="actions">
            <button class="btn" id="btnSave">저장(추가/수정)</button>
            <button class="btn danger" id="btnDelete">삭제</button>
            <button class="btn ghost" id="btnClear">초기화</button>
          </div>
          <div class="help">
            • 관리자 ID (PK, 고유)는 유일한 Key &mdash; 역할 배치를 확인 할 것
            .<br />
            • 관리자 ID만 중복은 저장 시 검사합니다.<br />
            • 비밀번호를 먼저 입력후 해시 생성 버튼 클릭후 저장버튼 클릭:
            비밀번호를 철저히 관리합니다.
          </div>
        </div>
      </div>
    </div>

    <!-- bcryptjs 라이브러리 (CDN) - Python bcrypt와 호환 -->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <!-- NOTE: 실제 bcryptjs 라이브러리를 사용하여 Python bcrypt와 호환되는 해시를 생성합니다. -->

    <script>
      // ===== In-memory Store (데모용) =====
      const store = (() => {
        const now = () => new Date().toISOString();
        let rows = [];
        const list = () => rows.slice();
        const upsert = (row) => {
          const i = rows.findIndex((r) => r.admin_id === row.admin_id);
          if (i >= 0) rows[i] = row;
          else rows.unshift(row);
        };
        const remove = (id) => {
          rows = rows.filter((r) => r.admin_id !== id);
        };
        const existsId = (id) => rows.some((r) => r.admin_id === id);
        const existsUsername = (u, exceptId = null) =>
          rows.some((r) => r.username === u && r.admin_id !== exceptId);
        const importAll = (arr) => {
          rows = Array.isArray(arr) ? arr : rows;
        };
        return {
          list,
          upsert,
          remove,
          existsId,
          existsUsername,
          importAll,
          now,
        };
      })();

      // ===== UI State =====
      const state = {
        sortKey: 'created_at',
        sortDir: 'desc',
        page: 1,
        pageSize: 20,
        roleFilter: '',
        q: '',
        selectedId: null,
      };

      const el = (id) => document.getElementById(id);

      function applyFilters(rows) {
        let out = rows;
        if (state.roleFilter)
          out = out.filter((r) => r.role === state.roleFilter);
        if (state.q) {
          const q = state.q.toLowerCase();
          out = out.filter(
            (r) =>
              (r.admin_id || '').toLowerCase().includes(q) ||
              (r.username || '').toLowerCase().includes(q) ||
              (r.role || '').toLowerCase().includes(q)
          );
        }
        out.sort((a, b) => {
          const k = state.sortKey;
          const av = a[k] ?? '';
          const bv = b[k] ?? '';
          if (av === bv) return 0;
          if (state.sortDir === 'asc') return av > bv ? 1 : -1;
          return av < bv ? 1 : -1;
        });
        return out;
      }

      function renderGrid() {
        const rows = applyFilters(store.list());
        const tbody = document.querySelector('#grid tbody');
        tbody.innerHTML = '';
        const total = rows.length;
        const start = (state.page - 1) * state.pageSize;
        const pageRows = rows.slice(start, start + state.pageSize);
        for (const r of pageRows) {
          const tr = document.createElement('tr');
          if (state.selectedId === r.admin_id) tr.classList.add('selected');

          // admin_status에 따른 뱃지 스타일
          const statusClass =
            r.admin_status === 'OPEN'
              ? 'badge'
              : r.admin_status === 'LOCKED'
              ? 'badge warn'
              : 'badge danger';

          tr.innerHTML = `
        <td><code>${r.admin_id}</code></td>
        <td>${escapeHtml(r.username)}</td>
        <td><span class="badge">${r.role}</span></td>
        <td><span class="${statusClass}">${r.admin_status || 'OPEN'}</span></td>
        <td class="muted">${formatLocal(r.created_at)}</td>
      `;
          tr.addEventListener('click', () => selectRow(r.admin_id));
          tbody.appendChild(tr);
        }
        el('countBadge').textContent = `${total}건`;
        const pages = Math.max(1, Math.ceil(total / state.pageSize));
        el('pageInfo').textContent = `${state.page} / ${pages}`;
        el('prev').disabled = state.page <= 1;
        el('next').disabled = state.page >= pages;
      }

      function selectRow(id) {
        state.selectedId = id;
        const row = store.list().find((r) => r.admin_id === id);
        if (!row) return;
        el('f_admin_id').value = row.admin_id || '';
        el('f_username').value = row.username || '';
        el('f_pwd_hash').value = row.pwd_hash || '';
        el('f_role').value = row.role || 'ADMIN';
        el('f_admin_status').value = row.admin_status || 'OPEN';
        el('f_created_at').value = toLocalInput(row.created_at);
        renderGrid();
      }

      function clearForm() {
        state.selectedId = null;
        el('f_admin_id').value = '';
        el('f_username').value = '';
        el('f_pwd_hash').value = '';
        el('f_role').value = 'ADMIN';
        el('f_admin_status').value = 'OPEN';
        el('f_created_at').value = toLocalInput(new Date().toISOString());
        el('plain_pw').value = '';
        renderGrid();
      }

      function save() {
        const admin_id = el('f_admin_id').value.trim();
        const username = el('f_username').value.trim();
        const pwd_hash = el('f_pwd_hash').value.trim();
        const role = el('f_role').value;
        const admin_status = el('f_admin_status').value;
        const created_at_local = el('f_created_at').value;

        if (!admin_id) return alert('admin_id는 필수입니다.');
        if (!username) return alert('username은 필수입니다.');
        if (
          !pwd_hash ||
          (!pwd_hash.startsWith('$2a$') &&
            !pwd_hash.startsWith('$2b$') &&
            !pwd_hash.startsWith('$2y$'))
        ) {
          return alert(
            'pwd_hash가 비어 있거나 bcrypt 형식이 아닙니다. "해시 생성(bcrypt)" 버튼으로 생성하세요.'
          );
        }

        // 유니크 검사 (로컬)
        const isNew = !store.list().some((r) => r.admin_id === admin_id);
        if (isNew && store.existsId(admin_id))
          return alert('중복 admin_id 입니다.');

        // API 호출로 DB에 저장
        const created_at =
          fromLocalInput(created_at_local) || new Date().toISOString();

        const data = {
          admin_id,
          username,
          pwd_hash,
          role,
          admin_status,
          created_at,
        };
        const url = isNew
          ? '/api/v1/admin/users'
          : `/api/v1/admin/users/${encodeURIComponent(admin_id)}`;
        const method = isNew ? 'POST' : 'PUT';

        fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
          .then((res) => {
            if (!res.ok) {
              return res.json().then((err) => {
                throw new Error(err.error || '저장에 실패했습니다.');
              });
            }
            return res.json();
          })
          .then((result) => {
            state.selectedId = admin_id;
            alert('저장되었습니다.');
            // DB에서 최신 데이터 다시 로드
            loadDataFromAPI();
          })
          .catch((err) => {
            console.error('저장 오류:', err);
            alert('저장 중 오류가 발생했습니다: ' + err.message);
          });
      }

      function del() {
        const id = el('f_admin_id').value.trim();
        if (!id) return alert('삭제할 admin_id가 없습니다.');
        if (!confirm(`정말 삭제하시겠습니까? (${id})`)) return;

        // API 호출로 DB에서 삭제
        fetch(`/api/v1/admin/users/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
        })
          .then((res) => {
            if (!res.ok) {
              return res.json().then((err) => {
                throw new Error(err.error || '삭제에 실패했습니다.');
              });
            }
            return res.json();
          })
          .then((result) => {
            clearForm();
            alert('삭제되었습니다.');
            // DB에서 최신 데이터 다시 로드
            loadDataFromAPI();
          })
          .catch((err) => {
            console.error('삭제 오류:', err);
            alert('삭제 중 오류가 발생했습니다: ' + err.message);
          });
      }

      // DB에서 데이터 로드
      function loadDataFromAPI() {
        fetch('/api/v1/admin/users', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
        })
          .then((res) => {
            if (!res.ok) {
              throw new Error('데이터 로드에 실패했습니다.');
            }
            return res.json();
          })
          .then((result) => {
            if (result.ok && result.users) {
              // store에 DB 데이터 로드
              store.importAll(result.users);
              renderGrid();
              console.log(`✅ DB에서 ${result.users.length}개 계정 로드 완료`);
            }
          })
          .catch((err) => {
            console.error('데이터 로드 오류:', err);
            alert('데이터 로드 중 오류가 발생했습니다: ' + err.message);
          });
      }

      // 검색/정렬/페이징
      function bind() {
        el('roleFilter').addEventListener('change', (e) => {
          state.roleFilter = e.target.value;
          state.page = 1;
          renderGrid();
        });
        el('btnSearch').addEventListener('click', () => {
          state.q = el('q').value.trim();
          state.page = 1;
          renderGrid();
        });
        el('btnReset').addEventListener('click', () => {
          el('q').value = '';
          el('roleFilter').value = '';
          state.q = '';
          state.roleFilter = '';
          state.page = 1;
          renderGrid();
        });
        document.querySelectorAll('th.sortable').forEach((th) => {
          th.addEventListener('click', () => {
            const k = th.dataset.key;
            if (state.sortKey === k) {
              state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
            } else {
              state.sortKey = k;
              state.sortDir = 'asc';
            }
            renderGrid();
          });
        });
        el('prev').addEventListener('click', () => {
          if (state.page > 1) {
            state.page--;
            renderGrid();
          }
        });
        el('next').addEventListener('click', () => {
          state.page++;
          renderGrid();
        });
        el('pageSize').addEventListener('change', (e) => {
          state.pageSize = parseInt(e.target.value, 10) || 20;
          state.page = 1;
          renderGrid();
        });

        // 폼/행동
        el('btnNew').addEventListener('click', () => {
          clearForm();
          el('f_admin_id').focus();
        });
        el('btnClear').addEventListener('click', clearForm);
        el('btnSave').addEventListener('click', save);
        el('btnDelete').addEventListener('click', del);

        // 테마
        el('themeLight').addEventListener('click', () => setTheme('light'));
        el('themeDark').addEventListener('click', () => setTheme('dark'));
        el('themeSepia').addEventListener('click', () => setTheme('sepia'));

        // 해시 생성 (Python bcrypt와 동일한 방식: gensalt(rounds=12))
        el('btnHash').addEventListener('click', () => {
          const pw = el('plain_pw').value;
          if (!pw) return alert('비밀번호를 입력하세요.');

          // bcryptjs 라이브러리 로드 확인
          if (
            typeof dcodeIO === 'undefined' ||
            typeof dcodeIO.bcrypt === 'undefined'
          ) {
            alert(
              'bcrypt 라이브러리가 로드되지 않았습니다. 페이지를 새로고침해주세요.'
            );
            return;
          }

          try {
            // dcodeIO.bcrypt 사용 (CDN 라이브러리)
            const salt = dcodeIO.bcrypt.hashSync(pw, 12);
            el('f_pwd_hash').value = salt;
            alert('bcrypt 해시가 생성되었습니다.');
          } catch (error) {
            console.error('해시 생성 오류:', error);
            alert('해시 생성 중 오류가 발생했습니다: ' + error.message);
          }
        });

        // 닫기 버튼
        el('btnClose').addEventListener('click', () => {
          // 이전 페이지로 이동 또는 관리자 메뉴로 이동
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = '/admin_list';
          }
        });

        // 불러오기
        el('importJson').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const text = await file.text();
          try {
            const arr = JSON.parse(text);
            if (!Array.isArray(arr)) throw new Error('배열이 아님');
            store.importAll(arr);
            state.page = 1;
            renderGrid();
            clearForm();
            alert('불러오기 완료');
          } catch (err) {
            alert('JSON 형식이 올바르지 않습니다.');
          } finally {
            e.target.value = '';
          }
        });
      }

      // ===== Helpers =====
      function setTheme(name) {
        document.body.setAttribute('data-theme', name);
        localStorage.setItem('admin_users_theme', name);
      }
      function initTheme() {
        const t = localStorage.getItem('admin_users_theme') || 'light';
        setTheme(t);
      }
      const escapeHtml = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (m) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            }[m])
        );
      function formatLocal(iso) {
        try {
          const d = new Date(iso);
          return d.toLocaleString();
        } catch {
          return iso;
        }
      }
      function toLocalInput(iso) {
        try {
          const d = new Date(iso);
          const tzOffset = d.getTimezoneOffset();
          const local = new Date(d.getTime() - tzOffset * 60000);
          return local.toISOString().slice(0, 16);
        } catch {
          return '';
        }
      }
      function fromLocalInput(localStr) {
        if (!localStr) return null;
        try {
          const d = new Date(localStr);
          const tzOffset = d.getTimezoneOffset();
          const utc = new Date(d.getTime() + tzOffset * 60000);
          return utc.toISOString();
        } catch {
          return null;
        }
      }

      // ===== Boot =====
      initTheme();
      bind();
      loadDataFromAPI(); // DB에서 데이터 로드
      clearForm(); // 폼 기본값 설정
    </script>

    <!-- 회원 세션 전역 변수 -->
    <script src="/static/member_session.js"></script>
    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="/static/admin_session.js"></script>

    <!-- 관리자 로그인 체크 -->
    <script>
      (function checkAdminLogin() {
        // admin_session.js가 로드될 때까지 대기
        if (typeof window.getAdminSession === 'function') {
          const adminSession = window.getAdminSession();

          // 관리자 세션이 없거나 로그인 상태가 아니면 로그인 페이지로 리다이렉트
          if (
            !adminSession ||
            !adminSession.isLoggedIn ||
            !adminSession.admin_id
          ) {
            alert('관리자 로그인이 필요합니다.');
            window.location.href = '/admin_login';
            return;
          }

          console.log('관리자 인증 완료:', adminSession.username);
        } else {
          console.error('admin_session.js가 로드되지 않았습니다.');
          alert('관리자 세션 관리 스크립트를 로드할 수 없습니다.');
          window.location.href = '/admin_login';
        }
      })();
    </script>

    <!-- 복사방지 세션 전역 변수 관리 -->
    <script src="/static/security.js"></script>
    <!-- 관리자 세션 전역 변수 관리 -->
    <script src="/static/admin_session.js"></script>
  </body>
