<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sMembers 관리자 그리드 · 최종 테스트(30건)</title>
    <style>
      :root {
        --bg: #f0f4f8;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --brand: #6366f1;
        --brand-light: #818cf8;
        --accent: #10b981;
        --accent-light: #34d399;
        --warn: #f59e0b;
        --warn-light: #fbbf24;
        --danger: #ef4444;
        --danger-light: #f87171;
        --border: #e0e7ef;
        --chip: #eef2ff;
        --chip-text: #4338ca;
        --radius: 16px;
        --shadow: 0 4px 16px rgba(99, 102, 241, 0.08),
          0 2px 6px rgba(99, 102, 241, 0.04);
        --shadow-lg: 0 12px 32px rgba(99, 102, 241, 0.12),
          0 4px 12px rgba(99, 102, 241, 0.06);
        --glow: 0 0 20px rgba(99, 102, 241, 0.15);
      }
      [data-theme='dark'] {
        --bg: #0b1220;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --brand: #818cf8;
        --brand-light: #a5b4fc;
        --accent: #34d399;
        --accent-light: #6ee7b7;
        --warn: #fbbf24;
        --warn-light: #fcd34d;
        --danger: #f87171;
        --danger-light: #fca5a5;
        --border: #1f2937;
        --chip: #1e293b;
        --chip-text: #a5b4fc;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 4px 10px rgba(0, 0, 0, 0.25);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45),
          0 6px 16px rgba(0, 0, 0, 0.35);
        --glow: 0 0 24px rgba(129, 140, 248, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        background: radial-gradient(
            circle at 20% 15%,
            rgba(99, 102, 241, 0.12),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 85%,
            rgba(16, 185, 129, 0.1),
            transparent 55%
          ),
          var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .wrap {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
        gap: 16px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg);
        backdrop-filter: blur(12px) saturate(180%);
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 2px solid var(--border);
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.08),
          rgba(16, 185, 129, 0.06)
        );
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 16px;
      }
      .brand .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--brand), var(--accent));
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.85;
        }
      }
      .bar .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .btn {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 9px 16px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: var(--shadow);
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-lg);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn.brand {
        background: linear-gradient(135deg, var(--brand), var(--brand-light));
        border-color: transparent;
        color: #fff;
      }
      .btn.brand:hover {
        box-shadow: var(--glow), var(--shadow-lg);
      }
      .btn.accent {
        background: linear-gradient(135deg, var(--accent), var(--accent-light));
        color: #033;
        border-color: transparent;
      }
      .btn.warn {
        background: linear-gradient(135deg, var(--warn), var(--warn-light));
        color: #231;
        border-color: transparent;
      }
      .btn.danger {
        background: linear-gradient(135deg, var(--danger), var(--danger-light));
        color: #fff;
        border-color: transparent;
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.5);
        border-color: var(--border);
        backdrop-filter: blur(8px);
      }

      .layout {
        display: grid;
        grid-template-columns: var(--grid-width, 380px) auto 1fr;
        gap: 0;
        padding: 0 20px 20px;
        height: calc(100vh - 62px);
        position: relative;
      } /* header 제외 */
      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .resizer {
        width: 18px;
        cursor: col-resize;
        background: transparent;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease;
        flex-shrink: 0;
      }
      .resizer:hover {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(99, 102, 241, 0.08),
          transparent
        );
      }
      .resizer::before {
        content: '';
        position: absolute;
        width: 2px;
        height: 40px;
        background: var(--border);
        border-radius: 999px;
        opacity: 0.5;
        transition: all 0.2s ease;
      }
      .resizer:hover::before {
        opacity: 1;
        background: var(--brand);
        height: 60px;
      }
      .resizer.resizing {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(99, 102, 241, 0.12),
          transparent
        );
      }
      .resizer.resizing::before {
        opacity: 1;
        background: var(--brand);
        height: 100%;
      }
      @media (max-width: 1080px) {
        .resizer {
          display: none;
        }
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: box-shadow 0.3s ease;
      }
      .panel:hover {
        box-shadow: var(--shadow-lg);
      }

      /* Left: Grid + filters */
      .gridWrap {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
        margin-right: 0;
      }
      .filters {
        padding: 14px;
        border-bottom: 2px solid var(--border);
        background: linear-gradient(
          180deg,
          rgba(99, 102, 241, 0.04),
          transparent
        );
      }
      .filters h3 {
        margin: 0 0 12px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: linear-gradient(
          135deg,
          var(--chip),
          rgba(99, 102, 241, 0.08)
        );
        color: var(--chip-text);
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid rgba(99, 102, 241, 0.2);
        font-weight: 600;
        font-size: 12px;
        box-shadow: 0 2px 6px rgba(99, 102, 241, 0.1);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 7px 12px;
        border-radius: 12px;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        transition: all 0.2s ease;
      }
      .field:focus-within {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      }
      .field input[type='text'],
      .field select {
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        min-width: 0;
        font-size: 14px;
      }

      .grid {
        overflow: auto;
      }
      .thead,
      .rowItem {
        display: grid;
        grid-template-columns: 120px 120px 60px 90px 1fr;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        font-size: 14px;
        min-height: 34px;
      }
      .grid .thead > div,
      .grid .rowItem > div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .thead {
        position: sticky;
        top: 0;
        background: var(--panel);
        border-bottom: 2px solid var(--border);
        z-index: 1;
        font-weight: 700;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .rowItem {
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .rowItem:hover {
        background: linear-gradient(
          90deg,
          rgba(99, 102, 241, 0.06),
          rgba(16, 185, 129, 0.04)
        );
        transform: translateX(2px);
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid transparent;
        display: inline-block;
      }
      .badge.OPEN {
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.2),
          rgba(16, 185, 129, 0.12)
        );
        color: #047857;
        border-color: rgba(16, 185, 129, 0.3);
      }
      .badge.LOCKED {
        background: linear-gradient(
          135deg,
          rgba(245, 158, 11, 0.2),
          rgba(245, 158, 11, 0.12)
        );
        color: #b45309;
        border-color: rgba(245, 158, 11, 0.3);
      }
      .badge.DELETED {
        background: linear-gradient(
          135deg,
          rgba(239, 68, 68, 0.2),
          rgba(239, 68, 68, 0.12)
        );
        color: #b91c1c;
        border-color: rgba(239, 68, 68, 0.3);
      }

      /* Right: Form */
      .formWrap {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
        margin-left: 0;
      }
      .formHead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        border-bottom: 2px solid var(--border);
        background: linear-gradient(
          180deg,
          rgba(99, 102, 241, 0.04),
          transparent
        );
      }
      .title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .formBody {
        padding: 10px;
        overflow: auto;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(240px, 1fr));
        gap: 8px;
      }
      @media (max-width: 860px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }

      .group {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.6),
          rgba(99, 102, 241, 0.02)
        );
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
        transition: all 0.3s ease;
        margin-bottom: 0;
      }
      .group:hover {
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.08);
        transform: translateY(-1px);
      }
      .group h4 {
        margin: 0 0 6px;
        font-size: 11px;
        color: var(--brand);
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        padding-bottom: 5px;
        border-bottom: 1px solid rgba(99, 102, 241, 0.12);
      }

      .ctrl {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 6px;
        align-items: center;
        margin-bottom: 5px;
      }
      .ctrl:last-child {
        margin-bottom: 0;
      }
      .ctrl label {
        font-weight: 600;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
        word-break: keep-all;
      }
      .ctrl input,
      .ctrl select,
      .ctrl textarea {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        transition: all 0.2s ease;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
        font-size: 13px;
        line-height: 1.4;
      }
      .ctrl input:focus,
      .ctrl select:focus,
      .ctrl textarea:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.12);
      }
      .ctrl input[type='file'] {
        padding: 4px 6px;
        font-size: 12px;
      }
      .ctrl textarea {
        min-height: 50px;
        resize: vertical;
      }

      .formFoot {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 10px 16px;
        border-top: 2px solid var(--border);
        background: linear-gradient(
          180deg,
          transparent,
          rgba(99, 102, 241, 0.03)
        );
        border-bottom-left-radius: var(--radius);
        border-bottom-right-radius: var(--radius);
      }

      .count {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }

      /* 서명 패드 스타일 */
      .sign-wrap {
        display: grid;
        gap: 6px;
        padding: 8px;
        border-radius: 10px;
        background: linear-gradient(
          135deg,
          rgba(125, 169, 255, 0.05),
          rgba(99, 211, 170, 0.05)
        );
        border: 1px solid var(--border);
        margin-top: 6px;
      }
      .sign-pad {
        width: 100%;
        max-width: 680px;
        height: 160px;
        border-radius: 8px;
        border: 2px solid var(--border);
        background: var(--panel);
        touch-action: none;
        box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
      }
      .sign-pad:hover {
        border-color: var(--brand);
        box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.05),
          0 0 0 3px rgba(125, 169, 255, 0.1);
      }
      .sign-tools {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .sign-preview {
        min-height: 100px;
        border: 1px dashed var(--border);
        border-radius: 6px;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }
      .sign-preview img {
        max-width: 100%;
        max-height: 150px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app">
      <header>
        <div class="bar">
          <div class="brand">
            <span class="dot"></span><span>회원가입 관리자</span>
          </div>
          <div class="actions">
            <button class="btn ghost" id="btnTheme" title="테마 전환">
              테마
            </button>
            <button class="btn" id="btnNew">새로 추가</button>
            <button class="btn brand" id="btnSave">저장</button>
            <button class="btn danger" id="btnDelete">삭제</button>
            <button
              class="btn danger"
              id="btnClose"
              style="background: #dc3545; border-color: transparent"
              title="닫기"
            >
              <svg
                style="
                  width: 16px;
                  height: 16px;
                  vertical-align: middle;
                  margin-right: 4px;
                "
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
              닫기
            </button>
          </div>
        </div>
      </header>

      <main class="layout">
        <!-- LEFT: GRID -->
        <section class="panel gridWrap" aria-label="그리드">
          <div class="filters">
            <h3>회원가입 (검색/필터/정렬)</h3>
            <div class="row">
              <label class="chip" title="필터">필터</label>
              <div class="field">
                <select id="statusFilter">
                  <option value="all">상태 전체</option>
                  <option value="OPEN">OPEN</option>
                  <option value="LOCKED">LOCKED</option>
                  <option value="DELETED">DELETED</option>
                </select>
              </div>
              <div class="field">
                <select id="genderFilter">
                  <option value="all">성별 전체</option>
                  <option value="M">남</option>
                  <option value="F">여</option>
                </select>
              </div>
              <div
                class="field"
                style="flex: 1 1 160px"
                title="이름/아이디/이메일/전화 검색"
              >
                🔎
                <input
                  type="text"
                  id="q"
                  placeholder="검색: 이름 · 아이디 · 이메일 · 전화"
                />
              </div>
              <div class="field" title="정렬">
                <select id="sortBy">
                  <option value="created_at_desc">최신등록순</option>
                  <option value="name_asc">이름 ▲</option>
                  <option value="name_desc">이름 ▼</option>
                  <option value="id_asc">아이디 ▲</option>
                  <option value="id_desc">아이디 ▼</option>
                </select>
              </div>
              <button class="btn ghost" id="btnClear">필터 초기화</button>
              <span class="count" id="count"></span>
            </div>
          </div>
          <div class="grid" id="grid" role="table" aria-label="회원 목록">
            <div class="thead" role="row">
              <div>아이디</div>
              <div>이름</div>
              <div>성별</div>
              <div>상태</div>
              <div>생성일</div>
            </div>
            <div id="gridBody"></div>
          </div>
        </section>

        <!-- RESIZER -->
        <div
          class="resizer"
          id="resizer"
          title="드래그하여 그리드 너비 조절"
        ></div>

        <!-- RIGHT: FORM -->
        <section class="panel formWrap" aria-label="항목 상세/수정">
          <div class="formHead">
            <div class="title">상세 · 항목 모두 보기</div>
            <div class="count" id="selInfo">관리자 작업</div>
          </div>
          <form class="formBody" id="form" onsubmit="event.preventDefault();">
            <div class="grid2">
              <div class="group">
                <h4>기본 정보</h4>
                <div class="ctrl">
                  <label>내부키(sM_id)</label
                  ><input id="sM_id" type="number" readonly />
                </div>
                <div class="ctrl">
                  <label>멤버 ID</label
                  ><input
                    id="sMem_id"
                    required
                    maxlength="50"
                    placeholder="고유 아이디"
                  />
                </div>
                <div class="ctrl">
                  <label>비번 Hash</label
                  ><input
                    id="sMem_pwdHash"
                    maxlength="255"
                    placeholder="해시 문자열"
                  />
                </div>
                <div class="ctrl">
                  <label>비번 Salt</label
                  ><input id="sMem_pwd_salt" placeholder="(HEX/BASE64)" />
                </div>
                <div class="ctrl">
                  <label>이름</label><input id="sMem_name" maxlength="50" />
                </div>
                <div class="ctrl">
                  <label>닉네임</label
                  ><input id="sMem_nickname" maxlength="50" />
                </div>
                <div class="ctrl">
                  <label>성별</label>
                  <select id="sMem_gender">
                    <option value="">-</option>
                    <option value="M">M</option>
                    <option value="F">F</option>
                  </select>
                </div>
                <div class="ctrl">
                  <label>양.음.윤 구분</label>
                  <select id="sMem_calendar_type">
                    <option value="양력" selected>양력</option>
                    <option value="음력">음력</option>
                    <option value="윤달">윤달</option>
                  </select>
                </div>
                <div class="ctrl">
                  <label>생일</label><input id="sMem_birthdt" type="date" />
                </div>
                <div class="ctrl">
                  <label>출생연도</label
                  ><input
                    id="sMem_birth_year"
                    type="number"
                    min="1800"
                    max="2100"
                  />
                </div>
                <div class="ctrl">
                  <label>상태</label>
                  <select id="sMem_status">
                    <option>OPEN</option>
                    <option>LOCKED</option>
                    <option>DELETED</option>
                  </select>
                </div>
                <div class="ctrl">
                  <label>가족구분(family_gu)</label>
                  <select id="family_gu">
                    <option value="01">01-본인</option>
                    <option value="02">02-배우자</option>
                    <option value="03">03-남편부</option>
                    <option value="04">04-남편모</option>
                    <option value="05">05-배우자부</option>
                    <option value="06">06-배우자모</option>
                    <option value="07">07-할아버지</option>
                    <option value="08">08-할머니</option>
                    <option value="09">09-자녀</option>

    <input type="file" id="jsonFile" accept="application/json" hidden />

    <script>
      // ---------- Data Layer (PostgreSQL API) ----------
      const API_BASE = '/api/v1/smembers';
      /** @type {Array<any>} */
      let rows = [];
      let selectedId = null; // sM_id

      // API 호출 함수들
      async function loadRows() {
        try {
          const res = await fetch(API_BASE);
          const json = await res.json();
          if (json.ok) {
            rows = json.data || [];
            console.log(`✅ 회원 ${rows.length}명 로드 완료`);
            return rows;
          } else {
            console.error('❌ 회원 로드 실패:', json.error);
            alert('회원 정보를 불러오는데 실패했습니다: ' + json.error);
            return [];
          }
        } catch (e) {
          console.error('❌ API 호출 실패:', e);
          alert('서버와 통신할 수 없습니다: ' + e.message);
          return [];
        }
      }

      async function createRow(data) {
        try {
          const res = await fetch(API_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          const json = await res.json();
          if (json.ok) {
            console.log('✅ 회원 생성 완료:', json.data);
            return json.data;
          } else {
            console.error('❌ 회원 생성 실패:', json.error);
            alert('회원 생성 실패: ' + json.error);
            return null;
          }
        } catch (e) {
          console.error('❌ API 호출 실패:', e);
          alert('서버와 통신할 수 없습니다: ' + e.message);
          return null;
        }
      }

      async function updateRow(sm_id, data) {
        try {
          const res = await fetch(`${API_BASE}/${sm_id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          const json = await res.json();
          if (json.ok) {
            console.log('✅ 회원 수정 완료:', json.data);
            return json.data;
          } else {
            console.error('❌ 회원 수정 실패:', json.error);
            alert('회원 수정 실패: ' + json.error);
            return null;
          }
        } catch (e) {
          console.error('❌ API 호출 실패:', e);
          alert('서버와 통신할 수 없습니다: ' + e.message);
          return null;
        }
      }

      async function deleteRow(sm_id) {
        try {
          const res = await fetch(`${API_BASE}/${sm_id}`, {
            method: 'DELETE',
          });
          const json = await res.json();
          if (json.ok) {
            console.log('✅ 회원 삭제 완료:', sm_id);
            return true;
          } else {
            console.error('❌ 회원 삭제 실패:', json.error);
            alert('회원 삭제 실패: ' + json.error);
            return false;
          }
        } catch (e) {
          console.error('❌ API 호출 실패:', e);
          alert('서버와 통신할 수 없습니다: ' + e.message);
          return false;
        }
      }

      // ---------- UI helpers ----------
      const qs = (s, el = document) => el.querySelector(s);
      const qsa = (s, el = document) => Array.from(el.querySelectorAll(s));

      const gridBody = qs('#gridBody');
      const countEl = qs('#count');
      const selInfo = qs('#selInfo');

      function badgeStatus(s) {
        return `<span class="badge ${s}">${s}</span>`;
      }
      function fmtDate(s) {
        if (!s) return '';
        const d = new Date(s);
        if (Number.isNaN(d.getTime())) return s;
        return d.toISOString().slice(0, 16).replace('T', ' ');
      }

      // filters
      const qInput = qs('#q');
      const sortSelect = qs('#sortBy');
      const statusFilterEl = qs('#statusFilter');
      const genderFilterEl = qs('#genderFilter');

      function getFilter() {
        const q = qInput.value.trim().toLowerCase();
        const sort = sortSelect.value;
        const statusVal = statusFilterEl ? statusFilterEl.value : 'all';
        const genderVal = genderFilterEl ? genderFilterEl.value : 'all';
        const statuses = statusVal === 'all' ? [] : [statusVal];
        const genders = genderVal === 'all' ? [] : [genderVal];
        return { statuses, genders, q, sort };
      }

      function applyFilter() {
        const f = getFilter();
        let list = rows.filter((r) => {
          const status = r.sMem_status || r.smem_status;
          const gender = r.sMem_gender || r.smem_gender;
          const name = (r.sMem_name || r.smem_name || '').toLowerCase();
          const memId = (r.sMem_id || r.smem_id || '').toLowerCase();
          const email = (r.sMem_email || r.smem_email || '').toLowerCase();
          const mobile = (r.sMem_mobile || r.smem_mobile || '').toLowerCase();
          const phone = (r.sMem_phone || r.smem_phone || '').toLowerCase();

          return (
            (f.statuses.length ? f.statuses.includes(status) : true) &&
            (f.genders.length
              ? gender
                ? f.genders.includes(gender)
                : false
              : true) &&
            (f.q
              ? name.includes(f.q) ||
                memId.includes(f.q) ||
                email.includes(f.q) ||
                mobile.includes(f.q) ||
                phone.includes(f.q)
              : true)
          );
        });
        switch (f.sort) {
          case 'name_asc':
            list.sort((a, b) =>
              (a.sMem_name || a.smem_name || '').localeCompare(
                b.sMem_name || b.smem_name || ''
              )
            );
            break;
          case 'name_desc':
            list.sort((a, b) =>
              (b.sMem_name || b.smem_name || '').localeCompare(
                a.sMem_name || a.smem_name || ''
              )
            );
            break;
          case 'id_asc':
            list.sort((a, b) =>
              (a.sMem_id || a.smem_id || '').localeCompare(
                b.sMem_id || b.smem_id || ''
              )
            );
            break;
          case 'id_desc':
            list.sort((a, b) =>
              (b.sMem_id || b.smem_id || '').localeCompare(
                a.sMem_id || a.smem_id || ''
              )
            );
            break;
          default:
            list.sort(
              (a, b) =>
                new Date(b.created_at || 0) - new Date(a.created_at || 0)
            );
        }
        renderGrid(list);
      }

      function renderGrid(list) {
        gridBody.innerHTML = list
          .map((r) => {
            const id = r.sM_id || r.sm_id;
            const memId = r.sMem_id || r.smem_id;
            const name = r.sMem_name || r.smem_name;
            const gender = r.sMem_gender || r.smem_gender;
            const status = r.sMem_status || r.smem_status || 'OPEN';
            const createdAt = r.created_at;

            return `
      <div class="rowItem" role="row" data-id="${id}" title="선택">
        <div>${escapeHTML(memId || '')}</div>
        <div>${escapeHTML(name || '')}</div>
        <div>${gender || ''}</div>
        <div>${badgeStatus(status)}</div>
        <div>${fmtDate(createdAt)}</div>
      </div>
    `;
          })
          .join('');
        countEl.textContent = `${list.length}명`;
      }

      function escapeHTML(str) {
        return String(str).replace(
          /[&<>\"]/g,
          (s) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[s])
        );
      }

      // ---------- Form binding ----------
      const FIELDS = [
        'sM_id',
        'sMem_id',
        'sMem_pwdHash',
        'sMem_pwd_salt',
        'sMem_name',
        'sMem_nickname',
        'sMem_birthdt',
        'sMem_birth_year',
        'sMem_calendar_type',
        'sMem_gender',
        'sMem_buss_name',
        'sMem_comp_name',
        'sMem_phone',
        'sMem_mobile',
        'sMem_email',
        'zipcode',
        'address1',
        'address2',
        'zipcode_s',
        'address1_s',
        'address2_s',
        'sMem_snsgu',
        'sMem_choice1',
        'sMem_choice2',
        'sMem_choice3',
        'sMem_choice4',
        'sMem_choice5',
        'sMem_choice6',
        'sMem_choice7',
        'sMem_choice8',
        'sMem_choice9',
        'sMem_choice10',
        'sMem_choice11',
        'sMem_choice12',
        'sMem_quest',
        'sMem_content_enc',
        'old_name',
        'new_name',
        'sMemfam_id',
        'recommender',
        'applicant',
        'signature_file',
        'signature_canvas_data',
        'reference',
        'sMem_agreement',
        'sMem_agree',
        'sMem_admin_id',
        'sMem_grade',
        'sMem_status',
        'family_gu',
        'adviser_role',
        'created_at',
        'updated_at',
      ];

      function clearForm() {
        FIELDS.forEach((k) => {
          const el = qs('#' + k);
          if (!el) return;
          if (el.type === 'file') {
            el.value = '';
          } else {
            el.value = '';
          }
        });
        selectedId = null;
        selInfo.textContent = '선택 없음';

        // 서명 패드 및 미리보기 초기화
        const signPad = document.getElementById('signPad');
        const signPreview = document.getElementById('signPreviewBox');
        const natureFileDisplay = document.getElementById('natureFileDisplay');

        if (signPad) {
          const ctx = signPad.getContext('2d');
          ctx.clearRect(0, 0, signPad.width, signPad.height);
        }
        if (signPreview) {
          signPreview.innerHTML =
            '<span style="color: var(--muted)">서명 미리보기</span>';
        }
        if (natureFileDisplay) {
          natureFileDisplay.style.display = 'none';
        }
      }

      function fillForm(row) {
        console.log('📝 폼 채우기 시작:', row);

        FIELDS.forEach((k) => {
          const el = qs('#' + k);
          if (!el) {
            console.log(`   ⚠️ 요소 없음: ${k}`);
            return;
          }
          if (el.type === 'file') {
            el.value = '';
            return;
          }

          // PostgreSQL 대소문자 처리: sMem_id 또는 smem_id
          let value = row[k];
          if (value === undefined || value === null) {
            // 소문자 버전 시도
            const lowerKey = k.toLowerCase();
            value = row[lowerKey];
          }

          el.value = value ?? '';
          console.log(`   ✓ ${k} = ${el.value}`);
        });

        selectedId = row.sM_id || row.sm_id;
        selInfo.textContent = `선택: #${selectedId} · ${
          row.sMem_name || row.smem_name || row.sMem_id || row.smem_id || ''
        }`;

        // signature_file 경로가 있으면 서명 패드와 미리보기에 표시
        const signatureFile = row.signature_file;
        const signPad = document.getElementById('signPad');
        const signPreview = document.getElementById('signPreviewBox');
        const signatureCanvasData = document.getElementById(
          'signature_canvas_data'
        );

        if (signatureFile && signPad && signPreview) {
          console.log('🖼️ signature_file 발견:', signatureFile);

          // 이미지 파일인지 확인
          const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(signatureFile);

          if (isImage) {
            // 이미지를 캔버스에 그리기
            const img = new Image();
            img.crossOrigin = 'anonymous'; // CORS 이슈 방지

            img.onload = function () {
              const ctx = signPad.getContext('2d');
              const ratio = Math.max(window.devicePixelRatio || 1, 1);
              const cssW = signPad.clientWidth || 640;
              const cssH = signPad.clientHeight || 200;

              // 캔버스 크기 설정
              signPad.width = Math.floor(cssW * ratio);
              signPad.height = Math.floor(cssH * ratio);
              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.scale(ratio, ratio);

              // 이미지를 캔버스에 맞게 그리기
              const imgAspect = img.width / img.height;
              const canvasAspect = cssW / cssH;
              let drawWidth, drawHeight, offsetX, offsetY;

              if (imgAspect > canvasAspect) {
                // 이미지가 더 넓음 - 너비 기준
                drawWidth = cssW;
                drawHeight = cssW / imgAspect;
                offsetX = 0;
                offsetY = (cssH - drawHeight) / 2;
              } else {
                // 이미지가 더 높음 - 높이 기준
                drawHeight = cssH;
                drawWidth = cssH * imgAspect;
                offsetX = (cssW - drawWidth) / 2;
                offsetY = 0;
              }

              ctx.clearRect(0, 0, cssW, cssH);
              ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);

              // canvas 데이터를 hidden input에 저장
              try {
                const dataUrl = signPad.toDataURL('image/png');
                if (signatureCanvasData) {
                  signatureCanvasData.value = dataUrl;
                }
              } catch (err) {
                console.error('캔버스 데이터 저장 오류:', err);
              }

              console.log('✅ 서명 이미지를 캔버스에 그렸습니다.');
            };

            img.onerror = function () {
              console.error('❌ 이미지 로드 실패:', signatureFile);
              signPreview.innerHTML = `<span style="color: var(--danger);">이미지 로드 실패</span>`;
            };

            img.src = signatureFile;

            // 미리보기에도 표시
            signPreview.innerHTML = `<img src="${signatureFile}" alt="서명" style="max-width: 100%; max-height: 200px; object-fit: contain;">`;
          } else {
            // 이미지가 아닌 경우 경로만 표시
            signPreview.innerHTML = `<div style="text-align: left; padding: 10px;">
              <strong>서명 파일:</strong><br>
              <a href="${signatureFile}" target="_blank" style="color: var(--brand); word-break: break-all;">${signatureFile}</a>
            </div>`;
          }
        } else if (signPreview) {
          // signature_file이 없으면 초기화
          signPreview.innerHTML =
            '<span style="color: var(--muted)">서명 미리보기</span>';
          if (signatureCanvasData) {
            signatureCanvasData.value = '';
          }
        }

        // nature_file 경로가 있으면 표시
        const natureFile =
          row.nature_file || row.sMem_nature_file || row.smem_nature_file;
        const natureFileDisplay = document.getElementById('natureFileDisplay');
        const natureFilePreview = document.getElementById('natureFilePreview');

        if (natureFile && natureFileDisplay && natureFilePreview) {
          natureFileDisplay.style.display = 'block';

          // 이미지 파일인지 확인
          const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(natureFile);

          if (isImage) {
            // 이미지로 표시
            natureFilePreview.innerHTML = `<img src="${natureFile}" alt="서명 이미지" style="max-width: 100%; max-height: 200px; object-fit: contain;">`;
          } else {
            // 파일 경로만 표시
            natureFilePreview.innerHTML = `<div style="text-align: left; padding: 10px;">
              <strong>파일 경로:</strong><br>
              <a href="${natureFile}" target="_blank" style="color: var(--brand); word-break: break-all;">${natureFile}</a>
            </div>`;
          }
        } else if (natureFileDisplay) {
          natureFileDisplay.style.display = 'none';
        }

        console.log('✅ 폼 채우기 완료, selectedId:', selectedId);
      }

      // ---------- CRUD ----------
      function nextId() {
        return rows.length ? Math.max(...rows.map((r) => r.sM_id || 0)) + 1 : 1;
      }

      async function upsert() {
        const o = collectForm();
        if (!o.sMem_id) {
          alert('멤버 ID는 필수입니다.');
          return;
        }
        if (!o.sMem_pwdHash) {
          alert('비밀번호는 필수입니다.');
          return;
        }

        if (selectedId == null) {
          // create
          if (
            rows.some(
              (r) =>
                (r.sMem_id || r.smem_id || '').toLowerCase() ===
                o.sMem_id.toLowerCase()
            )
          ) {
            alert('이미 존재하는 멤버 ID 입니다.');
            return;
          }

          if (!o.sMem_status) o.sMem_status = 'OPEN';
          if (!o.family_gu) o.family_gu = '01';
          if (!o.adviser_role) o.adviser_role = 'A';

          const newMember = await createRow(o);
          if (newMember) {
            await loadRows();
            applyFilter();
            selectById(newMember.sm_id);
            alert('등록되었습니다.');
          }
        } else {
          // update
          const idx = rows.findIndex(
            (r) => (r.sM_id || r.sm_id) === selectedId
          );
          if (idx < 0) {
            alert('선택 레코드가 없습니다.');
            return;
          }
          if (
            rows.some(
              (r) =>
                (r.sM_id || r.sm_id) !== selectedId &&
                (r.sMem_id || r.smem_id || '').toLowerCase() ===
                  o.sMem_id.toLowerCase()
            )
          ) {
            alert('이미 존재하는 멤버 ID 입니다.');
            return;
          }

          const updatedMember = await updateRow(selectedId, o);
          if (updatedMember) {
            await loadRows();
            applyFilter();
            selectById(selectedId);
            alert('수정되었습니다.');
          }
        }
      }

      async function remove() {
        if (selectedId == null) {
          alert('삭제할 항목을 먼저 선택하세요.');
          return;
        }
        const idx = rows.findIndex((r) => (r.sM_id || r.sm_id) === selectedId);
        if (idx < 0) return;
        if (!confirm('정말 삭제하시겠습니까? (영구 삭제)')) return;

        const success = await deleteRow(selectedId);
        if (success) {
          await loadRows();
          applyFilter();
          clearForm();
          alert('삭제되었습니다.');
        }
      }

      // ---------- Export/Import ----------
      function exportJSON() {
        const blob = new Blob([JSON.stringify(rows, null, 2)], {
          type: 'application/json',
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sMembers_dataset.json';
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function importJSON(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!Array.isArray(data)) throw new Error('배열 형식이 아님');
            rows = data;
            persist(rows);
            applyFilter();
            clearForm();
            alert('불러왔습니다.');
          } catch (e) {
            alert('JSON 형식 오류: ' + e.message);
          }
        };
        reader.readAsText(file);
      }

      // ---------- Init & Events ----------
      async function init() {
        applyTheme();
        await loadRows();
        applyFilter();

        // Resizer for grid width
        const resizer = document.getElementById('resizer');
        const layout = document.querySelector('.layout');
        let isResizing = false;
        let startX = 0;
        let startWidth = 380;

        // Load saved width
        const savedWidth = localStorage.getItem('gridWidth');
        if (savedWidth) {
          const width = parseInt(savedWidth);
          if (width >= 280 && width <= 900) {
            document.documentElement.style.setProperty(
              '--grid-width',
              width + 'px'
            );
          }
        }

        if (resizer) {
          resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            startX = e.clientX;
            const currentWidth = getComputedStyle(
              document.documentElement
            ).getPropertyValue('--grid-width');
            startWidth = parseInt(currentWidth) || 380;
            resizer.classList.add('resizing');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
          });

          document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            e.preventDefault();
            const deltaX = e.clientX - startX;
            let newWidth = startWidth + deltaX;

            // Min/Max constraints
            newWidth = Math.max(280, Math.min(900, newWidth));

            document.documentElement.style.setProperty(
              '--grid-width',
              newWidth + 'px'
            );
          });

          document.addEventListener('mouseup', () => {
            if (isResizing) {
              isResizing = false;
              resizer.classList.remove('resizing');
              document.body.style.cursor = '';
              document.body.style.userSelect = '';

              // Save width
              const currentWidth = getComputedStyle(
                document.documentElement
              ).getPropertyValue('--grid-width');
              localStorage.setItem('gridWidth', parseInt(currentWidth) || 380);
            }
          });
        }

        // Grid select
        gridBody.addEventListener('click', (e) => {
          const row = e.target.closest('.rowItem');
          if (!row) return;
          const id = Number(row.dataset.id);
          selectById(id);
        });

        // Filters
        if (statusFilterEl)
          statusFilterEl.addEventListener('change', applyFilter);
        if (genderFilterEl)
          genderFilterEl.addEventListener('change', applyFilter);
        qInput.addEventListener('input', applyFilter);
        sortSelect.addEventListener('change', applyFilter);
        document.getElementById('btnClear').addEventListener('click', () => {
          if (statusFilterEl) statusFilterEl.value = 'all';
          if (genderFilterEl) genderFilterEl.value = 'all';
          qInput.value = '';
          sortSelect.value = 'created_at_desc';
          applyFilter();
        });

        // CRUD buttons
        document.getElementById('btnNew').addEventListener('click', () => {
          clearForm();
          fillOneMock();
        });
        document.getElementById('btnSave').addEventListener('click', upsert);
        document.getElementById('btnDelete').addEventListener('click', remove);
        document.getElementById('btnReset').addEventListener('click', () => {
          if (selectedId != null) selectById(selectedId);
          else clearForm();
        });

        // Close button
        document.getElementById('btnClose').addEventListener('click', () => {
          // iframe 내부에서 실행 중인지 확인
          if (window.self !== window.top) {
            // iframe 내부에서 실행 중: 부모 창으로 돌아가기
            window.parent.postMessage('closeIframe', '*');
          } else {
            // 독립 창에서 실행 중: 창 닫기
            window.close();
          }
        });

        // Theme
        document.getElementById('btnTheme').addEventListener('click', () => {
          theme = theme === 'dark' ? 'light' : 'dark';
          applyTheme();
        });

        // Import/Export
        document
          .getElementById('btnExport')
          .addEventListener('click', exportJSON);
        document
          .getElementById('btnImport')
          .addEventListener('click', () =>
            document.getElementById('jsonFile').click()
          );
        document.getElementById('jsonFile').addEventListener('change', (e) => {
          const f = e.target.files?.[0];
          if (f) importJSON(f);
          e.target.value = '';
        });

        // Keyboard UX
        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            upsert();
          }
        });

        // ===== 서명 패드 기능 =====
        (function initSignaturePad() {
          const pad = document.getElementById('signPad');
          const clearBtn = document.getElementById('signClear');
          const saveBtn = document.getElementById('signSave');
          const preview = document.getElementById('signPreviewBox');
          const status = document.getElementById('signStatus');
          const hidden = document.getElementById('signature_canvas_data');
          const penColor = document.getElementById('penColor');
          const penWidth = document.getElementById('penWidth');

          if (!pad || !clearBtn || !saveBtn || !preview || !hidden) return;

          // HiDPI 대응
          function resizeCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            const cssW = pad.clientWidth || 640;
            const cssH = pad.clientHeight || 200;
            pad.width = Math.floor(cssW * ratio);
            pad.height = Math.floor(cssH * ratio);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(ratio, ratio);
          }

          const ctx = pad.getContext('2d');
          ctx.lineWidth = parseFloat(penWidth?.value || '2.5');
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = penColor?.value || '#111';

          let drawing = false;
          let points = [];

          function posFromEvent(e) {
            const rect = pad.getBoundingClientRect();
            if (e.touches && e.touches[0]) {
              return {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top,
              };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
          }

          function drawLine(p1, p2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }

          function start(e) {
            drawing = true;
            points = [];
            points.push(posFromEvent(e));
            e.preventDefault();
          }

          function move(e) {
            if (!drawing) return;
            const p = posFromEvent(e);
            const q = points[points.length - 1];
            drawLine(q, p);
            points.push(p);
            e.preventDefault();
          }

          function end(e) {
            drawing = false;
            e.preventDefault();
          }

          pad.addEventListener('mousedown', start);
          pad.addEventListener('mousemove', move);
          window.addEventListener('mouseup', end);

          pad.addEventListener('touchstart', start, { passive: false });
          pad.addEventListener('touchmove', move, { passive: false });
          pad.addEventListener('touchend', end, { passive: false });

          window.addEventListener('resize', resizeCanvas);
          resizeCanvas();

          function setStatus(msg) {
            if (status) {
              status.textContent = msg;
            }
          }

          function setPreview(dataUrl) {
            preview.innerHTML = '';
            if (dataUrl) {
              const img = new Image();
              img.src = dataUrl;
              img.style.maxWidth = '100%';
              img.style.maxHeight = '200px';
              img.style.objectFit = 'contain';
              preview.appendChild(img);
            } else {
              preview.innerHTML =
                '<span style="color:var(--muted)">서명 미리보기</span>';
            }
          }

          clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, pad.width, pad.height);
            resizeCanvas();
            hidden.value = '';
            setPreview('');
            setStatus('서명이 초기화되었습니다.');
          });

          saveBtn.addEventListener('click', () => {
            try {
              const dataUrl = pad.toDataURL('image/png');
              if (!dataUrl || dataUrl.length < 5000) {
                alert('서명이 너무 짧거나 없습니다. 다시 서명해 주세요.');
                return;
              }
              hidden.value = dataUrl;
              setPreview(dataUrl);
              setStatus('서명이 저장되었습니다.');
            } catch (err) {
              console.error(err);
              setStatus('서명 저장 중 오류가 발생했습니다.');
            }
          });

          // 색/굵기 옵션 즉시 반영
          penColor?.addEventListener('input', (e) => {
            ctx.strokeStyle = e.target.value;
          });
          penWidth?.addEventListener('input', (e) => {
            ctx.lineWidth = parseFloat(e.target.value || '2.5');
          });
        })();
      }

      init();
    </script>
