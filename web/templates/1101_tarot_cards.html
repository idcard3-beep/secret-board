<html lang="ko">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        /* Soft light palette (default) */
        --bg: #f7f8fb;
        --card: #ffffff;
        --text: #1f2437;
        --muted: #6b7393;
        --border: #e7e9f3;
        --primary: #6f7ff0;
        --chip: #eef1ff;
        --soft: #f4f7ff;
        --accent-good: #3fbf7f;
        --accent-bad: #ef6b6b;
        --accent-warn: #f5b64c;
      }
      [data-theme='dark'] {
        /* Optional dark */
        --bg: #0f1320;
        --card: #161a2e;
        --text: #e9edff;
        --muted: #9aa3c7;
        --border: #242a48;
        --primary: #9aa8ff;
        --chip: #1d2240;
        --soft: #12162b;
        --accent-good: #4ade80;
        --accent-bad: #f87171;
        --accent-warn: #fbbf24;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Noto Sans KR', 'Apple SD Gothic Neo', 'Helvetica Neue', Arial;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: saturate(140%) blur(10px);
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.4),
          rgba(0, 0, 0, 0)
        );
      }
      [data-theme='light'] header {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.7),
          rgba(255, 255, 255, 0)
        );
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }
      .search {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 8px 12px;
      }
      .search input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 15px;
      }
      .btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 12px;
      }
      .chip.active {
        outline: 2px solid var(--primary);
      }
      .legend {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        padding: 12px 0 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .thumb {
        aspect-ratio: 3/4;
        border-bottom: 1px solid var(--border);
        background: var(--soft);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
      }
      .meta {
        padding: 8px 10px;
      }
      .title {
        font-weight: 900;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .sub {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .kw {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 6px 0;
      }
      .kw span {
        background: var(--chip);
        border: 1px solid var(--border);
        font-size: 11px;
        border-radius: 999px;
        padding: 3px 6px;
      }
      details {
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 8px;
        margin-top: 6px;
      }
      summary {
        cursor: pointer;
        font-weight: 800;
      }
      .sect {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        margin-top: 6px;
      }
      .row {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 6px;
      }
      .label {
        font-weight: 800;
        color: var(--muted);
        font-size: 11px;
      }
      .badge {
        font-size: 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 6px;
      }
      .tips {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      .count {
        font-size: 12px;
        color: var(--muted);
      }
      .thumb > svg {
        width: 75%;
        height: 75%;
      }
      .card {
        max-width: 480px;
        margin: 0 auto;
      }
    </style>
  </head>

    </header>

              >KPI(측정)</i
            >
            순으로 구조화합니다.
          </li>
        </ul>
      </section>
    </main>

      function makeMinorCards() {
        const deck = [];
        const numBase = {
          Ace: {
            u: ['기회', '시작', '원천'],
            r: ['불균형한 출발', '동기 부족'],

          4: { u: ['안정', '토대', '정착'], r: ['권태', '정체'] },
          5: { u: ['변동', '도전', '시험'], r: ['혼란수습', '재정렬'] },

          7: { u: ['평가', '전략', '선별'], r: ['우유부단', '분산'] },
          8: { u: ['몰입', '숙련', '이동'], r: ['소진', '집착탈피'] },
          9: { u: ['충족', '자립', '성취'], r: ['과잉', '공허'] },
          10: { u: ['완성', '풍요', '결실'], r: ['부담', '과포화'] },
        };
        const courtBase = {
          Page: { u: ['학습', '메신저', '탐색'], r: ['미숙', '피상'] },
          Knight: { u: ['추진', '여정', '실행'], r: ['성급', '무모'] },
          Queen: {
            u: ['숙성', '배려', '내적권위'],
            r: ['과잉보호', '수동공격'],
          },
          King: { u: ['리더', '구조화', '숙련'], r: ['지배', '경직'] },
        };

        for (const suit in SUITS) {
          // pips
          for (const pip of PIPS) {
            const b = numBase[pip];
            deck.push({
              name: `${suit} ${pip}`,
              arcana: 'minor',
              suit,
              up: [SUITS[suit].elem, ...b.u],
              rev: ['경고', ...b.r],
              gen: true,

          }
          // courts
          for (const ct of COURTS) {
            const b = courtBase[ct];
            deck.push({
              name: `${suit} ${ct}`,
              arcana: 'minor',
              suit,
              up: [SUITS[suit].elem, ...b.u],
              rev: ['경고', ...b.r],
              gen: true,
            });
          }
        }
        return deck;

      function svgMinor(suit, label) {
        const color = SUITS[suit].color;
        const sym = SUITS[suit].sym;
        // pip grid
        let pips = '';
        const count = label.match(/Ace|Page|Knight|Queen|King/)
          ? 4
          : parseInt(label.split(' ').pop());
        const n = isNaN(count) ? 6 : count > 10 ? 10 : count; // courts show 4 symbols
        const cols = 3;
        const spacingX = 70,
          spacingY = 60;
        let placed = 0;
        for (let r = 0; r < 5 && placed < n; r++) {
          for (let c = 0; c < cols && placed < n; c++) {
            const x = 60 + c * spacingX,
              y = 110 + r * spacingY;
            pips += `<text x="${x}" y="${y}" font-size="28" fill="#000" opacity=".35">${sym}</text>`;
            placed++;
          }
        }
        return `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="1"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
      </linearGradient>
      <pattern id="pm" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="rgba(0,0,0,.05)"/><circle cx="9" cy="9" r="1.2" fill="rgba(0,0,0,.08)"/></pattern>
    </defs>
    <rect x="8" y="8" width="284" height="384" rx="18" fill="url(#g)"/>
    <rect x="8" y="8" width="284" height="384" rx="18" fill="url(#pm)" opacity=".22"/>
    ${pips}
    <text x="20" y="36" font-size="23" font-weight="900" fill="#000" opacity=".85" stroke="#fff" stroke-width="1" stroke-opacity=".6">${label}</text>
    <text x="150" y="360" text-anchor="middle" font-size="12" fill="#000" opacity=".45">${SUITS[suit].elem}</text>
  </svg>`;
      }

      // ---------------- Build Deck ----------------
      function buildDeck() {
        const majors = MAJOR.map((m) => ({
          name: m.name,
          arcana: 'major',
          suit: 'Major',
          up: m.up,
          rev: m.rev,
          color: m.color,
          key: m.key,
          expl: {
            upright: {
              overview: m.ovU,
              love: m.loveU || '',
              career: m.jobU || '',
              finance: m.moneyU || '',
              health: m.healthU || '',
              coaching: m.coachU || '',
            },
            reversed: {
              overview: m.ovR || '',
              love: m.loveR || '',
              career: m.jobR || '',
              finance: m.moneyR || '',
              health: m.healthR || '',
              coaching: m.coachR || '',
            },
          },
        }));

        const minors = makeMinorCards().map((c) => {
          const suit = SUITS[c.suit];
          // Template explanations based on suit + rank class
          const name = c.name;
          const isCourt = /Page|Knight|Queen|King/.test(name);
          const topic = suit.elem.split('/')[1];
          const role = isCourt ? name.split(' ').pop() : null;
          function tmplU() {
            if (isCourt) {
              return {
                overview: `${
                  c.suit
                }의 성질이 인물형으로 드러납니다. ${role}는 ${
                  role === 'Page'
                    ? '탐색과 학습'
                    : role === 'Knight'
                    ? '추진과 이동'
                    : role === 'Queen'
                    ? '성숙한 배려와 감수성'
                    : '구조화와 리더십'
                }의 상징입니다.`,
                love: `상대/본인의 ${role}적 태도 확인: 경계·속도·표현의 균형을 잡으세요.`,
                career: `${role} 역할이 요구됩니다. 책임/권한을 명확히 하고 피드백 루프를 설계하세요.`,
                finance: `리스크 관리와 페이싱. 과감함과 안전망의 균형.`,
                health: `리듬과 회복의 균형 유지.`,
                coaching: `상황→역할 적합도→행동 1개를 선택·실행.`,
              };
            } else {
              const rank = name.split(' ').pop();
              return {
                overview: `${c.suit}의 핵심 주제(${suit.elem})가 ${rank}의 수비학과 결합합니다.`,
                love: `${topic}을(를) 중심으로 상호성을 점검하세요.`,
                career: `업무 플로우에서 ${topic} 측면을 최적화.`,
                finance: `현금흐름·가치·리스크를 ${rank} 의미에 맞춰 점검.`,
                health: `루틴과 ${topic} 관련 스트레스 조절.`,
                coaching: `문제 정의→작은 실행→측정으로 1사이클.`,
              };
            }
          }
          function tmplR() {
            return {
              overview: `${name} 역위치는 ${topic}에서 과잉/부족/저항이 발생했음을 시사합니다.`,
              love: `감정 과잉/회피 패턴을 언어화하고 경계를 재설정.`,
              career: `우선순위/권한/역할 혼선을 정리하고 실험으로 복구.`,
              finance: `과소비/집착/지연 중 무엇인지 규명하고 규칙 1개 도입.`,
              health: `과부하 신호 식별·회복 프로토콜 적용.`,
              coaching: `중단 기준/손절 조건을 명확히 하고 재시도.`,
            };
          }
          return {
            name: c.name,
            arcana: 'minor',
            suit: c.suit,
            up: c.up,
            rev: c.rev,
            color: suit.color,
            expl: { upright: tmplU(), reversed: tmplR() },
          };
        });

        return [...majors, ...minors];
      }

      const DECK = buildDeck();

          }</div></div>
        </div>
        <div class="tips">상담 루틴: 문제→가설→작은 실행(48시간 내)→KPI(행동/감정/지표) 점검.</div>
      </details>
    </div>
  </article>`;
      }

      function render(list) {
        grid.innerHTML = list.map(cardHTML).join('');
        countEl.textContent = `표시: ${list.length} / 78`;
      }

      function applyFilter() {
        const txt = state.q.trim().toLowerCase();
        const out = DECK.filter((c) => {
          const okA = state.arcana === 'all' ? true : c.arcana === state.arcana;
          const okQ = !txt
            ? true
            : (c.name + ' ' + c.up.join(' ') + ' ' + c.rev.join(' '))
                .toLowerCase()
                .includes(txt);
          return okA && okQ;
        });
        render(out);
      }

      q.addEventListener('input', (e) => {
        state.q = e.target.value;
        applyFilter();
      });

      document.getElementById('chips-arcana').addEventListener('click', (e) => {
        const t = e.target.closest('.chip');
        if (!t) return;
        [...e.currentTarget.children].forEach((c) =>
          c.classList.remove('active')
        );
        t.classList.add('active');
        state.arcana = t.dataset.arcana;
        applyFilter();
      });

      // init
      render(DECK);
    </script>
